<!doctype html>
<html lang="fr" data-theme="bibliotheque">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <script>(function(){try{var d=document.documentElement,a=JSON.parse(localStorage.getItem('shelfhold.appearance')||'null');if(a&&a.theme==='bibliotheque')d.dataset.theme='bibliotheque';if(a&&(a.colorScheme==='light'||a.colorScheme==='dark'))d.dataset.colorScheme=a.colorScheme}catch(e){}})();</script>
    %sveltekit.head%
  </head>
  <body>
    %sveltekit.body%
  </body>
</html>
