<!doctype html>
<html lang="fr" data-theme="bibliotheque">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>(function(){try{var d=document.documentElement,a=JSON.parse(localStorage.getItem('shelfhold.appearance')||'null');if(a&&['bibliotheque','console','galerie','calme'].indexOf(a.theme)>=0)d.dataset.theme=a.theme;if(a&&(a.colorScheme==='light'||a.colorScheme==='dark'))d.dataset.colorScheme=a.colorScheme}catch(e){}})();</script>
    <!-- Capability, never the browser's name (EF-LEC-010): a browser that does not know module scripts
         ignores the SPA and runs this one; one without JavaScript follows the refresh. Both go
         to the server-rendered pages. -->
    <script nomodule>location.replace('/lite')</script>
    <noscript><meta http-equiv="refresh" content="0;url=/lite" /></noscript>
    %sveltekit.head%
  </head>
  <body>
    %sveltekit.body%
  </body>
</html>
