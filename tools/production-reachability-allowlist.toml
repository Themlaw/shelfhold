]

[[allow]]
category = "unwired-m5"
reason = "2026-11-14 (M3 L56, D9): `content_response` serves untrusted content under a sandbox (B1). M3 serves no content: reading goes through Kavita, and the reader of Shelfhold is M5's. Redated M5 in writing (docs/decisions/M3.md). The diagnostic bundle is wired by its CLI (M2 L30) and by its download over HTTP (M3 L46); `attachment_disposition` left this entry with M3 L40. The `?since=` tokens left this entry with M3 L11."
until = "M5"
symbols = [
  "shelfhold.interfaces.http_api.content:content_response",
]

[[allow]]
category = "unwired-m4-komga"
reason = "2026-11-16 (M4 L08a): the Komga destination is described, tested against a fake and declared to the core (`KomgaDestination.capabilities`, read by `FirstPartyDestinations`), but nothing creates a Komga target yet and the export pass does not ask it for a scan: the card of L08a stops at the client and the destination. Its first callers are the creation of the target (key sealed by `store_komga_key`) and the scan relay of the pass, written down in docs/decisions/M4.md for the lot that wires them."
until = "M5"  # redated by M4 L43 (2026-11-17, docs/decisions/M4.md): the scan relay and the audit of the pass
# 2026-11-16 (M4 L08b): the audit of the accounts (`KomgaAuditor`, `KomgaClient.list_accounts`) is
# written and tested against the fake, and its proof is read by every binding and every pass
# (`partitioning_of`), but nothing creates a Komga target: its callers are the link of a shelf
# (`admit`, before the binding) and the daily check (`audit`) of the lot that creates the target.
symbols = [
  "shelfhold.export.targets.komga.audit:KomgaAuditor",
  "shelfhold.export.targets.komga.client:KomgaClient",
  "shelfhold.export.targets.komga.credentials:KomgaKey",
  "shelfhold.export.targets.komga.credentials:load_komga_key",
  "shelfhold.export.targets.komga.credentials:store_komga_key",
  "shelfhold.export.targets.komga.errors:KomgaNoLibrary",
  "shelfhold.export.targets.komga.errors:KomgaRouteNotAllowed",
  "shelfhold.export.targets.komga.routes:ALLOWED_ROUTES",
  "shelfhold.export.targets.komga.target:KomgaDestination.layout_conflicts",
  "shelfhold.export.targets.komga.target:KomgaDestination.scan_library_call",
  "shelfhold.export.targets.komga.target:KomgaDestination.forget_removed_call",
  "shelfhold.export.targets.komga.target:KomgaDestination.inventory_calls",
  "shelfhold.export.targets.kavita.destination:KavitaDestination.inventory_calls",
  "shelfhold.export.targets.komga.wiring:open_client",
]

[[allow]]
category = "unwired-m4-cwa"
reason = "2026-11-16 (M4 L09): the CWA drop box is described, executed by the pass (`dropbox_destinations`, `CwaSource` read by `FirstPartyDestinations`) and tested end to end, but nothing creates a `cwa` target yet: the card of L09 stops at the destination. The creation of the target (a reserved action) is for the lot that writes it, recorded in docs/decisions/M4.md."
until = "M5"  # redated by M4 L43 (2026-11-17, docs/decisions/M4.md): a drop box never calls them
