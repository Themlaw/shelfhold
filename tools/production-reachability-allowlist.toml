  "shelfhold.infrastructure.packaging.cbz.packager:write_cbz",
  "shelfhold.catalog.domain.dates:comicinfo_date_fields",
  "shelfhold.catalog.domain.dates:opf_date",
  "shelfhold.catalog.domain.dates:from_upload_timestamp",
  "shelfhold.plugin_host.registry:*",
  "shelfhold.plugin_host.public:load_plugin_state",
  "shelfhold.export.targets.kavita.credentials:public_config",
  "shelfhold.acquisition.application.ranges:RangeTickets",
]

[[allow]]
category = "unwired-m3"
reason = "Diagnostic bundle, content serving and the `since`/cursor tokens come with the reader and the admin UI of M3 (B1 for content_response); nothing issues or serves them in M1a."
