  "backend/tests/integration/test_review_pr41.py::test_tunnel_identity_header_without_forward_auth_rejected",
  "backend/tests/integration/test_review_pr41.py::test_identity_headers_kept_only_from_the_forward_auth_networks",
  "backend/tests/integration/test_review_pr41.py::test_idempotent_replay_never_skips_fresh_auth",
  "backend/tests/integration/test_review_pr41.py::test_idempotency_actor_is_one_credential",
  "backend/tests/unit/test_logging.py::test_unhandled_http_exception_and_library_logs_are_json_with_request_id",
]

