reason = "Deleting an account with its audit entries kept under a pseudonym (EF-USR-013: Shelfhold has one administrator until the accounts of M3), the in-process subscribers of the event bus (the notifications go through the outbox; the first subscriber is a live view of M3) and the last-write-wins merge of a client write (reading progress, M3)."
