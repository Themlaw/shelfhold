  "shelfhold.ops.exits:M1A_STATES",
  "shelfhold.ops.exits:UNSERVED",
  "shelfhold.ops.exits:bare",
  "shelfhold.ops.exits:endpoint_of",
]

[[allow]]
category = "unwired-m1b-l23"
reason = "`secrets import` (M1b L06) is wired and carries the decrypt of an export; the wire form of a sealed secret (`Envelope.to_wire` / `from_wire`) is not part of it, since an export holds keys and not sealed rows. It has no production caller until the integrated backup of L23 moves a sealed secret outside its table, or is deleted there if the backup copies the database as it is."
until = "M1b L23"
symbols = [
  "shelfhold.infrastructure.secrets.envelope:Envelope.from_wire",
  "shelfhold.infrastructure.secrets.envelope:Envelope.to_wire",
]

