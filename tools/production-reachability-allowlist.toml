  "shelfhold.sdk.export_target:ExportTarget",
]

# What waited for M2 and is neither wired nor deleted (M2 L31, 2026-11-12): each group names the
# lot that owns it. A group whose lot is a cut (L10, L21, L29) goes with that lot; the others have
# their first caller in the screens and commands of M3, written down here for the owner to
# arbitrate (docs/decisions/M2-L31-debts.md).
[[allow]]
category = "m2-l31-pending-l10-derivative"
reason = "2026-11-12 (M2 L31): wired by M2 L10 (in progress, delivered in M2): `declare_derivative` (the derivative of a CBZ made by a descrambler, a Processor or the SVG rasterizer), and the probe and the sandbox report of the decode worker (`probe_image` asks the worker about the pages of an arriving CBZ, `diagnose_worker` reports what the sandbox really allows). The neutralizer of M2 L03 does not go through the first, and the cover of the OpenLibrary enrichment already runs the worker through `make_thumbnail`. L10 removes this entry."
until = "M2"
symbols = [
  "shelfhold.library.adapters.storage:KeepCopier.declare_derivative",
  "shelfhold.infrastructure.imaging.client:diagnose_worker",
  "shelfhold.infrastructure.imaging.client:probe_image",
]

