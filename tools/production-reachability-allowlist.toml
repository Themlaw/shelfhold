[[allow]]
category = "deferred-l31-bulk-parse-for-plan"
reason = "2026-11-12 (M3 L31): `BulkParse.for_plan` reads the names a plan asks `plugin/parse` about, in bulk, for the adoption of a foreign library (EF-EXP-045, EF-EXP-060). The export job reads them with `wanted_names` and the replay of EF-EXP-049 asks the names of the manifest (`Revalidator`), both through `BulkParse.fetch`: no caller needs the pipeline form before the adoption screen; redated to M4 with the cut, as the sheet of L31 allows."
until = "M4"
symbols = [
  "shelfhold.export.targets.kavita.adopt:BulkParse.for_plan",
]

[[allow]]
category = "deferred-l31-normalizer-migration"
reason = "The preview of a migration to a new version of a normalizer (`normalize migrate`, EF-BIB-054, ENF-OPS-021): every normalizer is still at its first version, so no command runs it. It is proved by its tests and comes with the first version bump."
until = "M4"
