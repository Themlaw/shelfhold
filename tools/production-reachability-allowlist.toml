]

[[allow]]
category = "unwired-m1b-l24"
reason = "Window, priority classes, technical retention and SQLite maintenance (ENF-OPS-014, ENF-OPS-009): M1a has no /store and its window jobs are ordered by the scheduler; the recycle bin (30 days), the monthly VACUUM and the stepwise runner with its schedule matcher are L24's (PLAN-M1b: run_steps has its production callers, tick_matches left with L24)."
until = "M1b L24"
symbols = [
  "shelfhold.jobs.huey_app:JobPools.periodic_tasks",
  "shelfhold.jobs.window:order_window_jobs",
  "shelfhold.library.adapters.units:safe_to_clean",
]

[[allow]]
category = "unwired-m1b-l25"
reason = "One physical root per device (EF-EXP-059) and the sentinel states at root takeover/reinit; M1a registers roots in root_bootstrap and every write already goes through the gated fsops primitives (the pre-checks of scan and delete are their L25 callers)."
until = "M1b L25"
symbols = [
  "shelfhold.infrastructure.fsops.facade:Fsops.require_delete_allowed",
]

