[[allow]]
category = "unwired-m4-komga"
reason = "2026-11-16 (M4 L08a): the Komga destination is described, tested against a fake and declared to the core (`KomgaDestination.capabilities`, read by `FirstPartyDestinations`). 2026-11-17 (M4 L46): the target is now created (`target add komga`, `POST /api/v1/targets/komga`: the key is sealed by `store_komga_key` and shown to the server once by `KomgaClient.probe`), which settles the key, the routes and the scan calls. What is left is the scan relay of the export pass (`open_client`, `KomgaNoLibrary`, the inventory) and the audit of the accounts (`admit` before a binding, `audit` daily), written down in docs/decisions/M4.md."
until = "M5"  # redated by M4 L43 (2026-11-17, docs/decisions/M4.md): the scan relay and the audit of the pass
# 2026-11-16 (M4 L08b): the audit of the accounts (`KomgaAuditor`, `KomgaClient.list_accounts`) is
# written and tested against the fake, and its proof is read by every binding and every pass
# (`partitioning_of`), but nothing creates a Komga target: its callers are the link of a shelf
# (`admit`, before the binding) and the daily check (`audit`) of the lot that creates the target.
symbols = [
  "shelfhold.export.targets.komga.audit:KomgaAuditor",
  "shelfhold.export.targets.komga.client:KomgaClient",
  "shelfhold.export.targets.komga.errors:KomgaNoLibrary",
  "shelfhold.export.targets.komga.target:KomgaDestination.layout_conflicts",
  "shelfhold.export.targets.komga.target:KomgaDestination.inventory_calls",
  "shelfhold.export.targets.kavita.destination:KavitaDestination.inventory_calls",
  "shelfhold.export.targets.komga.wiring:open_client",
]

[[allow]]
category = "unwired-m4-cwa"
reason = "2026-11-16 (M4 L09): the CWA drop box is described, executed by the pass (`dropbox_destinations`, `CwaSource` read by `FirstPartyDestinations`) and tested end to end, the target is now created (M4 L46: `target add cwa`, `POST /api/v1/targets/cwa`, reserved action). What stays unwired are the two calls a drop box never makes (an inventory and sidecars: nothing is indexed, nothing is written beside the book)."
until = "M5"  # redated by M4 L43 (2026-11-17, docs/decisions/M4.md): a drop box never calls them
symbols = [
  "shelfhold.export.targets.cwa.destination:CwaDestination.inventory_calls",
  "shelfhold.export.targets.cwa.destination:CwaDestination.render_sidecars",
]

[[route_test]]
category = "generic-mechanics"
reason = "Proves a generic mechanic of the HTTP stack (identity headers, idempotency replay, reserved-action gate, unhandled-exception log line) on the real middleware of create_app() with a toy route: no product route carries the case (a reserved action that touches secrets, a request header dump, a failing handler). 2026-11-14 (M3 L56): the meta-test of the child surfaces counts a mount and a WebSocket, which the product has none of; the test declares them. The routes outside OpenAPI (the stream, the thumbnails) are now proved on the product's own routes."
until = "permanent"
tests = [
  "backend/tests/integration/test_review_pr41.py::test_tunnel_identity_header_without_forward_auth_rejected",
  "backend/tests/integration/test_review_pr41.py::test_identity_headers_never_reach_the_routes_even_from_the_forward_auth_networks",
  "backend/tests/integration/test_review_pr41.py::test_idempotent_replay_never_skips_fresh_auth",
  "backend/tests/integration/test_review_pr41.py::test_idempotency_actor_is_one_credential",
  "backend/tests/unit/test_logging.py::test_unhandled_http_exception_and_library_logs_are_json_with_request_id",
  "backend/tests/integration/test_child_surfaces.py::test_meta_test_counts_mounts_and_websockets",
]

[[allow]]
category = "m4-l43-normalizer-migration"
reason = "2026-11-17 (M4 L43, D21): the preview of a migration to a new version of a normalizer (`normalize migrate`, EF-BIB-054, ENF-OPS-021) has no caller before a normalizer changes version. M4 raises none: the Unicode folding of L30 is a function of comparison, not a normalizer, and every normalizer is still at its first version. Redated M5, then to the first version bump of a normalizer, whichever milestone brings it (docs/decisions/M4.md, table of the debts). It is proved by its tests until then."
until = "M5"  # settled by the first version bump of a normalizer
symbols = [
  "shelfhold.catalog.domain.normalizers:NormalizerRegistry.plan_migration",
]

[[allow]]
category = "published-sdk-contract"
reason = "ExportTarget is the destination contract published under MIT (SDK 1.1: the Kavita-only members are deprecated and kept, N-1). The host builds its Kavita destination without going through the Protocol; the contract is read by third parties. 2026-11-15 (M4 L03, D7): redated M6. SDK 1.4 adds to the contract without breaking it (ApiCall.body, optional update_metadata), and the Kavita-only members stay deprecated through the whole 1.x series; their removal is the SDK 2.0 break, published in M6 with the kit, once the second adapter has designed their generic replacements (PLAN-M1b D9)."
until = "M6"  # settled by the publication of SDK 2.0
symbols = [
  "shelfhold.sdk.export_target:ExportTarget",
  "shelfhold.sdk.export_target:MetadataUpdater.update_metadata",
  "shelfhold.sdk.export_target:MetadataUpdateSupport",
  "shelfhold.sdk.export_target:metadata_change_route",
  "shelfhold.sdk.export_target:copy_can_serve_bytes",
]

# What waited for M2 and is neither wired nor deleted (M2 L31 and closure, 2026-11-12): each group
# is written down for M3, where it has its first caller (docs/decisions/M2-L31-debts.md).
[[allow]]
category = "m3-l34-sdk-freeze"
reason = "2026-11-12 (M3 L34), reduced 2026-11-16 (M4 L04): what is left of the SDK 1.3 boundary is the event space of a plugin (`plugin_event_type`, `check_plugin_event`, `publish_plugin_event`), the closed list of exits of a plugin waiting state, and the optional `fetch_range`. Nothing lets a plugin raise an event or wait before the first plugin that declares one: redated M6, so the checks are proved by tests and listed until then. The destination plan symbols (`FsOp`, `FsOpPlan`, `parse_destination_plan`, `check_destination_plan`, `is_reserved_path`) left this entry when the executor of M4 L04 (`export.application.plan_executor`) took them into production: it runs the copy `parse_destination_plan` returns and checks it again right before each operation (docs/decisions/M3.md, docs/decisions/M4.md)."
until = "M6"  # the first plugin that declares an event or a waiting state
symbols = [
  "shelfhold.plugin_host.registry:publish_plugin_event",
  "shelfhold.sdk.events:PluginEventError",
  "shelfhold.sdk.events:check_plugin_event",
  "shelfhold.sdk.events:plugin_event_type",
  "shelfhold.sdk.models:WAITING_EXITS",
  "shelfhold.sdk.source:Source.fetch_range",
]

[[allow]]
category = "m4-l43-reading-service"
reason = "2026-11-17 (M4 L43): what L14a wrote for the relays of progress is still not called, and none of L14b, L47 and L50 turned out to need it: the sweep of the aliases a crash left without hashes (`heal_alias_hashes`, `verified_hashes`: since M4 L47 the export itself calls them, they left this entry) needs a locator under the physical roots of a binding, which is a security contract of its own (no symbolic link, never outside the roots) and is not a simple wiring; the read of a position (`position_of`), the delivery of a server state (`record_delivery`) and the undo of a read mark (`undo_read_mark`) wait for the reader of M5 (the screen where a member undoes a mark); `reading.domain.merge` (`latest`, `furthest`) states the rule that the SQL view `reading_progress` implements, and a test proves the two equal. Redated M5 in writing (docs/decisions/M4.md, table of the debts)."
until = "M5"  # settled by the reader of M5 (undo, position of a member) and the lazy read of the aliases
symbols = [
  "shelfhold.reading.application.progress:position_of",
  "shelfhold.reading.application.progress:record_delivery",
  "shelfhold.reading.application.progress:undo_read_mark",
  "shelfhold.reading.domain.merge:latest",
  "shelfhold.reading.domain.merge:furthest",
]

[[allow]]
category = "deferred-l24-deprecation-window"
reason = "2026-11-17 (M4 L24): `Deprecation` builds the window during which an event is sent in two versions of its shape (EF-INT-005). Every event of the catalogue is still at its first version, so no entry declares one: the double emission is proved with a catalogue the test builds, and the bounds are checked when any catalogue is built. It comes with the first change of the shape of an event."
until = "M5"
