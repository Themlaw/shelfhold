# What L31 (M1b) did not wire: wiring it would change what production does (a refusal, a check, a
# screen, a command), which the refactor does not do. Each group names the milestone that owns the
# feature and the first caller; docs/decisions/M1b.md (L31) lists them for the owner to arbitrate.
[[allow]]
category = "deferred-l31-adoption-and-preview"
reason = "M1a features whose production caller is a screen or a command that does not exist yet: the journaled rename of a series folder (EF-EXP-041, `apply_rename`), the adoption of a foreign library (EF-EXP-044, EF-EXP-051, EF-EXP-055: download folder verdict, library link, bulk parse), the `ParseSeriesName` collision check and the \"not verified\" mark of the preview (EF-EXP-009, ENF-COMP-001), the naming pre-checks of an incoming file (EF-EXP-028) and the discovery of physical roots (EF-EXP-059). Wiring any of them adds a check or a refusal to the export path."
until = "M3"
symbols = [
  "shelfhold.export.application.intents:IntentJournal.apply_rename",
  "shelfhold.export.application.intents:RenameStep",
  "shelfhold.export.application.migration_detect:SwitchoverDetector.classify_download_dir",
