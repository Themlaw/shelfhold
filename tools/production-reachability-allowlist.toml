  "shelfhold.ops.exits:bare",
  "shelfhold.ops.exits:endpoint_of",
]

[[allow]]
category = "unwired-m3-deletion-of-copies"
reason = "Deletion of the copies of a Unit needs the typed confirmation (EF-BIB-031): there is still no path that deletes the copies of a Unit (the deletions that exist go through the purge gate and the typed replay confirmation, proved on their real routes). L16 reads the irreplaceable candidates but deletes only the upstream download, after the verification of the copy in /store and of the one Kavita reads, never a copy Shelfhold holds, so nothing in it asks for this confirmation; the deletion of the copies of a Unit by an admin comes with the library screens."
until = "M3"
symbols = [
  "shelfhold.library.adapters.units:DeletionRefusedError",
  "shelfhold.library.adapters.units:require_deletion_allowed",
  "shelfhold.library.domain.irreplaceable:require_typed_confirmation",
]
[[allow]]
category = "unwired-m2-derivative"
reason = "A canonical derivative is declared by a source that descrambles, a Processor (OCR, upscaling) or the EPUB neutralizer (EF-BIB-006, EF-BIB-051): none exists before M2, so nothing calls `declare_derivative` in M1b. The mechanism (original kept in /store, derivative traced by hash) is proved by its test."
until = "M2"
symbols = [
  "shelfhold.library.adapters.storage:KeepCopier.declare_derivative",
]

[[allow]]
category = "unwired-m2-l03"
reason = "The neutralizer `xhtml-neutralizer@v1` and the EPUB scan that writes the derivative (EF-BIB-051, M2 L02) are proved against the trapped-EPUB corpus; their first production caller is the derivative pipeline of M2 L03 (ingest step \"trust\", `declare_derivative`), which also removes the `unwired-m2-derivative` entry above."
until = "M2"
symbols = [
  "shelfhold.infrastructure.content_trust.epub_scan:*",
  "shelfhold.infrastructure.content_trust.xhtml_neutralizer:*",
]

[[allow]]
category = "unwired-m1b-l20"
