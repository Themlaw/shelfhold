# Symbols cited by a `req` test that no production entry point reaches, and why that is fine.
# One entry per category (a reason, an `until`): an M1b lot (L00..L32 of PLAN-M1b), a milestone,
# or `permanent` for the two categories that are never wired by design. `symbols` may end with a
# `*` (a module prefix); a class entry covers its members. The list can only shrink: a test
# refuses an entry that is wired or no longer cited.

[[allow]]
category = "public-sdk"
reason = "shelfhold.sdk.testing is the conformance kit for plugin authors (shelfhold-sdk, MIT): its fakes and checks are consumed by third parties and by tests, never by the host's composition root. The rest of shelfhold.sdk (the models and ports) is used by the host and is not excused."
until = "permanent"
symbols = [
  "shelfhold.sdk.testing.*",
]

[[allow]]
category = "governance-catalogue"
reason = "Closed catalogues (events, exits, reserved actions, deletion sites, failure matrix, citable normalizers, routes) that the production code applies by other means and that governance tests read to prove the catalogue and the code agree."
until = "permanent"
symbols = [
  "shelfhold.events.operating:M1B",
  "shelfhold.events.operating:WAITING_WITHOUT_EVENT",
  "shelfhold.export.targets.kavita.routes:SETUP_ROUTES",
  "shelfhold.identity.domain.catalogue:EXIT_STATES_LATER",
  "shelfhold.identity.domain.emitters:DELETION_SITES",
  "shelfhold.identity.domain.emitters:REPLACEMENT_SITES",
  "shelfhold.identity.domain.reserved:SYSTEM_EMITTERS",
  "shelfhold.infrastructure.observability.failure_matrix:FAILURE_MATRIX",
  "shelfhold.infrastructure.observability.failure_matrix:M1A_BEHAVIOURS",
  "shelfhold.infrastructure.observability.failure_matrix:rows_for",
  "shelfhold.interfaces.http_api.catalog:error_code_modules",
  "shelfhold.library.tombstones.cited:CITABLE_NORMALIZERS",
  "shelfhold.library.tombstones.cited:missing_citable",
  "shelfhold.ops.exits:CLI_PENDING",
  "shelfhold.ops.exits:M1A_STATES",
  "shelfhold.ops.exits:UNSERVED",
  "shelfhold.ops.exits:bare",
  "shelfhold.ops.exits:endpoint_of",
]

[[allow]]
category = "unwired-m3-series"
reason = "A Series attached after its Works exist, and the explicit plan that moves the exported link of an Edition to the series (EF-BIB-025, EF-EXP-062, I26): the model and the guard of an adopted series are here, the plan with its path warning (EF-EXP-037) and the merge and split of Works (EF-BIB-019) are M3's, the only callers."
until = "M3"
symbols = [
  "shelfhold.catalog.adapters.repo:SqlWorkStore.series_of",
  "shelfhold.catalog.application.series:SeriesAlreadyAttachedError",
  "shelfhold.catalog.application.service:CatalogService.attach_to_series",
  "shelfhold.export.application.export_items:FrozenSeriesError",
  "shelfhold.export.application.export_items:reassign_edition_series",
]

[[allow]]
category = "unwired-m3"
reason = "Content serving and the `?since=` tokens (backed by the event sequence, with the removals of a list) come with the reader and the admin UI of M3 (B1 for content_response); no list is backed by the event table in M1a. The cursor and the ETag of a list are wired on the job list. The diagnostic bundle is wired by its CLI (M2 L30); its download over HTTP (attachment_disposition) comes with the admin UI of M3."
until = "M3"
symbols = [
  "shelfhold.infrastructure.http_headers:attachment_disposition",
  "shelfhold.interfaces.http_api.content:content_response",
  "shelfhold.interfaces.http_api.lists:Since",
  "shelfhold.interfaces.http_api.lists:decode_since",
  "shelfhold.interfaces.http_api.lists:encode_since",
]

[[allow]]
category = "unwired-m4"
reason = "Related Works (EF-BIB-039): M1b holds the model and the service (a typed link, never a merge). The admin API that links two Works, the page that shows the relation and the push to the \"related series\" of Kavita are M4's, the first callers."
until = "M4"
symbols = [
  "shelfhold.acquisition.application.presence:present_in",
  "shelfhold.catalog.application.relations:RelatedWork",
  "shelfhold.catalog.application.relations:RelationError",
  "shelfhold.catalog.application.relations:relate_works",
  "shelfhold.catalog.application.relations:relations_of",
  "shelfhold.catalog.application.relations:unrelate_works",
]

[[route_test]]
category = "generic-mechanics"
reason = "Proves a generic mechanic of the HTTP stack (identity headers, idempotency replay, reserved-action gate, unhandled-exception log line) on the real middleware of create_app() with a toy route: no product route carries the case (a reserved action that touches secrets, a request header dump, a failing handler)."
until = "permanent"
tests = [
  "backend/tests/integration/test_review_pr41.py::test_tunnel_identity_header_without_forward_auth_rejected",
  "backend/tests/integration/test_review_pr41.py::test_identity_headers_kept_only_from_the_forward_auth_networks",
  "backend/tests/integration/test_review_pr41.py::test_idempotent_replay_never_skips_fresh_auth",
  "backend/tests/integration/test_review_pr41.py::test_idempotency_actor_is_one_credential",
  "backend/tests/unit/test_logging.py::test_unhandled_http_exception_and_library_logs_are_json_with_request_id",
]

[[route_test]]
category = "unwired-m3"
reason = "content_response (B1) has no route before the reader of M3: the sandbox/attachment headers are proved on a route declared by the test."
until = "M3"
tests = [
  "backend/tests/integration/test_http_headers.py::test_svg_served_as_attachment_with_csp_sandbox",
]

[[route_test]]
category = "unwired-m3"
reason = "Mounts the real /healthz router alone and sets the caller's role by middleware: the member and anonymous roles of the three-way response need accounts that M1a cannot create (one administrator only), so no create_app() session can be a member before M3."
until = "M3"
tests = [
  "backend/tests/integration/test_ops_surface.py::test_healthz_reasons_are_for_administrators_and_never_carry_a_title",
]

[[allow]]
category = "deferred-l31-adoption-and-preview"
reason = "M1a features whose production caller is a screen or a command that does not exist yet: the journaled rename of a series folder (EF-EXP-041, `apply_rename`), the adoption of a foreign library (EF-EXP-044, EF-EXP-051, EF-EXP-055: download folder verdict, library link, bulk parse), and the discovery of physical roots (EF-EXP-059). Wiring any of them adds a check or a refusal to the export path."
until = "M3"
symbols = [
  "shelfhold.export.application.intents:IntentJournal.apply_rename",
  "shelfhold.export.application.intents:RenameStep",
  "shelfhold.export.application.migration_detect:SwitchoverDetector.classify_download_dir",
  "shelfhold.export.domain.physical_roots:discover_physical_roots",
  "shelfhold.export.targets.kavita.adopt:Adopter.link_library",
  "shelfhold.export.targets.kavita.adopt:BulkParse.for_plan",
  "shelfhold.export.targets.kavita.series:Resolution.renamed",
  "shelfhold.export.targets.kavita.series:SeriesResolver",
]

[[allow]]
category = "deferred-l31-accounts-and-sync"
reason = "Deleting an account with its audit entries kept under a pseudonym (EF-USR-013: Shelfhold has one administrator until the accounts of M3), the in-process subscribers of the event bus (the notifications go through the outbox; the first subscriber is a live view of M3) and the last-write-wins merge of a client write (reading progress, M3)."
until = "M3"
symbols = [
  "shelfhold.events.bus:EventBus.subscribe",
  "shelfhold.identity.adapters.store:SqlIdentityStore.delete_user",
  "shelfhold.infrastructure.clock:Stamped",
  "shelfhold.infrastructure.clock:merge_last_write_wins",
]

[[allow]]
category = "deferred-l31-normalizer-migration"
reason = "The preview of a migration to a new version of a normalizer (`normalize migrate`, EF-BIB-054, ENF-OPS-021): every normalizer is still at its first version, so no command runs it. It is proved by its tests and comes with the first version bump."
until = "M4"
symbols = [
  "shelfhold.catalog.domain.normalizers:NormalizerRegistry.plan_migration",
]

[[allow]]
category = "published-sdk-contract"
reason = "ExportTarget is the destination contract published under MIT (SDK 1.1: the Kavita-only members are deprecated and kept, N-1). The host builds its Kavita destination without going through the Protocol; the contract is read by third parties. The reduction is decided in M4 with the second adapter (PLAN-M1b D9)."
until = "M4"
symbols = [
  "shelfhold.sdk.export_target:ExportTarget",
]

# What waited for M2 and is neither wired nor deleted (M2 L31 and closure, 2026-11-12): each group
# is written down for M3, where it has its first caller (docs/decisions/M2-L31-debts.md).
[[allow]]
category = "m2-l31-deferred-m3-decode-probe"
reason = "2026-11-12 (M2 closure, L10 and L29 merged): `probe_image` (format and size of an untrusted image, decoded once in the worker) and `diagnose_worker` (what the sandbox really allows) have no production caller after L10: the rasterizer and `make_thumbnail` (OpenLibrary cover) go through `run_worker` directly, and no M2 requirement asks the pages of an arriving CBZ to be probed or the sandbox report to be exposed. They stay as the proof surface of ENF-SEC-003 (decode caps, no network, RLIMIT_AS), tested in test_decode_worker*.py and test_imaging_*.py. Written down for M3, whose reader and diagnostic screens are their first callers; deleted there if none is planned."
until = "M3"
symbols = [
  "shelfhold.infrastructure.imaging.client:diagnose_worker",
  "shelfhold.infrastructure.imaging.client:probe_image",
]

[[allow]]
category = "m3-l34-sdk-freeze"
reason = "2026-11-12 (M3 L34): the SDK 1.3 boundary a third-party destination or plugin is written against: the serialisable `FsOp` plan and its checks (`parse_destination_plan`, `check_destination_plan`, `is_reserved_path`), the event space of a plugin (`plugin_event_type`, `check_plugin_event`, `publish_plugin_event`), the closed list of exits of a plugin waiting state, and the optional `fetch_range`. Nothing in production runs a destination plan or lets a plugin raise an event before the first destination adapter plan executor (M4) and the first plugin that declares an event or a waiting state, so the checks are proved by tests and listed until then. End-of-lot criterion of the M4 destination lot: its executor calls `check_destination_plan` on the copy `parse_destination_plan` returned, right before each operation (docs/decisions/M3.md)."
until = "M4"
symbols = [
  "shelfhold.plugin_host.registry:publish_plugin_event",
  "shelfhold.sdk.events:PluginEventError",
  "shelfhold.sdk.events:check_plugin_event",
  "shelfhold.sdk.events:plugin_event_type",
  "shelfhold.sdk.export_target:TargetCapabilities",
  "shelfhold.sdk.fsops:FsOp",
  "shelfhold.sdk.fsops:FsOpPlan",
  "shelfhold.sdk.fsops:FsOpPlanError",
  "shelfhold.sdk.fsops:check_destination_plan",
  "shelfhold.sdk.fsops:is_reserved_path",
  "shelfhold.sdk.fsops:parse_destination_plan",
  "shelfhold.sdk.models:WAITING_EXITS",
  "shelfhold.sdk.source:Source.fetch_range",
]

