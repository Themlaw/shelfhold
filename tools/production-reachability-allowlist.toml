[[allow]]
category = "unwired-m6-rpc"
reason = "2026-11-20 (M6 L04): `rpc_protocol` 1 is written and tested end to end against real subprocesses and in-process peers: the length-prefixed codec, the host session (`RpcSession`: handshake before the manifest, deadlines, calls in flight, the Fetcher and events served to a plugin during a host call), the plugin side, the `rpc_stdio` adapter, the proxy that gives a plugin the contract's methods and `PluginRegistry.load_isolated`, which marks a failing plugin in error. Nothing in production starts a plugin process yet: no process exists to speak to until the runner (the companion container of D-P1, L05) and the guard that decides whether an isolated plugin may run (enabling is a reserved action, L06) call `load_isolated`. Wiring it earlier would hand the core a way to start a third-party process before the lot that cuts that process off from `/data`, from the CLI socket and from the network exists (ADR-0056, D-P1). 2026-11-21 (M6 L05): `spawn_stdio`, `closed_environment` and `RpcLimits` left this entry: the companion runs them, and it exists and is wired (`shelfhold plugin-runner` runs it, the compose of the e2e stack starts it and its self-check passes there), and the core's end of its socket is written and tested against it (`connect_runner`, with its two refusals): what is still missing is the call. Nothing in the core connects to the companion until the guard that decides whether an isolated plugin may run (enabling is a reserved action) exists: a core that could start a third-party process before that decision would make the companion a way round it. `PluginFailed` and `SecretLeak` are the errors of the session that call will meet."
until = "M6"  # M6 L05 (2026-11-21, ADR-0056 D-P1): the guard enables an isolated plugin and the core connects to the companion — L06
symbols = [
  "shelfhold.plugin_host.adapters.rpc.proxy:RpcPluginProxy",
  "shelfhold.plugin_host.adapters.rpc.runner_socket:RunnerRefused",
  "shelfhold.plugin_host.adapters.rpc.runner_socket:RunnerUnavailable",
  "shelfhold.plugin_host.adapters.rpc.runner_socket:connect_runner",
  "shelfhold.plugin_host.registry:PluginRegistry.load_isolated",
  "shelfhold.plugin_host.rpc.host_side:RpcSession",
  "shelfhold.plugin_host.rpc.protocol:PluginFailed",
  "shelfhold.plugin_host.rpc.protocol:SecretLeak",
]
