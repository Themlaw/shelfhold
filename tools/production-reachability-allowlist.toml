reason = "2026-11-16 (M4 L08a): the Komga destination is described, tested against a fake and declared to the core (`KomgaDestination.capabilities`, read by `FirstPartyDestinations`). 2026-11-17 (M4 L46): the target is now created (`target add komga`, `POST /api/v1/targets/komga`: the key is sealed by `store_komga_key` and shown to the server once by `KomgaClient.probe`), which settles the key, the routes and the scan calls. What is left is the scan relay of the export pass (`open_client`, `KomgaNoLibrary`, the inventory) and the audit of the accounts (`admit` before a binding, `audit` daily), written down in docs/decisions/M4.md. 2026-11-19 (M5 L22b): redated M6. No M5 lot carries the scan relay or the audit of the accounts (not in the 30 cards of PLAN-M5), and `KomgaAuditor` is not called in production: the proof of partitioning stays empty, so a shelf under 18+ is refused for Komga and every other binding is unchanged, which is the safe direction. Nothing is deleted: the code is proved by its tests and is the base of the lot that wires the pass (docs/decisions/M5.md, section of L22b)."
until = "M6"  # M5 L22b (2026-11-19, docs/decisions/M5.md): the scan relay and the audit of the pass, a lot of M6 — L22
# 2026-11-16 (M4 L08b): the audit of the accounts (`KomgaAuditor`, `KomgaClient.list_accounts`) is
# written and tested against the fake, and its proof is read by every binding and every pass
# (`partitioning_of`), but nothing creates a Komga target: its callers are the link of a shelf
