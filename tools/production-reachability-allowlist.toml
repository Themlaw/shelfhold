# Symbols cited by a `req` test that no production entry point reaches, and why that is fine.
# One entry per category (a reason, an `until`): an M1b lot (L00..L32 of PLAN-M1b), a milestone,
# or `permanent` for the two categories that are never wired by design. `symbols` may end with a
# `*` (a module prefix); a class entry covers its members. The list can only shrink: a test
# refuses an entry that is wired or no longer cited.

[[allow]]
category = "public-sdk"
reason = "shelfhold.sdk.testing is the conformance kit for plugin authors (shelfhold-sdk, MIT): its fakes and checks are consumed by third parties and by tests, never by the host's composition root. The rest of shelfhold.sdk (the models and ports) is used by the host and is not excused."
until = "permanent"
symbols = [
  "shelfhold.sdk.testing.*",
]

[[allow]]
category = "governance-catalogue"
reason = "Closed catalogues (events, exits, reserved actions, deletion sites, failure matrix, citable normalizers, routes) that the production code applies by other means and that governance tests read to prove the catalogue and the code agree."
until = "permanent"
symbols = [
  "shelfhold.events.operating:M1B",
  "shelfhold.events.operating:WAITING_WITHOUT_EVENT",
  "shelfhold.export.targets.kavita.routes:SETUP_ROUTES",
  "shelfhold.identity.domain.catalogue:EXIT_STATES_LATER",
  "shelfhold.identity.domain.emitters:DELETION_SITES",
  "shelfhold.identity.domain.emitters:REPLACEMENT_SITES",
  "shelfhold.identity.domain.reserved:SYSTEM_EMITTERS",
  "shelfhold.infrastructure.observability.failure_matrix:FAILURE_MATRIX",
  "shelfhold.infrastructure.observability.failure_matrix:M1A_BEHAVIOURS",
  "shelfhold.infrastructure.observability.failure_matrix:rows_for",
  "shelfhold.interfaces.http_api.catalog:error_code_modules",
  "shelfhold.library.tombstones.cited:CITABLE_NORMALIZERS",
  "shelfhold.library.tombstones.cited:missing_citable",
  "shelfhold.ops.exits:CLI_PENDING",
  "shelfhold.ops.exits:M1A_STATES",
  "shelfhold.ops.exits:UNSERVED",
  "shelfhold.ops.exits:bare",
  "shelfhold.ops.exits:endpoint_of",
]

[[allow]]
category = "unwired-m3-deletion-of-copies"
reason = "Deletion of the copies of a Unit needs the typed confirmation (EF-BIB-031): there is still no path that deletes the copies of a Unit (the deletions that exist go through the purge gate and the typed replay confirmation, proved on their real routes). L16 reads the irreplaceable candidates but deletes only the upstream download, after the verification of the copy in /store and of the one Kavita reads, never a copy Shelfhold holds, so nothing in it asks for this confirmation; `safe_to_clean` (the recycle bin check) and `Fsops.require_delete_allowed` (the pre-check of a delete) are the guards of that same deletion, called by no production delete until then; the deletion of the copies of a Unit by an admin comes with the library screens."
until = "M3"
symbols = [
  "shelfhold.library.adapters.units:safe_to_clean",
  "shelfhold.infrastructure.fsops.facade:Fsops.require_delete_allowed",
  "shelfhold.library.adapters.units:DeletionRefusedError",
  "shelfhold.library.adapters.units:require_deletion_allowed",
  "shelfhold.library.domain.irreplaceable:require_typed_confirmation",
]

[[allow]]
category = "unwired-m3-series"
reason = "A Series attached after its Works exist, and the explicit plan that moves the exported link of an Edition to the series (EF-BIB-025, EF-EXP-062, I26): the model and the guard of an adopted series are here, the plan with its path warning (EF-EXP-037) and the merge and split of Works (EF-BIB-019) are M3's, the only callers."
until = "M3"
symbols = [
  "shelfhold.catalog.adapters.repo:SqlWorkStore.series_of",
  "shelfhold.catalog.application.series:SeriesAlreadyAttachedError",
  "shelfhold.catalog.application.service:CatalogService.attach_to_series",
  "shelfhold.export.application.export_items:FrozenSeriesError",
  "shelfhold.export.application.export_items:reassign_edition_series",
]

[[allow]]
category = "unwired-m3"
reason = "Content serving and the `?since=` tokens (backed by the event sequence, with the removals of a list) come with the reader and the admin UI of M3 (B1 for content_response); no list is backed by the event table in M1a. The cursor and the ETag of a list are wired on the job list. The diagnostic bundle is wired by its CLI (M2 L30); its download over HTTP (attachment_disposition) comes with the admin UI of M3."
until = "M3"
symbols = [
  "shelfhold.infrastructure.http_headers:attachment_disposition",
  "shelfhold.interfaces.http_api.content:content_response",
  "shelfhold.interfaces.http_api.lists:Since",
  "shelfhold.interfaces.http_api.lists:decode_since",
  "shelfhold.interfaces.http_api.lists:encode_since",
]

[[allow]]
category = "unwired-m4"
reason = "Related Works (EF-BIB-039): M1b holds the model and the service (a typed link, never a merge). The admin API that links two Works, the page that shows the relation and the push to the \"related series\" of Kavita are M4's, the first callers."
until = "M4"
symbols = [
  "shelfhold.acquisition.application.presence:present_in",
  "shelfhold.catalog.application.relations:RelatedWork",
  "shelfhold.catalog.application.relations:RelationError",
  "shelfhold.catalog.application.relations:relate_works",
  "shelfhold.catalog.application.relations:relations_of",
  "shelfhold.catalog.application.relations:unrelate_works",
]

[[route_test]]
category = "generic-mechanics"
reason = "Proves a generic mechanic of the HTTP stack (identity headers, idempotency replay, reserved-action gate, unhandled-exception log line) on the real middleware of create_app() with a toy route: no product route carries the case (a reserved action that touches secrets, a request header dump, a failing handler)."
until = "permanent"
tests = [
  "backend/tests/integration/test_review_pr41.py::test_tunnel_identity_header_without_forward_auth_rejected",
  "backend/tests/integration/test_review_pr41.py::test_identity_headers_kept_only_from_the_forward_auth_networks",
  "backend/tests/integration/test_review_pr41.py::test_idempotent_replay_never_skips_fresh_auth",
  "backend/tests/integration/test_review_pr41.py::test_idempotency_actor_is_one_credential",
  "backend/tests/unit/test_logging.py::test_unhandled_http_exception_and_library_logs_are_json_with_request_id",
]

[[route_test]]
category = "unwired-m3"
