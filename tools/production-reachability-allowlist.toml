[[allow]]
category = "unwired-m1b-l15"
reason = "Deletion of the copies of a Unit needs the irreplaceable candidates and their typed confirmation (EF-BIB-031, EF-BIB-042): M1a has no path that deletes the copies of a Unit (the deletions that exist go through the purge gate and the typed replay confirmation, proved on their real routes)."
until = "M1b L15"
symbols = [
  "shelfhold.library.adapters.units:DeletionRefusedError",
  "shelfhold.library.adapters.units:require_deletion_allowed",
  "shelfhold.library.domain.irreplaceable:require_typed_confirmation",
]

[[allow]]
category = "unwired-m1b-l16"
reason = "\"Mettre à l'abri\" (EF-BIB-038, EF-BIB-045, EF-BIB-048): the mechanism that puts the original in /store is L16's job; M1a has no /store and queues no such job."
until = "M1b L16"
symbols = [
  "shelfhold.library.adapters.safeguard:Safeguard",
  "shelfhold.library.domain.failures:SafeguardFailedError",
]

