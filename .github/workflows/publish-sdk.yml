name: publish-sdk

# Publication of shelfhold-sdk (ENF-SEC-007, M6 L03, ADR-0056 D-P2): trusted publishing only.
# The OIDC token of the `publish` job is the one credential — no API token, no secret, nothing
# referenced from the repository — and the official pypa action, pinned by SHA, turns it into
# PEP 740 attestations. A tag `sdk-vX.Y.Z` publishes to PyPI behind the protected environment
# `pypi` (the holder reviews the deployment); a manual run publishes to TestPyPI behind
# `testpypi`: the first publication is always a dry run on the test index (docs/releasing.md).
# The build job holds no permission at all and hands over exactly what it built: what is
# published is never rebuilt. Deliberately not a reusable workflow: trusted publishing does not
# work from one — the publish job lives here, at the top level. The dry run of every pull
# request is the `sdk-dist` job of ci.yml, which never uploads anything.

on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:  # TestPyPI: the holder's dry run, from the ref it selects

permissions: {}

concurrency:
  group: publish-sdk
  cancel-in-progress: false  # a publication is never cancelled mid-flight

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}  # a build needs no token: the publish job holds the only id-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: false  # a publish workflow reads no cache a pull request could have poisoned
      - name: The tag names the version of sdk/pyproject.toml (a manual run checks nothing)
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - "$TAG" <<'PY'
          import re, sys, tomllib
          from pathlib import Path

          tag = sys.argv[1]
          assert re.fullmatch(r"sdk-v[0-9]+\.[0-9]+\.[0-9]+", tag), f"the tag must be sdk-vX.Y.Z, got {tag}"
          project = tomllib.loads(Path("sdk/pyproject.toml").read_text(encoding="utf-8"))["project"]
          assert tag == f"sdk-v{project['version']}", (
              f"{tag} does not name the version {project['version']} of sdk/pyproject.toml"
          )
          PY
      - name: Build the wheel and the sdist
        run: uv build --project sdk --out-dir dist
      - name: The distributions built in dist/ are the tag's version, nothing else
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - "$TAG" <<'PY'
          import email.parser, email.policy, re, sys, zipfile
          from pathlib import Path

          tag = sys.argv[1]
          assert re.fullmatch(r"sdk-v[0-9]+\.[0-9]+\.[0-9]+", tag), tag
          dist = sorted(p.name for p in Path("dist").iterdir())
          wheels = [n for n in dist if n.endswith(".whl")]
          sdists = [n for n in dist if n.endswith(".tar.gz")]
          assert len(wheels) == 1 and len(sdists) == 1 and len(dist) == 2, dist
          with zipfile.ZipFile(Path("dist") / wheels[0]) as built:
              meta = next(n for n in built.namelist() if n.endswith(".dist-info/METADATA"))
              headers = email.parser.BytesParser(policy=email.policy.default).parsebytes(
                  built.read(meta)
              )
          version = str(headers["Version"])  # what was built, not what the tag declares
          assert wheels[0] == f"shelfhold_sdk-{version}-py3-none-any.whl", wheels[0]
          assert sdists[0] == f"shelfhold_sdk-{version}.tar.gz", sdists[0]
          assert tag == f"sdk-v{version}", f"{tag} is not the version {version} that was built"
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write  # trusted publishing and PEP 740 attestations, nothing else
    # The protected environment (the holder reviews the deployment, docs/releasing.md): `pypi`
    # for the tag that triggered the run, `testpypi` for the holder's manual dry run.
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
      url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/p/shelfhold-sdk' || 'https://pypi.org/p/shelfhold-sdk' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-distributions
          path: dist/
      - name: Publish the distributions (trusted publishing, PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          attestations: true
