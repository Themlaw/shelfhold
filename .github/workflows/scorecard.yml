name: scorecard

# OpenSSF Scorecard (ENF-SEC-007, palier M3): weekly, on the default branch only. The result goes
# to the code scanning tab of the repository as SARIF; nothing is published outside it
# (publish_results: false), so the job holds no OIDC token. Never on a pull request, never on a fork.
on:
  schedule:
    - cron: "23 4 * * 1"  # Mondays, 04:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  analysis:
    if: github.repository == 'Themlaw/shelfhold'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload the result to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
