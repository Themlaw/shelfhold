name: image-retag

# Reusable: adds X.Y.Z and X.Y to the image already published for a release commit (retag of the
# sha-<long> digest, never a rebuild, never "latest"). Requires ci-success on that commit.
# Idempotent; X.Y.Z is never rewritten. Called from release.yml and retag.yml, never from a PR.
on:
  workflow_call:
    inputs:
      sha:
        description: "Full SHA of the release commit"
        type: string
        required: true
      version:
        description: "X.Y.Z, without the v prefix"
        type: string
        required: true

permissions:
  contents: read

jobs:
  retag:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Add X.Y.Z and X.Y to the image of the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: .github/scripts/release-retag.sh
