name: image-publish

# Reusable: publishes the OCI archives that image.yml built and the e2e tested (same run, same
# artifacts: nothing is rebuilt), then assembles the multi-arch manifest. Called only from jobs
# that run on push to main (ci.yml) or on a release (release.yml), never on a pull request.
on:
  workflow_call:
    inputs:
      tags:
        description: "Newline-separated tags of the manifest; empty = edge and sha-<long>"
        type: string
        default: ""
    secrets:
      CODEBERG_TOKEN:
        description: "Token of the second registry. Optional: without it the images are signed and published on GHCR only"
        required: false

env:
  IMAGE: ghcr.io/themlaw/shelfhold

permissions:
  contents: read

jobs:
  publish:
    name: publish (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - name: Push the tested archive as is (digest preserved)
        env:
          ARCH: ${{ matrix.arch }}
          SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v skopeo >/dev/null || sudo apt-get install -y --no-install-recommends skopeo
          archive="$RUNNER_TEMP/image-${ARCH}.tar"
          expected="$(tar -xOf "$archive" index.json | jq -r '.manifests[0].digest')"
          # Temporary per-architecture tag: a digest-only destination cannot be pushed to.
          skopeo copy --dest-creds "${GH_ACTOR}:${GH_TOKEN}" --digestfile "$RUNNER_TEMP/digest" \
            "oci-archive:${archive}" "docker://${IMAGE}:build-${SHA}-${ARCH}"
          pushed="$(cat "$RUNNER_TEMP/digest")"
          [ "$pushed" = "$expected" ] || { echo "::error::pushed digest ${pushed} differs from the tested ${expected}"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${pushed#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # The only job of the repository that holds id-token and attestations (ENF-SEC-007): the OIDC
    # token signs (cosign, keyless) and attests the digests that were just pushed, nothing else.
    # The second registry is optional (ENF-GOV-004): every step that touches it runs only when the
    # detection step `second` found the secret CODEBERG_TOKEN; without it the job says so in its
    # summary and goes on. The token reaches docker/login-action only.
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create the multi-arch manifest (temporary tag, public tags come after the signature)
        env:
          SHA: ${{ github.sha }}
        id: manifest
        run: |
          sources=()
          for digest in "$RUNNER_TEMP"/digests/*; do sources+=("${IMAGE}@sha256:$(basename "$digest")"); done
          [ "${#sources[@]}" -eq 2 ] || { echo "::error::expected 2 platform digests"; exit 1; }
          docker buildx imagetools create -t "${IMAGE}:build-${SHA}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:build-${SHA}"
          # Digests to attest: the manifest list and each platform manifest (the order of the
          # platforms does not matter, both are attested the same way).
          index="$(docker buildx imagetools inspect "${IMAGE}:build-${SHA}" --format '{{.Manifest.Digest}}')"
          {
            echo "index=${index}"
            echo "platform1=sha256:${sources[0]##*@sha256:}"
            echo "platform2=sha256:${sources[1]##*@sha256:}"
          } >> "$GITHUB_OUTPUT"
      - name: SBOM (SPDX) of the first platform image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.platform1 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-1.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM (SPDX) of the second platform image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.platform2 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-2.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Provenance of the manifest list
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.index }}
          push-to-registry: true
      - name: Provenance of the first platform image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.platform1 }}
          push-to-registry: true
      - name: Provenance of the second platform image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.platform2 }}
          push-to-registry: true
      - name: SBOM attestation of the first platform image
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.platform1 }}
          sbom-path: ${{ runner.temp }}/sbom-1.spdx.json
          push-to-registry: true
      - name: SBOM attestation of the second platform image
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.platform2 }}
          sbom-path: ${{ runner.temp }}/sbom-2.spdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign the manifest list and both platform images on GHCR (keyless, OIDC)
        env:
          INDEX: ${{ steps.manifest.outputs.index }}
          PLATFORM1: ${{ steps.manifest.outputs.platform1 }}
          PLATFORM2: ${{ steps.manifest.outputs.platform2 }}
        run: |
          for digest in "$INDEX" "$PLATFORM1" "$PLATFORM2"; do
            cosign sign --yes "${IMAGE}@${digest}"
          done
      - name: Verify the GHCR signatures (identity of this workflow, issuer GitHub Actions)
        env:
          INDEX: ${{ steps.manifest.outputs.index }}
          PLATFORM1: ${{ steps.manifest.outputs.platform1 }}
          PLATFORM2: ${{ steps.manifest.outputs.platform2 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          identity="^https://github\.com/${REPOSITORY//./\.}/\.github/workflows/image-publish\.yml@refs/heads/main$"
          for digest in "$INDEX" "$PLATFORM1" "$PLATFORM2"; do
            cosign verify "${IMAGE}@${digest}" --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          done
      - name: Publish the public tags on GHCR (the digest is signed and verified)
        env:
          TAGS: ${{ inputs.tags }}
          SHA: ${{ github.sha }}
          INDEX: ${{ steps.manifest.outputs.index }}
        run: |
          tags="${TAGS:-$(printf 'edge\nsha-%s' "$SHA")}"
          args=()
          while read -r tag; do [ -n "$tag" ] && args+=(-t "${IMAGE}:${tag}"); done <<< "$tags"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${INDEX}"
          published="$(docker buildx imagetools inspect "${IMAGE}:$(head -n1 <<< "$tags")" --format '{{.Manifest.Digest}}')"
          [ "$published" = "$INDEX" ] || { echo "::error::tag points to ${published}, not ${INDEX}"; exit 1; }
      - name: Second registry, the script of this commit (nothing else is checked out)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/second-registry.sh
          sparse-checkout-cone-mode: false
      - name: Second registry, detection (optional, never fails without the token)
        id: second
        env:
          HAS_TOKEN: ${{ secrets.CODEBERG_TOKEN != '' }}
          SECOND_REGISTRY: ${{ vars.SECOND_REGISTRY }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: .github/scripts/second-registry.sh detect
      - name: Second registry, login
        if: steps.second.outputs.enabled == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ steps.second.outputs.host }}
          username: ${{ vars.SECOND_REGISTRY_USER || github.repository_owner }}
          password: ${{ secrets.CODEBERG_TOKEN }}
      - name: Second registry, copy the manifest list under a temporary tag (digest preserved)
        if: steps.second.outputs.enabled == 'true'
        env:
          SECOND_IMAGE: ${{ steps.second.outputs.image }}
          SHA: ${{ github.sha }}
          INDEX: ${{ steps.manifest.outputs.index }}
        run: |
          docker buildx imagetools create -t "${SECOND_IMAGE}:build-${SHA}" "${IMAGE}@${INDEX}"
          copied="$(docker buildx imagetools inspect "${SECOND_IMAGE}:build-${SHA}" --format '{{.Manifest.Digest}}')"
          [ "$copied" = "$INDEX" ] || { echo "::error::copied digest ${copied} differs from ${INDEX}"; exit 1; }
      - name: Second registry, sign the same digests (keyless, OIDC)
        if: steps.second.outputs.enabled == 'true'
        env:
          SECOND_IMAGE: ${{ steps.second.outputs.image }}
          INDEX: ${{ steps.manifest.outputs.index }}
          PLATFORM1: ${{ steps.manifest.outputs.platform1 }}
          PLATFORM2: ${{ steps.manifest.outputs.platform2 }}
        run: |
          for digest in "$INDEX" "$PLATFORM1" "$PLATFORM2"; do
            cosign sign --yes "${SECOND_IMAGE}@${digest}"
          done
      - name: Second registry, verify the signatures
        if: steps.second.outputs.enabled == 'true'
        env:
          SECOND_IMAGE: ${{ steps.second.outputs.image }}
          INDEX: ${{ steps.manifest.outputs.index }}
          PLATFORM1: ${{ steps.manifest.outputs.platform1 }}
          PLATFORM2: ${{ steps.manifest.outputs.platform2 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          identity="^https://github\.com/${REPOSITORY//./\.}/\.github/workflows/image-publish\.yml@refs/heads/main$"
          for digest in "$INDEX" "$PLATFORM1" "$PLATFORM2"; do
            cosign verify "${SECOND_IMAGE}@${digest}" --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          done
      - name: Second registry, publish the public tags (the digest is signed and verified)
        if: steps.second.outputs.enabled == 'true'
        env:
          SECOND_IMAGE: ${{ steps.second.outputs.image }}
          TAGS: ${{ inputs.tags }}
          SHA: ${{ github.sha }}
          INDEX: ${{ steps.manifest.outputs.index }}
        run: |
          tags="${TAGS:-$(printf 'edge\nsha-%s' "$SHA")}"
          args=()
          while read -r tag; do [ -n "$tag" ] && args+=(-t "${SECOND_IMAGE}:${tag}"); done <<< "$tags"
          docker buildx imagetools create "${args[@]}" "${SECOND_IMAGE}@${INDEX}"
