name: cleanup

# DRY-RUN BY DEFAULT, scheduled runs included: they only list. Real deletion happens only on a
# manual run with dry_run=false.
# Weekly purge of the temporary build-<sha>-<arch> tags of the image (see image-publish.yml).
# Never touches edge, sha-*, X.Y.Z, X.Y, untagged versions, or a platform manifest that a kept
# multi-arch index still references. Never runs on pull_request.
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List only (default). Set to false to really delete"
        type: boolean
        default: true

permissions: {}

jobs:
  purge-build-tags:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Delete expired build-* versions
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: shelfhold
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || 'true' }}
        run: .github/scripts/ghcr-cleanup.sh
