name: nightly

# Real Kavita (official image, public registry) and real Suwayomi with the synthetic extension
# (EF-SRC-008, ENF-LEG-013, ENF-COMP-001). NEVER required to merge: it is not in `ci-success`, runs
# on a schedule and on demand only, and a pull request cannot trigger it. No real content source:
# every file is built by the tests, the extension reads a fixture server on an internal network.
# The Kavita job also locks the age of an EPUB series on a Books library (M2 L32, DoD 03) and reads
# it back after a scan, for each version below. The journeys of the release image run on amd64 and
# arm64 (job `image-journeys`). A failure is read in the Actions tab (no issue is opened: the token has no write permission).

on:
  workflow_dispatch:
  schedule:
    - cron: "43 2 * * *"

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # The journeys of the image on both architectures (ENF-PORT-003, M3 L57): a pull request builds
  # and tests amd64 only, main both; the night does it again, so that an arm64 regression that
  # no merge showed (a runner image, a base layer) is seen the next morning. The same reusable
  # workflow as the CI, never published from here (`cache-write` stays off).
  image-journeys:
    name: image journeys (amd64, arm64)
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/image.yml  # zizmor: ignore[self-repository]
    with:
      arm64: true

  kavita:
    name: kavita (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Today these three entries are ONE image (v0.9.1.4): the registry has no 0.9.1.0 tag, so the
          # minimum of the range (0.9.1.0) is NOT tested on a real image (offline openapi fixtures
          # only). They are kept apart because they will diverge. Drift fails the job (no issue opened).
          # the 0.9.1 line, as published on the floating tag
          - label: line-0.9.1
            image: docker.io/jvmilazz0/kavita:0.9.1
          # the pinned version (docs/dependencies.md: v0.9.1.4), by digest
          - label: pinned
            image: docker.io/jvmilazz0/kavita@sha256:31181a32f0dda73cae68721867028a7253d57881b58bea5754cd9e578e75421a
          # the latest release: its drift is the point of the job
          - label: latest
            image: docker.io/jvmilazz0/kavita:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: Pull the official Kavita image (the only network use; the bench network is internal)
        env:
          KAVITA_IMAGE: ${{ matrix.image }}
        run: docker pull "$KAVITA_IMAGE"
      - name: Kavita nightly tests
        working-directory: backend
        env:
          KAVITA_IMAGE: ${{ matrix.image }}
        run: uv run --locked pytest -m nightly tests/nightly/test_kavita_nightly.py -v --no-cov

  suwayomi-extension:
    # The JDK of the build is the one the dependency verification was generated with (21, see the
    # README of the extension) AND the one the workflow used until now (17): both are built, so a
    # drift of either shows up here and not at the next regeneration of the metadata.
    name: suwayomi (synthetic extension, JDK ${{ matrix.java }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --project backend --locked
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: "Build the synthetic extension (Gradle dependencies, the only network use of the build)"
        run: backend/tests/contract/suwayomi-synthetic-extension/build.sh
      - name: Pull the pinned images (Suwayomi, fixture server)
        run: docker compose -f backend/tests/contract/suwayomi-synthetic-extension/compose.yaml pull
        env:
          SUWAYOMI_DATA: ${{ runner.temp }}
      - name: Nightly tests (empty extension-store list, no route out, extension installed from the file)
        working-directory: backend
        env:
          SYNTHETIC_EXTENSION_APK: ${{ github.workspace }}/backend/tests/contract/suwayomi-synthetic-extension/build/synthetic.apk
        run: uv run --locked pytest -m nightly tests/nightly/test_suwayomi_synthetic_extension.py -v --no-cov

  suwayomi-contract:
    # The points of the M1b contract that were "to confirm at the nightly" (EF-SRC-009, EF-SRC-026,
    # EF-SRC-029): the documents Shelfhold sends, played as written on the pinned Suwayomi (category
    # created then excluded from the download, download queue, global update filters), in both
    # authentication modes. Internal network only, local source only, synthetic CBZ.
    name: suwayomi (pinned, M1b documents)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: Pull the pinned image (the only network use; the bench network is internal)
        run: docker compose -f e2e/suwayomi/compose.yaml pull
        env:
          SUWAYOMI_DATA: ${{ runner.temp }}
      - name: Contract tests of the M1b documents (basic_auth and ui_login)
        working-directory: backend
        run: uv run --locked pytest -m nightly tests/contract/suwayomi/test_suwayomi_m1b_contract.py -v --no-cov

  bench-rss:
    # The heavy peak-memory bench (ENF-PERF-009): 500 chapters exported over the whole reference
    # profile, the RSS of the process tree sampled from /proc. Too long and too sensitive to a busy
    # runner for a pull request, which keeps the 50-chapter variant (tests/bench). No Docker, no
    # network: every file is generated.
    name: bench (peak RSS, 500 chapters)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: Peak RSS bench
        working-directory: backend
        run: uv run --locked pytest -m nightly tests/nightly/test_bench_rss_heavy.py -v --no-cov

  bench-perf:
    # The API benches of M3 on the reference profile (ENF-PERF-004, -005, -007): the library list
    # and the search (p95), and the latency of the API while 500 chapters are exported. Too
    # sensitive to a busy runner for a pull request, so planned and manual only, never required
    # (tools/traceability-exceptions.toml). Every row and file is generated and no bench opens a
    # connection out of the runner; no Docker. The measures are kept as an artifact, for the release.
    name: bench (API, reference profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SHELFHOLD_BENCH_RESULTS: ${{ github.workspace }}/bench-results.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: API benches, in one process so that no timing is shared
        working-directory: backend
        run: >-
          uv run --locked pytest -m nightly -v --no-cov -p no:cacheprovider
          tests/bench/bench_library.py tests/bench/bench_search.py tests/bench/bench_contention.py
      - name: Keep the measures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench-results.json
          if-no-files-found: warn
