name: release

# release-please opens/updates the release PR on every push to main. GITHUB_TOKEN-created PRs do
# not trigger ci: the orchestrator closes and reopens the release PR to run the checks.
# Merging the release PR creates the v* tag + GitHub release (immutable); this run then adds the
# X.Y.Z and X.Y tags to the image already published for the release commit (output `sha` of
# release-please, not the sha of this run), once ci-success is green on it. Recovery: retag.yml.
# First release = v0.1.0: the squash-merge commit of the PR that closes M0 carries the footer
#   Release-As: 0.1.0
# (release-please reads it from the commit message; nothing sticky in the config).
# Deliberately no pull_request trigger: this workflow holds write tokens.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}  # lowercased by the script

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      sha: ${{ steps.rp.outputs.sha }}
      version: ${{ steps.rp.outputs.major }}.${{ steps.rp.outputs.minor }}.${{ steps.rp.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.rp.outputs.pr
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Migration line in the release PR (ENF-OPS-002)
        if: steps.rp.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ fromJSON(steps.rp.outputs.pr).number }}
        run: .github/scripts/release-migration-line.sh

  image-tags:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      checks: read
    uses: ./.github/workflows/image-retag.yml  # zizmor: ignore[self-repository]
    with:
      sha: ${{ needs.release-please.outputs.sha }}
      version: ${{ needs.release-please.outputs.version }}
