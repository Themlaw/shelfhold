name: release

# Adds the version tags X.Y.Z and X.Y to the image already published for the tagged commit
# (retag of sha-<long>: no rebuild, no "latest"), once ci-success is green on that commit.
# schema.sql and data-dictionary.md (EF-INT-027) are generated by `schema-assets` and attached, with
# the other proofs, by `release-proofs`.
# Triggered by `gh release create vX.Y.Z` (see docs/releasing.md). Recovery: run it again by hand
# with the tag as input. Deliberately no pull_request trigger: this workflow holds a write token.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, vX.Y.Z"
        type: string
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image-tags:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Add X.Y.Z and X.Y to the image of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}  # lowercased by the script
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: .github/scripts/release-retag.sh

  second-registry:
    # ENF-GOV-004, optional: gives the version tags to the image of the release on the second
    # registry, only when the secret CODEBERG_TOKEN exists AND that image is already there with a
    # valid cosign signature (made by image-publish.yml, the only workflow that signs). This job
    # holds no id-token: it cannot sign, so it never gives a version tag to an unsigned digest.
    # Without the token, or without a signed image on the second registry, it says so in its
    # summary and succeeds: the release is on GHCR, signed.
    needs: image-tags
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate the tag
        run: |
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::tag must be vX.Y.Z, got ${TAG}"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Second registry, detection (optional, never fails without the token)
        id: second
        env:
          HAS_TOKEN: ${{ secrets.CODEBERG_TOKEN != '' }}
          SECOND_REGISTRY: ${{ vars.SECOND_REGISTRY }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: .github/scripts/second-registry.sh detect
      - name: Second registry, login
        if: steps.second.outputs.enabled == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ steps.second.outputs.host }}
          username: ${{ vars.SECOND_REGISTRY_USER || github.repository_owner }}
          password: ${{ secrets.CODEBERG_TOKEN }}
      - name: Second registry, install cosign
        if: steps.second.outputs.enabled == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Second registry, the digest of the release on GHCR must be there and signed
        id: signed
        if: steps.second.outputs.enabled == 'true'
        env:
          SECOND_IMAGE: ${{ steps.second.outputs.image }}
          IMAGE: ghcr.io/${{ github.repository }}  # lowercased below
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="${IMAGE,,}"
          version="${TAG#v}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::cannot resolve ${IMAGE}:${version}"; exit 1; }
          identity="^https://github\.com/${REPOSITORY//./\.}/\.github/workflows/image-publish\.yml@refs/heads/main$"
          if cosign verify "${SECOND_IMAGE}@${digest}" --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null 2>&1; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${digest} is not on ${SECOND_IMAGE} with a valid signature: no version tag there"
            {
              echo "### Second registry: version tags skipped"
              echo "\`${digest}\` is absent from \`${SECOND_IMAGE}\` or not signed (the token was added after the build of this commit?). Nothing was tagged there; ENF-GOV-004 stays open."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Second registry, add X.Y.Z and X.Y to the signed digest
        if: steps.second.outputs.enabled == 'true' && steps.signed.outputs.signed == 'true'
        env:
          SECOND_IMAGE: ${{ steps.second.outputs.image }}
          IMAGE: ghcr.io/${{ github.repository }}  # lowercased below
          DIGEST: ${{ steps.signed.outputs.digest }}
        run: |
          IMAGE="${IMAGE,,}"
          version="${TAG#v}"
          minor="${version%.*}"
          existing="$(docker buildx imagetools inspect "${SECOND_IMAGE}:${version}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if [ -n "$existing" ] && [ "$existing" != "$DIGEST" ]; then
            echo "::error::${SECOND_IMAGE}:${version} already exists with digest ${existing}, refusing to rewrite it"; exit 1
          fi
          args=(-t "${SECOND_IMAGE}:${version}")
          # X.Y follows GHCR: it moves only if GHCR's X.Y is this very digest (never backwards)
          ghcr_minor="$(docker buildx imagetools inspect "${IMAGE}:${minor}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          [ "$ghcr_minor" = "$DIGEST" ] && args+=(-t "${SECOND_IMAGE}:${minor}")
          docker buildx imagetools create "${args[@]}" "${SECOND_IMAGE}@${DIGEST}"
          echo "### Second registry: tagged ${args[*]}" >> "$GITHUB_STEP_SUMMARY"

  schema-assets:
    # EF-INT-027: schema.sql and the data dictionary, generated from the migrations, are assets of
    # every release; they are attached by `release-proofs` (the only job with `contents: write`). Waits for `image-tags`,
    # which waits for a green ci-success on the tagged commit. The code is the TAG's (never the
    # branch of a manual run), and the tag is validated before it reaches a checkout or a command.
    needs: image-tags
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate the tag
        run: |
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::tag must be vX.Y.Z, got ${TAG}"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: false  # this job holds a write token: no cache a PR could have poisoned
      - name: Published migrations are unchanged, a patch release carries no new one (ENF-OPS-002)
        run: python3 tools/check_patch_migrations.py --tag "$TAG"
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: Generate schema.sql and data-dictionary.md
        run: .github/scripts/release-assets.sh "$RUNNER_TEMP/assets"
      - name: Hand schema.sql and data-dictionary.md to release-proofs, which attaches them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schema-assets
          path: |
            ${{ runner.temp }}/assets/schema.sql
            ${{ runner.temp }}/assets/data-dictionary.md
          if-no-files-found: error
          retention-days: 1

  test-report:
    # ENF-QUAL-007: the test report of the release is produced from the code of the TAG. It runs
    # without any write token (the proofs job below only attaches the file).
    needs: image-tags
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate the tag
        run: |
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::tag must be vX.Y.Z, got ${TAG}"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: pytest (unit suite, JUnit report)
        working-directory: backend
        run: uv run --locked pytest tests/unit -n auto --junitxml="$RUNNER_TEMP/test-report.xml" --cov-fail-under=0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: ${{ runner.temp }}/test-report.xml
          if-no-files-found: error
          retention-days: 1

  release-proofs:
    # ENF-SEC-007 / ENF-QUAL-007: the proofs of the release are assets of the release (artifacts
    # expire): the SBOM and the provenance extracted from the attestations of the published
    # digests (verified first), the test report, and the versioned benchmark reference.
    needs: [image-tags, test-report, schema-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate the tag
        run: |
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::tag must be vX.Y.Z, got ${TAG}"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-report
          path: ${{ runner.temp }}/proofs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: schema-assets
          path: ${{ runner.temp }}/proofs
      - name: Verify and extract the attestations (sbom.spdx.json, provenance.intoto.jsonl)
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}  # lowercased by the script
          REPO: ${{ github.repository }}
          OUT: ${{ runner.temp }}/proofs
        run: .github/scripts/release-proofs.sh
      - name: Attach the proofs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          PROOFS: ${{ runner.temp }}/proofs
        run: |
          cp .github/bench-reference.json "$PROOFS/bench-reference.json"
          gh release upload "$TAG" "$PROOFS/sbom.spdx.json" "$PROOFS/sbom-arm64.spdx.json" "$PROOFS/provenance.intoto.jsonl" \
            "$PROOFS/test-report.xml" "$PROOFS/bench-reference.json" \
            "$PROOFS/schema.sql" "$PROOFS/data-dictionary.md" --clobber --repo "$GITHUB_REPOSITORY"
