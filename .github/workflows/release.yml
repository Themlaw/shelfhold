name: release

# Adds the version tags X.Y.Z and X.Y to the image already published for the tagged commit
# (retag of sha-<long>: no rebuild, no "latest"), once ci-success is green on that commit.
# Triggered by `gh release create vX.Y.Z` (see docs/releasing.md). Recovery: run it again by hand
# with the tag as input. Deliberately no pull_request trigger: this workflow holds a write token.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, vX.Y.Z"
        type: string
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image-tags:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Add X.Y.Z and X.Y to the image of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}  # lowercased by the script
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: .github/scripts/release-retag.sh
