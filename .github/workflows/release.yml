name: release

# Adds the version tags X.Y.Z and X.Y to the image already published for the tagged commit
# (retag of sha-<long>: no rebuild, no "latest"), once ci-success is green on that commit.
# The second job attaches schema.sql and data-dictionary.md (EF-INT-027) to the release.
# Triggered by `gh release create vX.Y.Z` (see docs/releasing.md). Recovery: run it again by hand
# with the tag as input. Deliberately no pull_request trigger: this workflow holds a write token.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, vX.Y.Z"
        type: string
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image-tags:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the tags: the previous release is the baseline of the migration check
      - name: No migration in a patch release (ENF-OPS-002)
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 tools/check_patch_migrations.py "$TAG"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Add X.Y.Z and X.Y to the image of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}  # lowercased by the script
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: .github/scripts/release-retag.sh

  schema-assets:
    # EF-INT-027: schema.sql and the data dictionary, generated from the migrations, are assets of
    # every release. `--clobber` makes a re-run (recovery) replace them. Waits for `image-tags`,
    # which waits for a green ci-success on the tagged commit. The code is the TAG's (never the
    # branch of a manual run), and the tag is validated before it reaches a checkout or a command.
    needs: image-tags
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate the tag
        run: |
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::tag must be vX.Y.Z, got ${TAG}"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: false  # this job holds a write token: no cache a PR could have poisoned
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: Generate schema.sql and data-dictionary.md
        run: .github/scripts/release-assets.sh "$RUNNER_TEMP/assets"
      - name: Attach schema.sql and data-dictionary.md to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/assets/schema.sql" "$RUNNER_TEMP/assets/data-dictionary.md" --clobber --repo "$GITHUB_REPOSITORY"
