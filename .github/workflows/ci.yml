name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: ruff check
        working-directory: backend
        run: uv run --locked ruff check .
      - name: ruff format
        working-directory: backend
        run: uv run --locked ruff format --check .
      - name: mypy
        working-directory: backend
        run: uv run --locked mypy
      - name: import-linter
        working-directory: backend
        run: uv run --locked lint-imports --config importlinter.ini
      - name: typos
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - name: actionlint
        working-directory: backend
        run: uv run --locked actionlint ../.github/workflows/*.yml
      - name: zizmor
        working-directory: backend
        run: uv run --locked zizmor --offline ../.github/workflows
      - name: zizmor (online audits, read-only token)
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked zizmor --format=plain ../.github/workflows
      - name: gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --verbose .

  denylist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: denylist-names
        env:
          DENYLIST_NAMES: ${{ secrets.DENYLIST_NAMES }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: bash .github/scripts/denylist.sh

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: pytest (global coverage >= 80 %)
        working-directory: backend
        run: uv run --locked pytest --cov --cov-report=xml
      - name: diff coverage >= 85 %
        if: github.event_name == 'pull_request'
        working-directory: backend
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run --locked diff-cover coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under=85

  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.x"
      - name: Regenerate synthetic fixtures and verify manifest
        working-directory: backend
        run: |
          uv run --no-project python tests/fixtures/synthetic/generate.py "$RUNNER_TEMP/synthetic"
          diff -r "$RUNNER_TEMP/synthetic" tests/fixtures/synthetic --exclude=generate.py --exclude=__pycache__
          (cd tests/fixtures/synthetic && sha256sum --check --strict MANIFEST.sha256)
      - name: Cassette header allowlist
        run: |
          uv sync --project backend --locked
          uv run --project backend --locked pytest backend/tests/unit/test_fixtures_synthetic.py -k cassettes

  ci-success:
    if: always()
    needs: [changes, lint, denylist, backend, fixtures]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Verify required jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          DENYLIST: ${{ needs.denylist.result }}
          BACKEND: ${{ needs.backend.result }}
          FIXTURES: ${{ needs.fixtures.result }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
        run: |
          echo "changes=${CHANGES} lint=${LINT} denylist=${DENYLIST} backend=${BACKEND} fixtures=${FIXTURES} (changed=${BACKEND_CHANGED})"
          ok=1
          for r in "$CHANGES" "$LINT" "$DENYLIST" "$FIXTURES"; do
            [ "$r" = "success" ] || ok=0
          done
          if [ "$BACKEND" = "skipped" ]; then
            [ "$BACKEND_CHANGED" != "true" ] || ok=0
          else
            [ "$BACKEND" = "success" ] || ok=0
          fi
          if [ "$ok" != "1" ]; then
            echo "::error::a required job failed, was cancelled, or was skipped unexpectedly"
            exit 1
          fi
