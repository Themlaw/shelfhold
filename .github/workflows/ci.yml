name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]  # edited: the PR title is checked
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      openapi: ${{ steps.filter.outputs.openapi }}
      e2e: ${{ steps.filter.outputs.e2e }}
      image: ${{ steps.filter.outputs.image }}
      backend_shards: ${{ steps.shards.outputs.backend }}
      backend_shard_total: ${{ steps.shards.outputs.backend_total }}
      e2e_shards: ${{ steps.shards.outputs.e2e }}
      e2e_shard_total: ${{ steps.shards.outputs.e2e_total }}
    env:
      # The only place where the number of shards is defined (see CONTRIBUTING.md).
      BACKEND_SHARDS: "4"
      E2E_SHARDS: "2"
    steps:
      - id: shards
        run: |
          {
            echo "backend=$(seq -s, 1 "$BACKEND_SHARDS" | sed 's/^/[/;s/$/]/')"
            echo "backend_total=${BACKEND_SHARDS}"
            echo "e2e=$(seq -s, 1 "$E2E_SHARDS" | sed 's/^/[/;s/$/]/')"
            echo "e2e_total=${E2E_SHARDS}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker/**'
              - 'compose*.yaml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'open-api/**'
              - '.github/workflows/ci.yml'
            openapi:
              - 'backend/**'
              - 'frontend/**'
              - 'open-api/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'backend/**'
              - 'frontend/**'
              - 'open-api/**'
              - 'e2e/**'
              - '.github/workflows/ci.yml'
            image:
              - 'backend/**'
              - 'frontend/**'
              - 'docker/**'
              - 'open-api/**'
              - '.dockerignore'
              - 'e2e/**'
              - 'compose*'
              - '.github/workflows/image*'

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
      HADOLINT_VERSION: "2.15.1"
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: ruff check
        working-directory: backend
        run: uv run --locked ruff check .
      - name: ruff format
        working-directory: backend
        run: uv run --locked ruff format --check .
      - name: mypy
        working-directory: backend
        run: uv run --locked mypy
      - name: import-linter
        working-directory: backend
        run: uv run --locked lint-imports --config importlinter.ini
      - name: typos
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - name: actionlint
        working-directory: backend
        run: uv run --locked actionlint ../.github/workflows/*.yml
      - name: zizmor
        working-directory: backend
        run: uv run --locked zizmor --offline ../.github/workflows
      - name: zizmor (online audits, read-only token)
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked zizmor --format=plain ../.github/workflows
      - name: hadolint
        run: |
          curl -sSfL -o hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum --check --strict
          chmod +x hadolint
          ./hadolint docker/Dockerfile
      - name: gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --verbose .

  denylist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: denylist-names (files and commit messages)
        env:
          DENYLIST_NAMES: ${{ secrets.DENYLIST_NAMES }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSHED_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            export DENYLIST_LOG_ARGS="${BASE_SHA}..${HEAD_SHA}"
          else
            export DENYLIST_LOG_ARGS="-1 ${PUSHED_SHA}"
          fi
          bash .github/scripts/denylist.sh

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          # Bots are exempted on the identity of the PR author, never on a git author name.
          if [ "$PR_USER" = "dependabot[bot]" ]; then
            echo "pull request opened by ${PR_USER}: exempt"
            exit 0
          fi
          status=0
          # Only commits that belong to the PR (not already reachable from the base branch).
          for sha in $(git rev-list --no-merges "${HEAD_SHA}" --not "${BASE_SHA}"); do
            if ! git show -s --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <[^<>]+@[^<>]+>$'; then
              echo "::error::commit $sha has no Signed-off-by line (use git commit -s)"
              status=1
            fi
          done
          exit $status

  conventional-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-unit:
    # Unit tests, split over a matrix of shards (hash of the node id, see tests/conftest.py).
    name: backend-unit (${{ matrix.shard }}/${{ needs.changes.outputs.backend_shard_total }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.backend_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: pytest (shard, coverage data only)
        working-directory: backend
        env:
          COVERAGE_FILE: .coverage.unit-${{ matrix.shard }}
          SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.backend_shard_total }}
        run: uv run --locked pytest tests/unit -n auto --shard "$SHARD" --cov --cov-report= --cov-fail-under=0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit-${{ matrix.shard }}
          path: backend/.coverage.unit-${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1

  backend-integration:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: pytest (integration, coverage data only)
        working-directory: backend
        env:
          COVERAGE_FILE: .coverage.integration
        run: uv run --locked pytest tests/integration -n auto --cov --cov-report= --cov-fail-under=0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration
          path: backend/.coverage.integration
          include-hidden-files: true
          retention-days: 1

  backend-suites:
    # Property (Hypothesis), golden (syrupy) and fault-injection suites: one job each, so that none
    # becomes the bottleneck. A suite that outgrows 10 minutes gets `--shard`, like backend-unit.
    name: backend-${{ matrix.suite }}
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [property, golden, faults]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: pytest (suite, coverage data only)
        working-directory: backend
        env:
          COVERAGE_FILE: .coverage.${{ matrix.suite }}
        run: uv run --locked pytest tests/${{ matrix.suite }} -n auto --cov --cov-report= --cov-fail-under=0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.suite }}
          path: backend/.coverage.${{ matrix.suite }}
          include-hidden-files: true
          retention-days: 1

  # The contract bench (real Suwayomi, needs Docker) is not a required check: see contract.yml.

  coverage:
    # Combines the coverage data of every backend shard, then applies the thresholds.
    needs: [changes, backend-unit, backend-integration, backend-suites]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: backend
          merge-multiple: true
      - name: Combine the shards
        working-directory: backend
        run: |
          uv run --locked coverage combine --keep .coverage.*
          uv run --locked coverage xml
      - name: global coverage >= 80 % (fail_under in pyproject.toml)
        working-directory: backend
        run: uv run --locked coverage report
      - name: diff coverage >= 85 %
        if: github.event_name == 'pull_request'
        working-directory: backend
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run --locked diff-cover coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under=85

  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Regenerate synthetic fixtures and verify manifest
        working-directory: backend
        run: |
          uv run --no-project python tests/fixtures/synthetic/generate.py "$RUNNER_TEMP/synthetic"
          diff -r "$RUNNER_TEMP/synthetic" tests/fixtures/synthetic --exclude=generate.py --exclude=__pycache__
          (cd tests/fixtures/synthetic && sha256sum --check --strict MANIFEST.sha256)
      - name: Cassette header allowlist
        run: |
          uv sync --project backend --locked
          uv run --project backend --locked pytest backend/tests/unit/test_fixtures_synthetic.py -k cassettes

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: eslint
        run: npm run lint
      - name: svelte-check (TypeScript strict)
        run: npm run check
      - name: vitest
        run: npm test
      - name: build (adapter-static)
        run: npm run build

  openapi:
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --locked
      - run: npm ci
        working-directory: frontend
      - name: regenerate the schema and the client
        run: ./open-api/generate.sh
      - name: the committed schema and client must be up to date
        run: |
          git diff --exit-code -- open-api frontend/src/lib/api
          untracked="$(git status --porcelain -- open-api frontend/src/lib/api)"
          if [ -n "$untracked" ]; then
            echo "::error::generated files differ from the committed ones:"
            echo "$untracked"
            exit 1
          fi

  e2e-front:
    name: e2e-front (${{ matrix.shard }}/${{ needs.changes.outputs.e2e_shard_total }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.e2e_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: uv sync --project backend --locked
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Playwright (chromium, shard)
        working-directory: e2e
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.e2e_shard_total }}
        run: npx playwright test --shard="$SHARD" --pass-with-no-tests

  # Image: two callers so that packages: write never reaches a pull_request run (including
  # branches of this repository). The reusable workflows narrow the token further.
  # On a pull request the image (amd64 only) is built only when something it contains changed.
  image-pr:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/image.yml  # zizmor: ignore[self-repository]

  image-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml  # zizmor: ignore[self-repository]
    with:
      cache-write: true
      arm64: true

  image-publish:
    # Pushes the archives tested by image-main (same run), then the multi-arch manifest.
    # Also gated on the test jobs (not on ci-success, which needs this job). Filtered jobs may be
    # skipped, hence !failure(): a failed or cancelled needed job blocks the publication.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() && !failure()
    needs: [image-main, lint, denylist, fixtures, backend-unit, backend-integration, backend-suites, coverage, frontend, openapi, e2e-front]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-publish.yml  # zizmor: ignore[self-repository]

  traceability:
    # Blocking: every requirement of the milestone has a test, every test has a marker.
    # The matrix is not committed: it is an artifact and the job summary.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the M0 traceability matrix
        run: |
          set +e
          python3 tools/traceability.py --milestone M0 --output "$RUNNER_TEMP/M0.md" 2> "$RUNNER_TEMP/errors.txt"
          status=$?
          {
            cat "$RUNNER_TEMP/M0.md"
            echo
            echo '## Erreurs et avertissements'
            echo '```'
            cat "$RUNNER_TEMP/errors.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: traceability-M0
          path: ${{ runner.temp }}/M0.md
          if-no-files-found: ignore
          retention-days: 14

  ci-success:
    if: always()
    needs: [changes, lint, denylist, dco, conventional-title, traceability, backend-unit, backend-integration, backend-suites, coverage, fixtures, frontend, openapi, e2e-front, image-pr, image-main, image-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Verify required jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          DENYLIST: ${{ needs.denylist.result }}
          DCO: ${{ needs.dco.result }}
          TITLE: ${{ needs.conventional-title.result }}
          TRACEABILITY: ${{ needs.traceability.result }}
          IMAGE_CHANGED: ${{ needs.changes.outputs.image }}
          BACKEND_UNIT: ${{ needs.backend-unit.result }}
          BACKEND_INTEGRATION: ${{ needs.backend-integration.result }}
          COVERAGE: ${{ needs.coverage.result }}
          FIXTURES: ${{ needs.fixtures.result }}
          IMAGE_PR: ${{ needs.image-pr.result }}
          IMAGE_MAIN: ${{ needs.image-main.result }}
          IMAGE_PUBLISH: ${{ needs.image-publish.result }}
          EVENT: ${{ github.event_name }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND: ${{ needs.frontend.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          OPENAPI: ${{ needs.openapi.result }}
          OPENAPI_CHANGED: ${{ needs.changes.outputs.openapi }}
          E2E: ${{ needs.e2e-front.result }}
          E2E_CHANGED: ${{ needs.changes.outputs.e2e }}
        run: |
          echo "dco=${DCO} conventional-title=${TITLE} traceability=${TRACEABILITY} (image changed=${IMAGE_CHANGED})"
          echo "changes=${CHANGES} lint=${LINT} denylist=${DENYLIST} fixtures=${FIXTURES} image-pr=${IMAGE_PR} image-main=${IMAGE_MAIN} image-publish=${IMAGE_PUBLISH}"
          echo "backend-unit=${BACKEND_UNIT} backend-integration=${BACKEND_INTEGRATION} coverage=${COVERAGE} (changed=${BACKEND_CHANGED}) frontend=${FRONTEND} (changed=${FRONTEND_CHANGED})"
          echo "openapi=${OPENAPI} (changed=${OPENAPI_CHANGED}) e2e-front=${E2E} (changed=${E2E_CHANGED})"
          ok=1
          for r in "$CHANGES" "$LINT" "$DENYLIST" "$FIXTURES" "$TRACEABILITY"; do
            [ "$r" = "success" ] || ok=0
          done
          # A filtered job may be skipped only when its paths filter is false.
          check_filtered() {
            if [ "$1" = "skipped" ]; then
              [ "$2" != "true" ] || ok=0
            else
              [ "$1" = "success" ] || ok=0
            fi
          }
          check_filtered "$BACKEND_UNIT" "$BACKEND_CHANGED"
          check_filtered "$BACKEND_INTEGRATION" "$BACKEND_CHANGED"
          check_filtered "$COVERAGE" "$BACKEND_CHANGED"
          check_filtered "$FRONTEND" "$FRONTEND_CHANGED"
          check_filtered "$OPENAPI" "$OPENAPI_CHANGED"
          check_filtered "$E2E" "$E2E_CHANGED"
          # Exactly one image path per event: pull request -> image-pr, push -> image-main + image-publish.
          # dco and conventional-title only run on pull requests.
          if [ "$EVENT" = "pull_request" ]; then
            [ "$DCO" = "success" ] && [ "$TITLE" = "success" ] || ok=0
            # image-pr is skipped only when no file the image contains changed.
            check_filtered "$IMAGE_PR" "$IMAGE_CHANGED"
            [ "$IMAGE_MAIN" = "skipped" ] && [ "$IMAGE_PUBLISH" = "skipped" ] || ok=0
          else
            [ "$DCO" = "skipped" ] && [ "$TITLE" = "skipped" ] || ok=0
            [ "$IMAGE_PR" = "skipped" ] || ok=0
            [ "$IMAGE_MAIN" = "success" ] && [ "$IMAGE_PUBLISH" = "success" ] || ok=0
          fi
          if [ "$ok" != "1" ]; then
            echo "::error::a required job failed, was cancelled, or was skipped unexpectedly"
            exit 1
          fi
