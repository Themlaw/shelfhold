name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]  # edited: the PR title is checked
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Scope of the run (step `scope`): on a pull request, what the changed files can affect; on
      # a push to main, everything ("true"). See CONTRIBUTING.md, "Quelle CI pour quels fichiers".
      backend: ${{ steps.scope.outputs.backend }}
      unit: ${{ steps.scope.outputs.unit }}
      integration: ${{ steps.scope.outputs.integration }}
      suites: ${{ steps.scope.outputs.suites }}
      backend_suites: ${{ steps.scope.outputs.backend_suites }}
      bench: ${{ steps.scope.outputs.bench }}
      fixtures: ${{ steps.scope.outputs.fixtures }}
      frontend: ${{ steps.scope.outputs.frontend }}
      openapi: ${{ steps.scope.outputs.openapi }}
      e2e: ${{ steps.scope.outputs.e2e }}
      image: ${{ steps.scope.outputs.image }}
      image_build: ${{ steps.scope.outputs.image_build }}
      backend_shards: ${{ steps.shards.outputs.backend }}
      backend_shard_total: ${{ steps.shards.outputs.backend_total }}
      backend_integration_shards: ${{ steps.shards.outputs.backend_integration }}
      backend_integration_shard_total: ${{ steps.shards.outputs.backend_integration_total }}
      e2e_shards: ${{ steps.shards.outputs.e2e }}
      e2e_shard_total: ${{ steps.shards.outputs.e2e_total }}
    env:
      # The only place where the number of shards is defined (see CONTRIBUTING.md).
      BACKEND_SHARDS: "4"
      BACKEND_INTEGRATION_SHARDS: "10"
      E2E_SHARDS: "2"
    steps:
      - id: shards
        run: |
          {
            echo "backend=$(seq -s, 1 "$BACKEND_SHARDS" | sed 's/^/[/;s/$/]/')"
            echo "backend_total=${BACKEND_SHARDS}"
            echo "backend_integration=$(seq -s, 1 "$BACKEND_INTEGRATION_SHARDS" | sed 's/^/[/;s/$/]/')"
            echo "backend_integration_total=${BACKEND_INTEGRATION_SHARDS}"
            echo "e2e=$(seq -s, 1 "$E2E_SHARDS" | sed 's/^/[/;s/$/]/')"
            echo "e2e_total=${E2E_SHARDS}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # a file matches when it matches one pattern and no negated (`!`) pattern
          predicate-quantifier: some-with-excludes
          filters: |
            core:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'backend/**'
              - '!backend/tests/unit/**'
              - '!backend/tests/integration/**'
              - '!backend/tests/golden/**'
              - '!backend/tests/faults/**'
              - '!backend/tests/property/**'
              - '!backend/tests/bench/**'
              - '!backend/**/*.md'
              - 'sdk/**'
              - 'docker/**'
              - 'frontend/**'
              - 'open-api/**'
              - '.github/workflows/ci.yml'
            unit_tests:
              - 'backend/tests/unit/**'
              - 'tools/check_submodule_pin.py'
              - '.gitmodules'
              - 'THIRD_PARTY_NOTICES'
              - 'docs/dependencies.md'
            integration_tests:
              - 'backend/tests/integration/**'
            golden_tests:
              - 'backend/tests/golden/**'
            faults_tests:
              - 'backend/tests/faults/**'
            property_tests:
              - 'backend/tests/property/**'
            bench_tests:
              - 'backend/tests/bench/**'
            workflows:
              - '.github/workflows/**'
            compose:
              - 'compose*.yaml'
              - '.env.example'
              - '.dockerignore'
            frontend:
              - 'frontend/**'
              - 'open-api/**'
              - 'tools/check_submodule_pin.py'
              - '.gitmodules'
              - '.github/workflows/ci.yml'
            openapi:
              - 'backend/**'
              - '!backend/tests/**'
              - '!backend/**/*.md'
              - 'frontend/**'
              - 'open-api/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'backend/**'
              - '!backend/tests/**'
              - '!backend/**/*.md'
              - 'frontend/**'
              - 'open-api/**'
              - 'e2e/**'
              - '.github/workflows/ci.yml'
            image:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'backend/pyproject.toml'
              - 'backend/src/**'
              - 'sdk/**'
              - 'frontend/**'
              - 'docker/**'
              - 'open-api/**'
              - 'e2e/**'
              - '.github/workflows/image*'
              - '.github/workflows/ci.yml'
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          FILTERS: ${{ toJSON(steps.filter.outputs) }}
        run: |
          # `any a b ...`: true on a push to main (everything runs), otherwise when one filter matched.
          # The filter names are fixed above; the values are "true"/"false" only.
          flag() { jq -r --arg k "$1" '.[$k] // "false"' <<<"$FILTERS"; }
          any() {
            [ "$EVENT" != pull_request ] && { echo true; return; }
            for k in "$@"; do [ "$(flag "$k")" = true ] && { echo true; return; }; done
            echo false
          }
          suites=()
          for s in property golden faults; do
            [ "$(any core "${s}_tests")" = true ] && suites+=("\"$s\"")
          done
          list=$(IFS=,; echo "[${suites[*]}]")
          {
            echo "backend=$(any core)"
            echo "unit=$(any core unit_tests compose workflows)"
            echo "integration=$(any core integration_tests)"
            echo "bench=$(any core bench_tests)"
            echo "fixtures=$(any core unit_tests)"
            echo "backend_suites=${list}"
            echo "suites=$([ ${#suites[@]} -gt 0 ] && echo true || echo false)"
            echo "frontend=$(any frontend)"
            echo "openapi=$(any openapi)"
            echo "e2e=$(any e2e)"
            echo "image=$(any image)"
            echo "image_build=$(any image compose)"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
      HADOLINT_VERSION: "2.15.1"
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: ruff check
        working-directory: backend
        run: uv run --locked ruff check .
      - name: ruff format
        working-directory: backend
        run: uv run --locked ruff format --check .
      - name: mypy
        working-directory: backend
        run: uv run --locked mypy
      - name: import-linter
        working-directory: backend
        run: uv run --locked lint-imports --config importlinter.ini
      - name: i18n parity (missing key = failure, ENF-I18N-001)
        working-directory: backend
        run: uv run --locked python ../tools/i18n_parity.py
      - name: published migrations frozen (a new migration is frozen by its own PR, ENF-OPS-002)
        run: python3 tools/check_patch_migrations.py
      - name: foliate-js submodule pinned to the commit of docs/dependencies.md (EF-LEC-003, R13)
        run: python3 tools/check_submodule_pin.py pin
      - name: typos
        id: typos-first
        continue-on-error: true  # the action downloads its binary from a release: one more try below
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
      - name: typos (second try; a real finding fails it again)
        if: steps.typos-first.outcome == 'failure'
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
      - name: actionlint
        working-directory: backend
        run: uv run --locked actionlint ../.github/workflows/*.yml
      - name: zizmor
        working-directory: backend
        run: uv run --locked zizmor --offline ../.github/workflows
      - name: zizmor (online audits, read-only token)
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked zizmor --format=plain ../.github/workflows
      - name: Restore hadolint (cache keyed by version and sha256; the sum is checked again below)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/shelfhold-tools/hadolint
          key: tool-hadolint-${{ env.HADOLINT_VERSION }}-${{ env.HADOLINT_SHA256 }}
      - name: hadolint
        run: |
          .github/scripts/fetch-tool.sh "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64" "$HADOLINT_SHA256" ~/.cache/shelfhold-tools/hadolint/hadolint
          chmod +x ~/.cache/shelfhold-tools/hadolint/hadolint
          ~/.cache/shelfhold-tools/hadolint/hadolint docker/Dockerfile
      - name: Restore gitleaks (cache keyed by version and sha256; the sum is checked again below)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/shelfhold-tools/gitleaks
          key: tool-gitleaks-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}
      - name: gitleaks
        run: |
          .github/scripts/fetch-tool.sh "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "$GITLEAKS_SHA256" ~/.cache/shelfhold-tools/gitleaks/gitleaks.tgz
          tar -xzf ~/.cache/shelfhold-tools/gitleaks/gitleaks.tgz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --log-opts="HEAD" .

  denylist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: denylist-names (files and commit messages)
        env:
          DENYLIST_NAMES: ${{ secrets.DENYLIST_NAMES }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSHED_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            export DENYLIST_LOG_ARGS="${BASE_SHA}..${HEAD_SHA}"
          else
            export DENYLIST_LOG_ARGS="-1 ${PUSHED_SHA}"
          fi
          bash .github/scripts/denylist.sh

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          # Bots are exempted on the identity of the PR author, never on a git author name.
          if [ "$PR_USER" = "dependabot[bot]" ]; then
            echo "pull request opened by ${PR_USER}: exempt"
            exit 0
          fi
          status=0
          # Only commits that belong to the PR (not already reachable from the base branch).
          for sha in $(git rev-list --no-merges "${HEAD_SHA}" --not "${BASE_SHA}"); do
            if ! git show -s --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <[^<>]+@[^<>]+>$'; then
              echo "::error::commit $sha has no Signed-off-by line (use git commit -s)"
              status=1
            fi
          done
          exit $status

  conventional-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-unit:
    # Unit tests, split over a matrix of shards (hash of the node id, see tests/conftest.py).
    name: backend-unit (${{ matrix.shard }}/${{ needs.changes.outputs.backend_shard_total }})
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.backend_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: pytest (shard, coverage data only)
        working-directory: backend
        env:
          COVERAGE_FILE: .coverage.unit-${{ matrix.shard }}
          SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.backend_shard_total }}
        run: uv run --locked pytest tests/unit -n auto --shard "$SHARD" --cov --cov-report= --cov-fail-under=0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit-${{ matrix.shard }}
          path: backend/.coverage.unit-${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1

  backend-integration:
    # Integration tests, sharded like backend-unit (the unsharded job hit its 15 min timeout).
    name: backend-integration (${{ matrix.shard }}/${{ needs.changes.outputs.backend_integration_shard_total }})
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.backend_integration_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: pytest (integration, coverage data only)
        working-directory: backend
        env:
          COVERAGE_FILE: .coverage.integration-${{ matrix.shard }}
          SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.backend_integration_shard_total }}
        run: uv run --locked pytest tests/integration -n auto --shard "$SHARD" --cov --cov-report= --cov-fail-under=0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration-${{ matrix.shard }}
          path: backend/.coverage.integration-${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1

  backend-suites:
    # Property (Hypothesis), golden (syrupy) and fault-injection suites: one job each, so that none
    # becomes the bottleneck. A suite that outgrows 10 minutes gets `--shard`, like backend-unit.
    name: backend-${{ matrix.suite }}
    needs: changes
    if: needs.changes.outputs.suites == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.backend_suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: pytest (suite, coverage data only)
        working-directory: backend
        env:
          COVERAGE_FILE: .coverage.${{ matrix.suite }}
          SUITE: ${{ matrix.suite }}
        run: uv run --locked pytest "tests/${SUITE}" -n auto --cov --cov-report= --cov-fail-under=0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.suite }}
          path: backend/.coverage.${{ matrix.suite }}
          include-hidden-files: true
          retention-days: 1

  backend-bench:
    # The culpable benches (tests/bench): a threshold from the spec fails the job. Alone on the
    # runner and without xdist or coverage, so the median of its runs measures the code, not the
    # neighbours. Synthetic data, no network.
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: pytest (bench)
        working-directory: backend
        run: uv run --locked pytest tests/bench -m bench --no-cov

  # The contract bench (real Suwayomi, needs Docker) is not a required check: see contract.yml.

  coverage:
    # Combines the coverage data of every backend shard, then applies the thresholds. Only when
    # production code (or a shared test helper) changed: that is when every suite runs, and a partial
    # combination would fail the global threshold. A pull request of tests alone does not need it.
    needs: [changes, backend-unit, backend-integration, backend-suites]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: backend
          merge-multiple: true
      - name: Combine the shards
        working-directory: backend
        run: |
          uv run --locked coverage combine --keep .coverage.*
          uv run --locked coverage xml
      - name: global coverage >= 80 % (fail_under in pyproject.toml)
        working-directory: backend
        run: uv run --locked coverage report
      - name: diff coverage >= 85 %
        if: github.event_name == 'pull_request'
        working-directory: backend
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run --locked diff-cover coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under=85

  fixtures:
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Regenerate synthetic fixtures and verify manifest
        working-directory: backend
        run: |
          uv run --no-project python tests/fixtures/synthetic/generate.py "$RUNNER_TEMP/synthetic"
          diff -r "$RUNNER_TEMP/synthetic" tests/fixtures/synthetic --exclude=generate.py --exclude=generate_malicious.py --exclude=__pycache__
          (cd tests/fixtures/synthetic && sha256sum --check --strict MANIFEST.sha256)
      - name: Cassette header allowlist
        run: |
          uv sync --project backend --locked
          uv run --project backend --locked pytest backend/tests/unit/test_fixtures_synthetic.py -k cassettes

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true  # frontend/vendor/foliate-js, the commit of the gitlink (never recursive)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: no reader asset from a third-party origin, vendored code included (EF-LEC-003)
        working-directory: .
        run: python3 tools/check_submodule_pin.py assets --require-checkout
      - name: pinned foliate-js commit is at least 14 days old (EF-LEC-003, update rule)
        working-directory: .
        run: python3 tools/check_submodule_pin.py pin --min-age 14
      - name: eslint
        run: npm run lint
      - name: svelte-check (TypeScript strict)
        run: npm run check
      - name: vitest
        run: npm test
      - name: build (adapter-static)
        run: npm run build

  openapi:
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --locked
      - run: npm ci
        working-directory: frontend
      - name: regenerate the schema and the client
        run: ./open-api/generate.sh
      - name: the committed schema and client must be up to date
        run: |
          git diff --exit-code -- open-api frontend/src/lib/api
          untracked="$(git status --porcelain -- open-api frontend/src/lib/api)"
          if [ -n "$untracked" ]; then
            echo "::error::generated files differ from the committed ones:"
            echo "$untracked"
            exit 1
          fi

  e2e-front:
    name: e2e-front (${{ matrix.shard }}/${{ needs.changes.outputs.e2e_shard_total }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.e2e_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true  # frontend/vendor/foliate-js, the commit of the gitlink (never recursive)
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: uv sync --project backend --locked
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      # The runner image already ships Chromium's system libraries; when the
      # Ubuntu mirrors are unreachable, install the browser alone instead of
      # failing the job on apt.
      - name: Playwright browser
        working-directory: e2e
        run: |
          # apt waits ~10 min per unreachable mirror: bound it, then fall back.
          timeout 180 npx playwright install --with-deps chromium && exit 0
          echo "::warning::playwright --with-deps failed; installing the browser alone"
          npx playwright install chromium
      - name: Playwright (chromium, shard)
        working-directory: e2e
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.e2e_shard_total }}
        run: npx playwright test --shard="$SHARD" --pass-with-no-tests

  # EPUB reader (M5 L12): a blob: document inherits the policy of the page that made it, which is a
  # behaviour of each browser (ADR-0055): the specs of the reader are played on all three engines,
  # and a failure on one of them blocks the merge (WebKit included).
  e2e-reader:
    name: e2e-reader (${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # WebKit runs in the official image of Playwright (the version of the package, by digest): its
    # system libraries are 180 packages from a mirror that stalls, and a step killed in the middle
    # of apt leaves the dpkg lock held. The browsers of the image are the ones of the package.
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            image: ''
          - browser: firefox
            image: ''
          - browser: webkit
            image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
    steps:
      - name: git (the image of Playwright has none; the submodule needs it)
        if: matrix.image != ''
        run: command -v git >/dev/null || (apt-get update && apt-get install -y --no-install-recommends git ca-certificates)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true  # frontend/vendor/foliate-js, the commit of the gitlink (never recursive)
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: uv sync --project backend --locked
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - name: Playwright browser
        if: matrix.image == ''
        working-directory: e2e
        timeout-minutes: 8
        env:
          BROWSER: ${{ matrix.browser }}
        # The libraries are installed to the end, never cut by `timeout`: a killed `npx` leaves its
        # `apt-get` holding the dpkg lock and every later attempt fails on the lock. The step is
        # bounded by `timeout-minutes` instead (which stops the whole process group).
        run: npx playwright install --with-deps "$BROWSER"
      - name: Playwright (reader, one engine)
        working-directory: e2e
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx playwright test -c playwright.reader.config.ts --project="$BROWSER"

  # Workshop harness (M3 L02): the SPA served by the API on a synthetic base, played on a desktop
  # window and on 360x780 (projects workshop-desktop and workshop-mobile), axe blocking on serious
  # and critical. No outbound network: the base is synthetic and the API runs on the runner.
  frontend-e2e:
    name: frontend-e2e (${{ matrix.shard }}/${{ needs.changes.outputs.e2e_shard_total }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.e2e_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true  # frontend/vendor/foliate-js, the commit of the gitlink (never recursive)
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: uv sync --project backend --locked
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - name: Playwright browser
        working-directory: e2e
        run: |
          timeout 180 npx playwright install --with-deps chromium && exit 0
          echo "::warning::playwright --with-deps failed; installing the browser alone"
          npx playwright install chromium
      - name: Workshop projects (shard)
        working-directory: e2e
        env:
          SHELFHOLD_E2E_SUITE: workshop
          SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.e2e_shard_total }}
        run: npx playwright test --shard="$SHARD"

  # The reader page-turn bench (M5 L15, ENF-PERF-006): a report here, never a gate. The budget
  # (p95 <= 150 ms over 30 turns) is enforced before a release, against the recorded reference
  # (e2e/bench/reference.json, docs/governance/benchmarks.md); in CI the numbers are only
  # published, so a noisy runner never blocks a PR. Never in the night run either: a perf budget
  # is measured before a release (03 §4), not on the pushes of the night.
  reader-bench:
    name: reader-bench (report only)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true  # frontend/vendor/foliate-js, the commit of the gitlink (never recursive)
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: uv sync --project backend --locked
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - name: Playwright browser
        working-directory: e2e
        run: |
          timeout 180 npx playwright install --with-deps chromium && exit 0
          echo "::warning::playwright --with-deps failed; installing the browser alone"
          npx playwright install chromium
      - name: Reader page-turn bench
        working-directory: e2e
        run: npm run test:bench
      - name: Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-bench
          path: e2e/test-results/bench_reader_page_turn.json
          if-no-files-found: warn

  # The typed client is regenerated and must not differ from what is committed (EF-INT-001).
  client-drift:
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --locked
      - run: npm ci
        working-directory: frontend
      - name: regenerate the schema and the client
        run: ./open-api/generate.sh
      - name: no diff, no uncommitted generated file
        run: python3 tools/client_drift.py

  # Image: two callers so that packages: write never reaches a pull_request run (including
  # branches of this repository). The reusable workflows narrow the token further.
  # On a pull request the image (amd64 only) is built only when something it contains changed.
  image-pr:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.image_build == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/image.yml  # zizmor: ignore[self-repository]
    with:
      # compose files, .env.example and .dockerignore: the image is built and only the install smoke runs
      only-smoke: ${{ needs.changes.outputs.image != 'true' }}

  image-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml  # zizmor: ignore[self-repository]
    with:
      cache-write: true
      arm64: true

  image-publish:
    # Pushes the archives tested by image-main (same run), then the multi-arch manifest.
    # Also gated on the test jobs (not on ci-success, which needs this job). Filtered jobs may be
    # skipped, hence !failure(): a failed or cancelled needed job blocks the publication.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() && !failure()
    needs: [image-main, lint, denylist, fixtures, backend-unit, backend-integration, backend-suites, coverage, frontend, openapi, e2e-front, e2e-reader]
    permissions:
      contents: read
      packages: write
      id-token: write  # attestations of the pushed digests, used by the `merge` job only
      attestations: write
    uses: ./.github/workflows/image-publish.yml  # zizmor: ignore[self-repository]
    secrets:
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}  # optional (ENF-GOV-004): absent = GHCR only

  scan:
    # Grype on the image archive that was built (and tested) in this run, SARIF to code scanning.
    # Reports, does not block: a vulnerability published tomorrow must not break an unrelated PR,
    # so ci-success lists it but does not check its result, and `fail-build` is off (the findings are in the Security tab).
    needs: [image-pr, image-main]
    if: always() && (needs.image-pr.result == 'success' || needs.image-main.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}/image
      - name: Grype
        id: grype-first
        continue-on-error: true  # its installer fetches a release asset: one more try below
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: oci-archive:${{ runner.temp }}/image/image-amd64.tar
          fail-build: false
          output-format: sarif
      - name: Grype (second try, after a failed download)
        id: grype-retry
        if: steps.grype-first.outcome == 'failure'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: oci-archive:${{ runner.temp }}/image/image-amd64.tar
          fail-build: false
          output-format: sarif
      - name: Upload the SARIF report (never from a fork pull request, whose token cannot write)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.grype-retry.outputs.sarif || steps.grype-first.outputs.sarif }}
          category: grype

  traceability:
    # Blocking for every delivered milestone (M0, M1a, M1b, M2, M3, M4, M5): every requirement of the milestone has a test, every test has a marker.
    # The matrix is not committed: it is an artifact and the job summary.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every delivered milestone blocks (M2 and M3 since the closure of M3, L58; M4 since its
      # closure, L45 of M4; M5 since its closure, L25 of M5). M6 is reported without blocking
      # (L28 of M6 makes it blocking at the closure). A requirement moved to a later milestone
      # by the maintainer leaves the matrix of the milestone it left, in 01 and 03: it is never
      # hidden here.
      - name: Build the traceability matrix of every delivered milestone
        run: |
          set +e
          status=0
          for ms in M0 M1a M1b M2 M3 M4 M5; do
            python3 tools/traceability.py --milestone "$ms" --output "$RUNNER_TEMP/$ms.md" 2> "$RUNNER_TEMP/errors-$ms.txt"
            code=$?
            [ $code -eq 0 ] || status=1
            {
              cat "$RUNNER_TEMP/$ms.md"
              echo
              echo "## Erreurs et avertissements ($ms, exit $code)"
              echo '```'
              cat "$RUNNER_TEMP/errors-$ms.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
      - name: Report the traceability matrix of M6 (not blocking until its closure, L28)
        if: always()
        run: |
          set +e
          python3 tools/traceability.py --milestone M6 --output "$RUNNER_TEMP/M6.md" 2> "$RUNNER_TEMP/errors-M6.txt"
          code=$?
          [ $code -eq 0 ] || echo "::warning::traceability M6 (report only): exit $code"
          {
            cat "$RUNNER_TEMP/M6.md"
            echo
            echo "## Erreurs et avertissements (M6, exit $code)"
            echo '```'
            cat "$RUNNER_TEMP/errors-M6.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: traceability
          path: ${{ runner.temp }}/M*.md
          if-no-files-found: ignore
          retention-days: 14

  ci-success:
    if: always()
    needs: [changes, lint, denylist, dco, conventional-title, traceability, backend-unit, backend-integration, backend-suites, backend-bench, coverage, fixtures, frontend, openapi, e2e-front, e2e-reader, frontend-e2e, reader-bench, client-drift, image-pr, image-main, image-publish, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Verify required jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          DENYLIST: ${{ needs.denylist.result }}
          DCO: ${{ needs.dco.result }}
          TITLE: ${{ needs.conventional-title.result }}
          TRACEABILITY: ${{ needs.traceability.result }}
          IMAGE_CHANGED: ${{ needs.changes.outputs.image_build }}
          UNIT_CHANGED: ${{ needs.changes.outputs.unit }}
          INTEGRATION_CHANGED: ${{ needs.changes.outputs.integration }}
          SUITES_CHANGED: ${{ needs.changes.outputs.suites }}
          BENCH_CHANGED: ${{ needs.changes.outputs.bench }}
          FIXTURES_CHANGED: ${{ needs.changes.outputs.fixtures }}
          BACKEND_SUITES: ${{ needs.backend-suites.result }}
          BACKEND_UNIT: ${{ needs.backend-unit.result }}
          BACKEND_INTEGRATION: ${{ needs.backend-integration.result }}
          BACKEND_BENCH: ${{ needs.backend-bench.result }}
          COVERAGE: ${{ needs.coverage.result }}
          FIXTURES: ${{ needs.fixtures.result }}
          IMAGE_PR: ${{ needs.image-pr.result }}
          IMAGE_MAIN: ${{ needs.image-main.result }}
          IMAGE_PUBLISH: ${{ needs.image-publish.result }}
          SCAN: ${{ needs.scan.result }}
          EVENT: ${{ github.event_name }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND: ${{ needs.frontend.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          OPENAPI: ${{ needs.openapi.result }}
          OPENAPI_CHANGED: ${{ needs.changes.outputs.openapi }}
          E2E: ${{ needs.e2e-front.result }}
          E2E_READER: ${{ needs.e2e-reader.result }}
          E2E_CHANGED: ${{ needs.changes.outputs.e2e }}
          FRONTEND_E2E: ${{ needs.frontend-e2e.result }}
          READER_BENCH: ${{ needs.reader-bench.result }}
          CLIENT_DRIFT: ${{ needs.client-drift.result }}
        run: |
          echo "dco=${DCO} conventional-title=${TITLE} traceability=${TRACEABILITY} (image changed=${IMAGE_CHANGED})"
          echo "changes=${CHANGES} lint=${LINT} denylist=${DENYLIST} fixtures=${FIXTURES} (changed=${FIXTURES_CHANGED}) image-pr=${IMAGE_PR} image-main=${IMAGE_MAIN} image-publish=${IMAGE_PUBLISH} scan=${SCAN} (informational)"
          echo "backend-unit=${BACKEND_UNIT} (changed=${UNIT_CHANGED}) backend-integration=${BACKEND_INTEGRATION} (changed=${INTEGRATION_CHANGED}) backend-suites=${BACKEND_SUITES} (changed=${SUITES_CHANGED}) backend-bench=${BACKEND_BENCH} (changed=${BENCH_CHANGED}) coverage=${COVERAGE} (changed=${BACKEND_CHANGED}) frontend=${FRONTEND} (changed=${FRONTEND_CHANGED})"
          echo "openapi=${OPENAPI} (changed=${OPENAPI_CHANGED}) e2e-front=${E2E} (changed=${E2E_CHANGED}) reader-bench=${READER_BENCH} (report only)"
          ok=1
          for r in "$CHANGES" "$LINT" "$DENYLIST" "$TRACEABILITY"; do
            [ "$r" = "success" ] || ok=0
          done
          # A filtered job may be skipped only when its paths filter is false.
          check_filtered() {
            if [ "$1" = "skipped" ]; then
              [ "$2" != "true" ] || ok=0
            else
              [ "$1" = "success" ] || ok=0
            fi
          }
          check_filtered "$BACKEND_UNIT" "$UNIT_CHANGED"
          check_filtered "$BACKEND_INTEGRATION" "$INTEGRATION_CHANGED"
          check_filtered "$BACKEND_SUITES" "$SUITES_CHANGED"
          check_filtered "$BACKEND_BENCH" "$BENCH_CHANGED"
          check_filtered "$FIXTURES" "$FIXTURES_CHANGED"
          check_filtered "$COVERAGE" "$BACKEND_CHANGED"
          check_filtered "$FRONTEND" "$FRONTEND_CHANGED"
          check_filtered "$OPENAPI" "$OPENAPI_CHANGED"
          check_filtered "$E2E" "$E2E_CHANGED"
          check_filtered "$E2E_READER" "$E2E_CHANGED"
          check_filtered "$FRONTEND_E2E" "$E2E_CHANGED"
          check_filtered "$CLIENT_DRIFT" "$OPENAPI_CHANGED"
          # Exactly one image path per event: pull request -> image-pr, push -> image-main + image-publish.
          # dco and conventional-title only run on pull requests.
          if [ "$EVENT" = "pull_request" ]; then
            [ "$DCO" = "success" ] && [ "$TITLE" = "success" ] || ok=0
            # image-pr is skipped only when no file the image contains changed.
            check_filtered "$IMAGE_PR" "$IMAGE_CHANGED"
            [ "$IMAGE_MAIN" = "skipped" ] && [ "$IMAGE_PUBLISH" = "skipped" ] || ok=0
          else
            [ "$DCO" = "skipped" ] && [ "$TITLE" = "skipped" ] || ok=0
            [ "$IMAGE_PR" = "skipped" ] || ok=0
            [ "$IMAGE_MAIN" = "success" ] && [ "$IMAGE_PUBLISH" = "success" ] || ok=0
          fi
          if [ "$ok" != "1" ]; then
            echo "::error::a required job failed, was cancelled, or was skipped unexpectedly"
            exit 1
          fi
