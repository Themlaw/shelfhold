name: retag

# Manual recovery of the version tags of an image (e.g. release.yml timed out or failed after the
# v* tag was created). The commit is deduced from the existing git tag; the retag is idempotent.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag, vX.Y.Z"
        type: string
        required: true

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        name: Resolve the tag to its commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::expected vX.Y.Z, got ${TAG}"; exit 1; }
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  image-tags:
    needs: resolve
    permissions:
      contents: read
      packages: write
      checks: read
    uses: ./.github/workflows/image-retag.yml  # zizmor: ignore[self-repository]
    with:
      sha: ${{ needs.resolve.outputs.sha }}
      version: ${{ needs.resolve.outputs.version }}
