name: canary

# Live checks of the sources whose terms allow them (PLAN-M2 D12, ENF-LEG-003). The list of
# targets (`tools/canary_targets.toml`) is EMPTY: no live request is made today. What runs is the
# check of the configuration: the list parses, names no host of the Project Gutenberg website and
# holds no target without its written basis. NEVER required to merge: it is not in `ci-success`,
# runs on a schedule and on demand only, and a pull request cannot trigger it. A failure is read in
# the Actions tab (no issue is opened: the token has no write permission). A real target needs its
# own pull request, with the terms of the source that allow it: never a spoofed fingerprint, never
# a solver, never the website of the books project.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions: {}

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  configuration:
    name: canary targets (configuration only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true  # never blocking
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: The list of targets is valid and names no forbidden host
        working-directory: backend
        run: uv run --locked pytest tests/unit/test_gutenberg_source.py -k canary -v --no-cov
      - name: Say what will be probed
        run: |
          python3 - <<'PY'
          import tomllib
          with open("tools/canary_targets.toml", "rb") as handle:
              targets = tomllib.load(handle)["targets"]
          print(f"{len(targets)} target(s): " + ("nothing is probed live" if not targets else "see the list"))
          PY
