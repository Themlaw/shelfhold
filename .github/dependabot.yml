# Dependency updates. No auto-merge: each PR is reviewed and merged by the maintainer.
# A 7-day cooldown lets a release age before it is proposed (supply-chain, ADR-0016).
# spikes/ is deliberately absent (throwaway code).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/docker]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]  # LTS only: bumped by hand
    groups:
      docker-base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories: [/, /e2e/suwayomi]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]  # LTS only: bumped by hand
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: huey
        versions: [">=3.6"]  # ADR-0005
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: [/frontend, /e2e]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]  # deferred: svelte-check peer range stops at 6
      - dependency-name: msw
        update-types: ["version-update:semver-major"]  # deferred: msw 3 breaks vitest with the browser condition
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
