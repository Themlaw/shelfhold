# Shelfhold reference compose (= homelab example, docs/spec/04-structure-repo.md section 5).
# The image is defined here and in env.IMAGE of the workflows, nowhere else.
# Pinned on X.Y (patch releases only, never a migration): `0.2` is published with the 0.2.0 release.
# Use `edge` meanwhile (development image).
#
# Hardened by default (ENF-SEC-006). Shelfhold still starts if you run it differently
# (root, writable filesystem), but this profile is the one that is tested.
#
# Host directories must be writable by uid 1000:  mkdir -p data store && chown 1000:1000 data store && chmod 750 data store

x-shelfhold: &shelfhold
  image: ghcr.io/themlaw/shelfhold:0.2
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  ulimits:
    core: 0            # no core dump of decrypted data
  environment: &shelfhold-env
    TZ: Etc/UTC
  volumes:
    - ./data:/data     # database, config, thumbnails (local disk, SSD advised, not NFS)
    - ./store:/store   # kept copies only; a separate volume from /data (ENF-OPS-012)
    # Switchover from an existing automation (adoption, repatriation; EF-EXP-060): uncomment the
    # next line to mount, read-only, the folder Suwayomi downloads to, and declare it in the path
    # map of the target with mode = adopt_ro. Shelfhold reads it and never writes there (the :ro is
    # the second lock). Remove the line once the switchover is done.
    # - /path/to/suwayomi/downloads:/upstream/suwayomi:ro

services:
  # Applies migrations, then exits. Shelfhold only starts after it succeeded.
  shelfhold-migrate:
    <<: *shelfhold
    command: ["shelfhold", "migrate"]
    restart: "no"
    pids_limit: 64
    mem_limit: 512m
    tmpfs: ["/tmp:size=64m"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  shelfhold:
    <<: *shelfhold
    container_name: shelfhold
    depends_on:
      shelfhold-migrate:
        condition: service_completed_successfully
    init: true
    tmpfs: ["/tmp:size=256m"]
    stop_grace_period: 60s
    mem_limit: 768m
    pids_limit: 256
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/shelfhold-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped
