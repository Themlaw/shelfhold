# Shelfhold reference compose, hardened (= homelab example, docs/spec/04-structure-repo.md section 5).
# A shorter, unhardened variant for a first try: compose.simple.yaml.
# The image is defined here and in env.IMAGE of the workflows, nowhere else.
# Pinned on X.Y (patch releases only, never a migration): `1.0` follows the 1.0.x releases.
# `edge` is the development image: do not use it for a library you care about.
# Updating from 0.2: the 1.0 migrations are not reversible by themselves (docs/admin/retour-arriere.md).
#
# Hardened by default (ENF-SEC-006). Shelfhold still starts if you run it differently
# (root, writable filesystem), but this profile is the one that is tested.
#
# Host directories must be writable by uid 1000:  mkdir -p data store && chown 1000:1000 data store && chmod 750 data store

services:
  shelfhold:
    # Two names for the same signed image (ENF-GOV-004): GHCR, live here, and the second registry,
    # published by the CI when the maintainer set it up (digest and signature identical). If GitHub
    # removes the image, swap the next line for the second name, then `docker compose pull`:
    #   image: codeberg.org/<owner>/shelfhold:1.0
    # <owner> is the account of the second registry; verify either name before using it
    # (docs/admin/verifier-les-images.md). The continuity steps are in GOVERNANCE.md.
    image: ghcr.io/themlaw/shelfhold:1.1
    container_name: shelfhold
    # Migrations first (backup named by revision, ENF-OPS-002), then the server; a failed migration
    # exits non-zero and serves nothing. Written out because the 1.0 images predate the image's own
    # `serve --migrate` default (from 1.1 on, this line can go).
    command: ["sh", "-c", "shelfhold migrate && exec shelfhold serve"]
    # To migrate separately before an update: docker compose run --rm shelfhold shelfhold migrate
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0            # no core dump of decrypted data
    init: true
    tmpfs: ["/tmp:size=256m"]
    stop_grace_period: 60s
    mem_limit: 768m
    pids_limit: 256
    ports:
      - "127.0.0.1:8080:8080"
    # Settings: copy .env.example to .env and edit it (optional; Compose 2.24 or later).
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Etc/UTC}
      # First start (EF-UX-001): to create the first administrator in the browser wizard, set a setup
      # secret of at least 24 characters, generated on your machine (`openssl rand -hex 24`), then
      # uncomment the next line and paste it. You type it once in the "Your account" screen; it opens
      # nothing once an administrator exists. Unset: the screen stays closed and
      # `docker compose exec shelfhold shelfhold admin create` is the way (docs/configuration.md).
      # SHELFHOLD_SETUP_TOKEN: "<the-24-or-more-characters-you-generated>"
      # SHELFHOLD_IMPORT_DIR: /import   # with the ./import volume below; unset = import off
      # Behind an HTTPS reverse proxy (required for e-reader tokens): the public address, so that
      # cookies get `Secure` and the `__Host-` prefix (docs/admin/durcir.md).
      # SHELFHOLD_PUBLIC_URL: "https://shelfhold.example.org"
      # Hardened authentication profile: short admin sessions, password asked again for every
      # reserved action, API keys expire within 90 days (docs/admin/durcir.md).
      # SHELFHOLD_AUTH_HARDENED: "true"
      # Off by default, nothing leaves the instance until you set them (ENF-PRIV-001, ENF-GOV-004):
      # SHELFHOLD_UPDATE_CHECK_URL: "https://<mirror>/latest.json"   # tells you a version is out
      # SHELFHOLD_PLUGIN_INDEX_URL: "https://<mirror>/index.json"    # where the plugin index is read
    volumes:
      - ./data:/data     # database, config, thumbnails (local disk, SSD advised, not NFS)
      - ./store:/store   # kept copies only; a separate volume from /data (ENF-OPS-012).
                         # Recommended for every untrusted source (web EPUBs, import folder): without it
                         # the original of an EPUB is kept nowhere, only its neutralised derivative.
      # Import folder (docs/admin/dossier-import.md): your own CBZ, EPUB and PDF files. A folder of its
      # own, never inside or above /library, /store or /data; Shelfhold removes what it has stored.
      # Uncomment both lines, then run `shelfhold import scan --dry-run` to see what is ready.
      # - ./import:/import
      # Switchover from an existing automation (adoption, repatriation; EF-EXP-060): uncomment the
      # next line to mount, read-only, the folder Suwayomi downloads to, and declare it in the path
      # map of the target with mode = adopt_ro. Shelfhold reads it and never writes there (the :ro is
      # the second lock). Remove the line once the switchover is done.
      # - /path/to/suwayomi/downloads:/upstream/suwayomi:ro
    # >>> plugin-runner core
    # volumes:
    #   - ./plugin-rpc:/plugin-rpc
    # <<< plugin-runner
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/shelfhold-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m  # migration budget (ENF-OPS-002): the server answers once it is applied
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped

  # Isolated third-party plugins (D-P1, docs/admin/plugins-isoles.md): optional, off by default.
  # Steps, in this order (the companion refuses to start when it can see /data or has a network):
  #   1. mkdir -p plugin-rpc data/plugins && sudo chown 1001:1001 plugin-rpc && sudo chmod 755 plugin-rpc data/plugins
  #   2. uncomment the `plugin-runner` service below (same indentation as `shelfhold:`);
  #   3. add the `./plugin-rpc:/plugin-rpc` line to the `volumes:` of `shelfhold`;
  #   4. docker compose up -d, then docker compose logs plugin-runner (it prints that its sandbox is as required).
  # A data folder or a named volume made by an earlier version keeps the modes it had: the companion
  # (same image, another uid) must not read /data and /store, so run once, as the core:
  #   docker compose exec shelfhold chmod 700 /data /store
  # The companion also needs a kernel with Landlock (5.13 or later; `cat /sys/kernel/security/lsm`
  # lists it) and refuses to start without it, whatever the rest.
  # >>> plugin-runner service
  # plugin-runner:
  #   image: ghcr.io/themlaw/shelfhold:1.1   # the same image as the core: always the same tag
  #   container_name: shelfhold-plugin-runner
  #   command: ["shelfhold", "plugin-runner"]
  #   user: "1001:1001"                      # another uid than the core's (1000)
  #   network_mode: none                     # no network, not even a private one
  #   read_only: true
  #   cap_drop: [ALL]
  #   security_opt: ["no-new-privileges:true"]
  #   ulimits:
  #     core: 0
  #   init: true
  #   mem_limit: 512m
  #   pids_limit: 128
  #   tmpfs: ["/tmp:size=64m"]               # each plugin's scratch folder: the one place it may write
  #   volumes:
  #     - ./data/plugins:/plugins:ro         # the wheels the core installs: read-only here
  #     - ./plugin-rpc:/plugin-rpc           # the socket the core connects to: nothing else
  #   healthcheck:
  #     test: ["CMD", "shelfhold", "plugin-runner", "--healthcheck"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 20s
  #   restart: unless-stopped
  # <<< plugin-runner
