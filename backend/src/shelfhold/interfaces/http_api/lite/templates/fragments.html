<!--@header-->

<form method="get" action="$search_action"><label for="q">$search_label</label><input id="q" name="q" type="search" maxlength="200" value="$query"><button type="submit">$search_button</button></form>
<form method="post" action="$sign_out_action"><input type="hidden" name="csrf" value="$csrf"><button type="submit">$sign_out_label</button></form></header>

<li><a href="$href">$html_image$label</a></li>
<!--@thumb-->

<!--@alert-->

<!--@heading-->
<h2>$text</h2>

<p class="note">$text</p>

<p><a class="button" href="$href">$label</a></p>
