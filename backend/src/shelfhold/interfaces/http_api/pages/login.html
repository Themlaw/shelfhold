<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>$title</title>
<link rel="stylesheet" href="$style">
<script src="$appearance"></script>
</head>
<body>
<main class="sheet">
<h1>$title</h1>
<p class="lede">$lede</p>
<div id="message" class="alert alert--danger" role="alert" $message_state><p class="alert__title">$notice</p><p class="alert__body"></p></div>
<form id="login" method="post" data-endpoint="$endpoint" data-error="$error">
<div class="field"><label for="username">$username</label>
<input id="username" class="input" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="128" required autofocus></div>
<div class="field"><label for="password">$password</label>
<input id="password" class="input" name="password" type="password" autocomplete="current-password" maxlength="$max_password" required></div>
<label class="choice"><input class="check" name="remember" type="checkbox" checked aria-describedby="remember-hint"><span class="choice__text">$remember<span id="remember-hint" class="hint">$remember_hint</span></span></label>
<button class="btn btn--primary btn--lg btn--block" type="submit">$submit</button>
</form>
$alternatives<p class="help">$help</p>
<footer class="colophon">
<p><a href="$lite_href">$lite</a> · <a href="$source_url" rel="noopener noreferrer">$source</a></p>
</footer>
</main>
<script src="$login_script"></script>
$passkey_script
</body>
</html>
