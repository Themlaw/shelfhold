<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>$title</title>
<link rel="stylesheet" href="$style">
<script src="$appearance"></script>
</head>
<body>
<main class="sheet sheet--confirm" id="confirm" data-endpoint="$endpoint" data-csrf-cookie="$csrf_cookie" data-done="$done" data-declined="$declined" data-error="$error">
<h1>$title</h1>
<p class="lede">$question</p>
<dl class="facts">
<div><dt>$identity_label</dt><dd>$identity</dd></div>
<div><dt>$provider_label</dt><dd>$provider</dd></div>
<div><dt>$account_label</dt><dd>$account</dd></div>
</dl>
<div id="message" class="alert alert--danger" role="alert" hidden><p class="alert__title"></p><p class="alert__body"></p></div>
<div class="actions">
<button type="button" id="yes" class="btn btn--primary btn--lg">$yes</button>
<button type="button" id="no" class="btn btn--secondary btn--lg">$no</button>
</div>
</main>
<script src="$script"></script>
</body>
</html>
