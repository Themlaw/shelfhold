  [errors."import.own_export"]
    title = "This file is an export from Shelfhold itself: it is noted as a replica, not stored again."
    action = "The file remains in the import folder. Remove it yourself if you don't want it anymore."
    cause = "The fingerprint of the file is that of an export Shelfhold itself wrote: storing it would create a duplicate of its own copy."

  [errors."import.original_not_kept"]
    title = "File stored in its neutralized form only: the original is not kept anywhere."
    action = "The file remains in the import folder, as it would otherwise be lost. Configure /store to keep the originals."
    cause = "The file was only kept in its neutralized form: putting it away would cause the only copy of the original to disappear."

  [errors."import.tree_unreadable"]
    title = "The tree to import is not readable."
    action = "Give the absolute path of an actual folder (not a link), distinct from /library, /store and /data."
    cause = "The given path is not a readable folder: not found, link, or location reserved for Shelfhold."

  [errors."import.tree_no_series"]
    title = "No Suwayomi link matches this series folder."
    action = "The tree is not modified. First follow the series (“shelfhold follow”), then restart the import."
    cause = "The series folder does not correspond to any series tracked in the connected service."

  [errors."import.tree_ambiguous_series"]
    title = "Several Suwayomi connections carry this series title."
    action = "The tree is not modified. Nothing is guessed: remove the duplicate binding, then rerun the import."
    cause = "Several followed series bear this title: Shelfhold does not choose for you where to store the chapters."

  [errors."import.tree_unnumbered"]
    title = "The number of this chapter is not readable in its name."
    action = "The tree is not modified. Rename the chapter to “Chapter N” or download it again."
    cause = "The folder or file name does not contain a chapter number that Shelfhold can read."

  [errors."import.tree_duplicate"]
    title = "This chapter is already put away."
    action = "Nothing needs to be done: the existing copy is kept and the tree is not modified."
    cause = "A chapter with the same identity and number is already in the library."

  [errors."import.tree_wrong_source"]
    title = "The source folder for this chapter is not the link for this series."
    action = "The tree is not modified. A series of the same title under another source is not the same series: follow it from that source."
    cause = "The chapter comes from a different source folder than the one linked to this series: importing it would mix it with another series of the same title."

  [errors."import.tree_needs_rating"]
    title = "To be classified: the age suggested by the file or source exceeds the classification of the Work."
    action = "Nothing is stored and the tree is not modified. Classify the Work (\"shelfhold rate\"), then restart the import."
    cause = "The Work is classified for an age lower than that which the file or source announces."

  [errors."content.untrusted_pdf"]
    title = "PDF stored as is, not exported: its origin is not declared."
    action = "A PDF can hold code that the reader of a destination would run. Declare it as a purchase at import to have it exported."
    cause = "A PDF can embed code that the destination reader would execute: without a declared provenance, Shelfhold does not export it."

  [errors."import.not_configured"]
    title = "No import folder is configured."
    action = "Set SHELFHOLD_IMPORT_DIR (a folder separate from /library, /store and /data), then relaunch."
    cause = "The Import Folder setting is missing or points to a location reserved for Shelfhold."

  [errors.session_not_found]
    title = "This session does not exist or is already closed."
    action = "Refresh the session list."
    cause = "The session has already been closed, or the displayed list is older than the actual state."

