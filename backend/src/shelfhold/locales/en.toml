[errors]

  [errors."backup.failed"]
    title = "The backup failed."
    action = "Verify that the backup destination is present and writable, then try the backup again."
    cause = "The backup destination is missing, full, or refuses writing."

  [errors."backup.stale"]
    title = "The last backup is too old."
    action = "Check the backup destination and schedule, then initiate a backup."
    cause = "No backups have succeeded for longer than the expected frequency."

  [errors.bad_request]
    title = "Incorrect query."
    action = "Correct the query and try again."
    cause = "The query is malformed or incomplete."

  [errors."content.untrusted_entry"]
    title = "A received file contains an unauthorized entry: it has not been stored."
    action = "The chapter is discarded and will not be requested again; only images (JPEG, PNG, WebP, GIF, AVIF, JPEG XL) and ComicInfo.xml are allowed. Remove it from the source or wait for vector support."
    cause = "The archive received contains a file which is neither an accepted image nor a ComicInfo.xml: Shelfhold does not store anything that it cannot read without risk."

  [errors.credential_not_allowed]
    title = "This action is reserved for one session."
    action = "Perform the action from the interface after connection; API keys and device tokens are denied."
    cause = "This action is reserved for a session opened by a person, not for a key or a token."

  [errors.csrf_failed]
    title = "The request was not recognized as coming from this page."
    action = "Reload the page then start again; a script uses an API key rather than a session."
    cause = "The request does not carry proof of origin of the page: expired session, page opened from another site or missing token."

  [errors."auth.passkey_registered"]
    title = "A passkey has just been registered on an account."
    action = "Check in `shelfhold status` that it is expected (account, name), then acknowledge with `shelfhold admin acknowledge-passkeys --through <reference>` from the host. An unknown passkey is revoked in the account passkeys page, or by `shelfhold admin reset-password`."
    cause = "A passkey was added to an account and nobody acknowledged it yet: that is the signal of a possible takeover."

  [errors."disk.low"]
    title = "Disk space almost exhausted."
    action = "Free up space (empty the trash, delete unnecessary copies); the lines resume by themselves."
    cause = "The volume carrying the data falls below the expected free space threshold."

  [errors."export.destination_occupied"]
    title = "A file already occupies the intended location."
    action = "Nothing is overwritten: move or reattach this file, then recalculate the preview."
    cause = "A file that is not Shelfhold's is already in the export location: Shelfhold never overwrites a file that it did not write."

  [errors."export.no_remote_library"]
    title = "No remote libraries are linked to this destination."
    action = "Link the destination to a server library, then recalculate the preview."
    cause = "The Kavita destination is not linked to any library on the server: Shelfhold does not know where to store the export."

  [errors."export.series_name_collision"]
    title = "Two series would have the same name in this library."
    action = "Set a separate exported series name for one of the two Editions, then recalculate the preview."
    cause = "The names of two series give the same name when normalized for Kavita (capitals, accents, punctuation)."

  [errors."pairing.switchover_unconfirmed"]
    title = "This shelf is powered directly by Suwayomi: tracking awaits the switchover procedure."
    action = "Follow docs/admin/migration-from-scripts.md (adopt, pair, repatriate, remove direct mounts, disable scripts), then confirm each step."
    cause = "The connected service still writes directly to the folders of this shelf: as long as the switch is not confirmed, two programs would share the files."

  [errors."pairing.switchover_stale"]
    title = "The switchover report has changed since you read it."
    action = "Reread the detection report, then confirm the steps with its new fingerprint."
    cause = "The detection report has been recalculated since your reading: the given fingerprint no longer corresponds to the current state."

  [errors."pairing.not_writable"]
    title = "Shelfhold cannot write to this series' folder: the pairing is refused."
    action = "Apply the displayed fix command (ACL, group_add, or umask), then retry the pairing."
    cause = "The account that runs Shelfhold does not have the right to write to the series folder."

  [errors."pairing.already_paired"]
    title = "This series is already paired with a follow-up Suwayomi."
    action = "A second pairing would create a duplicate: detach the first one first if you want to replace it."
    cause = "A monitoring of the connected service is already linked to this series; adding a second one would cause each chapter to download twice."

  [errors."root.blocked"]
    title = "A physical root is absent or does not carry the expected sentinel: nothing is written there."
    action = "Verify that the volume is mounted, then run \"shelfhold status\" to see the correct root and output."
    cause = "The mounted disk is not the one that Shelfhold recorded: volume not mounted, incorrectly mounted or replaced, sentinel file missing."

  [errors."root.unauthenticated"]
    title = "The sentinel of this root claims an identity that the keychain does not confirm: nothing is taken from the file."
    action = "Import the shelfhold secrets import, then rerun the command; the root has not been modified."
    cause = "The root sentinel file designates an identity that the keyring for that instance does not recognize, most often after a restore without the keyring."

  [errors."ops.audit_running"]
    title = "An audit of Kavita accounts is already underway: nothing has been restarted."
    action = "Wait for the current audit to complete, then reread the result with `GET /api/v1/audit/kavita-accounts`."
    cause = "Only one execution at a time: Kavita is read, not requested in parallel."

  [errors."root.busy"]
    title = "An export or a cycle uses this root: the command has not changed anything."
    action = "Reissue the command when the current export or cycle is finished."
    cause = "An export or a work cycle has this root: two writes at the same time could risk corrupting it."

  [errors."rebaseline.refused"]
    title = "The update of file identities is refused: nothing has been modified."
    action = "If a fingerprint differs, a file has been modified and not moved: check it; If the mirror is missing, restore the .shelfhold/manifest folder from the original copy."
    cause = "The fingerprint of a file no longer corresponds to that which is recorded, or the mirror of origin which allows it to be recognized is missing."

  [errors."purge.collateral"]
    title = "A file of this Unit also carries other Units: deleting it would erase them."
    action = "Delete all Units from the file together, or keep it."
    cause = "The same file serves several Units: deleting it for one would delete it for the others."

  [errors."purge.busy"]
    title = "A file or Work to be deleted is held by another work: nothing has been deleted."
    action = "Reissue the command in a moment, when the current work (copy, import) is finished."
    cause = "A copy, import or other work holds the file or Work to be erased; Shelfhold does not erase a work in progress underfoot."

  [errors."purge.wal_busy"]
    title = "The deletion is done, but the server still keeps the database log: it can keep a title until its next dump."
    action = "Run “shelfhold purge --checkpoint” when the server is inactive (or stop it): it only flushes the log again. It is also every night and at startup."
    cause = "The server keeps the database log open: a deleted title can remain readable until the next emptying."

  [errors."pairing.batch_stale"]
    title = "The confirmed batch of matches is no longer the one that was proposed."
    action = "Run \"shelfhold adopt --pair-auto\" again, reread the report, then confirm with the new fingerprint."
    cause = "The series or their followings changed between the proposal and your confirmation: the fingerprint of the batch is no longer the right one."

  [errors."repatriate.dry_run_required"]
    title = "Repatriation requires a prior dry run."
    action = "Run \"shelfhold adopt --repatriate --dry-run\", reread the report, then confirm with its fingerprint."
    cause = "Repatriation moves files: Shelfhold first requires a dry run, the report of which you have read."

  [errors."repatriate.stale"]
    title = "The files have changed since the repatriation dry-run."
    action = "Run the dry-run again, re-read the report, then confirm with the new print. Nothing was copied."
    cause = "Files have been added, removed or modified since the dry run: the confirmed fingerprint describes a state that no longer exists."

  [errors."repatriate.blocked"]
    title = "An adopted file cannot be repatriated as is: it is missing from the source, has changed since adoption, or another file already occupies its place."
    action = "The report lists each affected file. No files have been copied, moved or overwritten; correct, then restart the dry-run."
    cause = "At least one adopted file has disappeared from the source, has changed since its adoption or has already found its place taken."

  [errors."repatriate.no_space"]
    title = "There is not enough free space to repatriate the files."
    action = "Free up space under /library (the dry-run gives the required space), then run the dry-run again."
    cause = "The destination volume does not have enough free space to accommodate all files."

  [errors."export.source_missing"]
    title = "The received archive of this chapter could not be found."
    action = "Recalculate the preview; If the file is missing, try downloading the chapter again."
    cause = "The chapter file is no longer where Shelfhold had stored it: deleted by hand or volume replaced."

  [errors."export.transport_unsupported"]
    title = "This destination type is not yet supported."
    action = "Use a tree destination; other transports arrive later."
    cause = "This version of Shelfhold only writes to a folder tree; other delivery methods are not yet written."

  [errors."export.watermarked_external_egress"]
    title = "A watermarked file never leaves for a destination outside the home."
    action = "Keep this file on a household destination, or remove it from the shelf linked to this destination."
    cause = "The file has a tattoo that identifies the household: sending it outside the household would cause it to be traced back to you."

  [errors."fetch.dns_failed"]
    title = "The domain name could not be resolved."
    action = "Check the entered address and the DNS of the server."
    cause = "The name server has no response for this name: typo, server DNS down, or non-existent domain."

  [errors."fetch.error"]
    title = "The request to an external service failed."
    action = "Try again later; If the problem persists, check the logs."
    cause = "The remote service responded with an error or the connection was cut midway."

  [errors."fetch.invalid_url"]
    title = "The address is invalid."
    action = "Correct the address: http or https scheme, without identifiers in the URL."
    cause = "The address is not a full http or https web address, or it contains identifiers."

  [errors."fetch.robots_disallowed"]
    title = "The site asks robots not to read this page."
    action = "Shelfhold respects the robots.txt file of the source; open the page from a browser."
    cause = "The site's robots.txt file prohibits robots from reading this page, and Shelfhold respects it."

