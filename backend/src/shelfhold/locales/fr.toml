# Catalogue d'erreurs (EF-UX-003) : un titre et une action par code ; le code est la clé.

[errors."backup.failed"]
title = "La sauvegarde a échoué."
action = "Vérifiez que la destination de sauvegarde est présente et inscriptible, puis relancez la sauvegarde."
cause = "La destination de sauvegarde est absente, pleine ou refuse l'écriture."

[errors."backup.stale"]
title = "La dernière sauvegarde est trop ancienne."
action = "Vérifiez la destination de sauvegarde et la planification, puis lancez une sauvegarde."
cause = "Aucune sauvegarde n'a réussi depuis plus longtemps que la fréquence prévue."

[errors."bad_request"]
title = "Requête incorrecte."
action = "Corrigez la requête puis recommencez."
cause = "La requête est mal formée ou incomplète."

[errors."content.untrusted_entry"]
title = "Un fichier reçu contient une entrée non autorisée : il n'a pas été rangé."
action = "Le chapitre est écarté et ne sera pas redemandé ; seules les images (JPEG, PNG, WebP, GIF, AVIF, JPEG XL) et ComicInfo.xml sont admises. Retirez-le de la source ou attendez la prise en charge des images vectorielles."
cause = "L'archive reçue contient un fichier qui n'est ni une image admise ni un ComicInfo.xml : Shelfhold ne range rien qu'il ne sait pas lire sans risque."

[errors."credential_not_allowed"]
title = "Cette action est réservée à une session."
action = "Effectuez l'action depuis l'interface après connexion ; les clés d'API et les jetons d'appareil sont refusés."
cause = "Cette action est réservée à une session ouverte par une personne, pas à une clé ni à un jeton."

[errors."csrf_failed"]
title = "La requête n'a pas été reconnue comme venant de cette page."
action = "Rechargez la page puis recommencez ; un script utilise une clé d'API plutôt qu'une session."
cause = "La requête ne porte pas la preuve de provenance de la page : session expirée, page ouverte depuis un autre site ou jeton absent."

[errors."auth.passkey_registered"]
title = "Une clé d'accès (passkey) vient d'être enregistrée sur un compte."
action = "Vérifiez dans `shelfhold status` qu'elle est attendue (compte, nom), puis acquittez avec `shelfhold admin acknowledge-passkeys --through <référence>` depuis l'hôte. Une clé d'accès inconnue se révoque dans la page des clés d'accès du compte, ou par `shelfhold admin reset-password`."
cause = "Une clé d'accès a été ajoutée à un compte et personne ne l'a encore acquittée : c'est le signal qu'une connexion de plus est possible."

[errors."disk.low"]
title = "Espace disque presque épuisé."
action = "Libérez de la place (vider la corbeille, supprimer des copies inutiles) ; les files reprennent d'elles-mêmes."
cause = "Le volume qui porte les données passe sous le seuil d'espace libre prévu."

[errors."export.destination_occupied"]
title = "Un fichier occupe déjà l'emplacement prévu."
action = "Rien n'est écrasé : déplacez ou rattachez ce fichier, puis recalculez l'aperçu."
cause = "Un fichier qui n'est pas celui de Shelfhold se trouve déjà à l'emplacement de l'export : Shelfhold n'écrase jamais un fichier qu'il n'a pas écrit."

[errors."export.no_remote_library"]
title = "Aucune bibliothèque distante n'est liée à cette destination."
action = "Liez la destination à une bibliothèque du serveur, puis recalculez l'aperçu."
cause = "La destination Kavita n'est liée à aucune bibliothèque du serveur : Shelfhold ne sait pas où ranger l'export."

[errors."export.series_name_collision"]
title = "Deux séries porteraient le même nom dans cette bibliothèque."
action = "Définissez un nom de série exporté distinct pour l'une des deux Éditions, puis recalculez l'aperçu."
cause = "Les noms de deux séries donnent le même nom une fois normalisés pour Kavita (majuscules, accents, ponctuation)."

[errors."pairing.switchover_unconfirmed"]
title = "Cette étagère est alimentée directement par Suwayomi : le suivi attend la procédure de bascule."
action = "Suivez docs/admin/migration-depuis-scripts.md (adopter, apparier, rapatrier, retirer les montages directs, désactiver les scripts), puis confirmez chaque étape."
cause = "Le service connecté écrit encore directement dans les dossiers de cette étagère : tant que la bascule n'est pas confirmée, deux programmes se partageraient les fichiers."

[errors."pairing.switchover_stale"]
title = "Le rapport de bascule a changé depuis que vous l'avez lu."
action = "Relisez le rapport de détection, puis confirmez les étapes avec sa nouvelle empreinte."
cause = "Le rapport de détection a été recalculé depuis votre lecture : l'empreinte donnée ne correspond plus à l'état actuel."

[errors."pairing.not_writable"]
title = "Shelfhold ne peut pas écrire dans le dossier de cette série : l'appariement est refusé."
action = "Appliquez la commande de correction affichée (ACL, group_add ou umask), puis relancez l'appariement."
cause = "Le compte qui fait tourner Shelfhold n'a pas le droit d'écrire dans le dossier de la série."

[errors."pairing.already_paired"]
title = "Cette série est déjà appariée à un suivi Suwayomi."
action = "Un second appariement créerait un doublon : détachez d'abord le premier si vous voulez le remplacer."
cause = "Un suivi du service connecté est déjà lié à cette série ; en ajouter un second ferait télécharger chaque chapitre deux fois."

[errors."root.blocked"]
title = "Une racine physique est absente ou ne porte pas la sentinelle attendue : rien n'y est écrit."
action = "Vérifiez que le volume est monté, puis lancez « shelfhold status » pour voir la racine et la sortie qui convient."
cause = "Le disque monté n'est pas celui que Shelfhold a enregistré : volume non monté, mal monté ou remplacé, fichier sentinelle absent."

[errors."root.unauthenticated"]
title = "La sentinelle de cette racine revendique une identité que le trousseau ne confirme pas : rien n'est repris du fichier."
action = "Importez le trousseau (« shelfhold secrets import »), puis relancez la commande ; la racine n'a pas été modifiée."
cause = "Le fichier sentinelle de la racine désigne une identité que le trousseau de clés de cette instance ne reconnaît pas, le plus souvent après une restauration sans le trousseau."

[errors."root.busy"]
title = "Un export ou un cycle utilise cette racine : la commande n'a rien changé."
action = "Relancez la commande quand l'export ou le cycle en cours est terminé."
cause = "Un export ou un cycle de travail tient cette racine : deux écritures en même temps risqueraient de la corrompre."

[errors."rebaseline.refused"]
title = "La remise à jour des identités de fichiers est refusée : rien n'a été modifié."
action = "Si une empreinte diffère, un fichier a été modifié et non déplacé : vérifiez-le ; si le miroir manque, restaurez le dossier .shelfhold/manifest depuis la copie d'origine."
cause = "L'empreinte d'un fichier ne correspond plus à celle qui est enregistrée, ou le miroir de provenance qui permet de le reconnaître manque."

[errors."purge.collateral"]
title = "Un fichier de cette Unité porte aussi d'autres Unités : l'effacer les effacerait."
action = "Effacez toutes les Unités du fichier ensemble, ou gardez-le."
cause = "Un même fichier sert plusieurs Unités : l'effacer pour l'une l'effacerait pour les autres."

[errors."purge.busy"]
title = "Un fichier ou une Œuvre à effacer est tenu par un autre travail : rien n'a été effacé."
action = "Relancez la commande dans un instant, quand le travail en cours (copie, import) sera fini."
cause = "Une copie, un import ou un autre travail tient le fichier ou l'Œuvre à effacer ; Shelfhold n'efface pas sous les pieds d'un travail en cours."

[errors."purge.wal_busy"]
title = "L'effacement est fait, mais le serveur tient encore le journal de la base : il peut garder un titre jusqu'à son prochain vidage."
action = "Lancez « shelfhold purge --checkpoint » quand le serveur est inactif (ou arrêtez-le) : il ne refait que le vidage du journal. Il l'est aussi chaque nuit et au démarrage."
cause = "Le serveur garde le journal de la base ouvert : un titre effacé peut y rester lisible jusqu'au prochain vidage."

[errors."pairing.batch_stale"]
title = "Le lot d'appariements confirmé n'est plus celui qui a été proposé."
action = "Relancez « shelfhold adopt --pair-auto », relisez le rapport, puis confirmez avec la nouvelle empreinte."
cause = "Les séries ou leurs suivis ont changé entre la proposition et votre confirmation : l'empreinte du lot n'est plus la bonne."

[errors."repatriate.dry_run_required"]
title = "Le rapatriement demande un dry-run préalable."
action = "Lancez « shelfhold adopt --repatriate --dry-run », relisez le rapport, puis confirmez avec son empreinte."
cause = "Le rapatriement déplace des fichiers : Shelfhold exige d'abord un essai à blanc dont vous avez lu le rapport."

[errors."repatriate.stale"]
title = "Les fichiers ont changé depuis le dry-run du rapatriement."
action = "Relancez le dry-run, relisez le rapport, puis confirmez avec la nouvelle empreinte. Rien n'a été copié."
cause = "Des fichiers ont été ajoutés, retirés ou modifiés depuis l'essai à blanc : l'empreinte confirmée décrit un état qui n'existe plus."

[errors."repatriate.blocked"]
title = "Un fichier adopté ne peut pas être rapatrié tel quel : il manque à la source, a changé depuis l'adoption, ou un autre fichier occupe déjà sa place."
action = "Le rapport liste chaque fichier concerné. Aucun fichier n'a été copié, déplacé ni écrasé ; corrigez, puis relancez le dry-run."
cause = "Au moins un fichier adopté a disparu de la source, a changé depuis son adoption ou trouve sa place déjà prise."

[errors."repatriate.no_space"]
title = "Il n'y a pas assez de place libre pour rapatrier les fichiers."
action = "Libérez de la place sous /library (le dry-run donne l'espace requis), puis relancez le dry-run."
cause = "Le volume de destination n'a pas assez d'espace libre pour recevoir tous les fichiers."

[errors."export.source_missing"]
title = "L'archive reçue de ce chapitre est introuvable."
action = "Recalculez l'aperçu ; si le fichier a disparu, relancez le téléchargement du chapitre."
cause = "Le fichier du chapitre n'est plus à l'endroit où Shelfhold l'avait rangé : supprimé à la main ou volume remplacé."

[errors."export.transport_unsupported"]
title = "Ce type de destination n'est pas encore pris en charge."
action = "Utilisez une destination en arborescence ; les autres transports arrivent plus tard."
cause = "Cette version de Shelfhold n'écrit que dans une arborescence de dossiers ; les autres modes de livraison ne sont pas encore écrits."

[errors."export.watermarked_external_egress"]
title = "Un fichier tatoué ne part jamais vers une destination hors du foyer."
action = "Gardez ce fichier sur une destination du foyer, ou retirez-le de l'étagère liée à cette destination."
cause = "Le fichier porte un tatouage qui identifie le foyer : l'envoyer hors du foyer le ferait remonter jusqu'à vous."

[errors."fetch.dns_failed"]
title = "Le nom de domaine n'a pas pu être résolu."
action = "Vérifiez l'adresse saisie et le DNS du serveur."
cause = "Le serveur de noms n'a pas de réponse pour ce nom : faute de frappe, DNS du serveur en panne ou domaine inexistant."

[errors."fetch.error"]
title = "La requête vers un service externe a échoué."
action = "Réessayez plus tard ; si le problème persiste, consultez les journaux."
cause = "Le service distant a répondu par une erreur ou la connexion a été coupée en cours de route."

[errors."fetch.invalid_url"]
title = "L'adresse n'est pas valide."
action = "Corrigez l'adresse : schéma http ou https, sans identifiants dans l'URL."
cause = "L'adresse n'est pas une adresse web complète en http ou https, ou elle contient des identifiants."

[errors."fetch.robots_disallowed"]
title = "Le site demande aux robots de ne pas lire cette page."
action = "Shelfhold respecte le fichier robots.txt de la source ; ouvrez la page depuis un navigateur."
cause = "Le fichier robots.txt du site interdit aux robots de lire cette page, et Shelfhold le respecte."

[errors."fetch.robots_unavailable"]
title = "Le fichier robots.txt du site ne peut pas être lu pour le moment."
action = "Rien n'est demandé au site tant qu'il n'est pas lisible ; l'opération sera reprise plus tard."
cause = "Le site n'a pas répondu clairement à la demande de son fichier robots.txt : par prudence, Shelfhold ne lui demande rien."

[errors."fetch.quota_exceeded"]
title = "Le plafond du jour de ce fournisseur de métadonnées est atteint."
action = "Rien n'est envoyé d'ici demain ; les valeurs déjà reçues sont conservées."
cause = "Le fournisseur de métadonnées limite le nombre de demandes par jour et Shelfhold a atteint son plafond."

[errors."fetch.user_agent_not_identifiable"]
title = "L'agent de la requête ne dit pas qui la fait ; elle n'est pas envoyée."
action = "Configurez un contact valide (SHELFHOLD_METADATA_CONTACT) ou laissez l'agent par défaut."
cause = "Le réglage du contact, qui permet au service de joindre l'opérateur, est vide ou invalide : Shelfhold n'envoie pas de requête anonyme."

[errors."fetch.timeout"]
title = "Le service externe a mis trop de temps à répondre."
action = "Réessayez plus tard ou vérifiez que le service est en marche."
cause = "Le service distant n'a pas répondu dans le délai imparti : il est lent, surchargé ou arrêté."

[errors."fetch.too_large"]
title = "La réponse dépasse la taille autorisée."
action = "Vérifiez que l'adresse désigne bien le contenu attendu."
cause = "La réponse dépasse la taille maximale que Shelfhold accepte de lire pour ce type de requête."

[errors."fetch.too_many_redirects"]
title = "Trop de redirections."
action = "Utilisez directement l'adresse finale du service."
cause = "Le service renvoie d'adresse en adresse, sans fin ou au-delà du nombre de renvois admis."

[errors."fetch.unreachable"]
title = "Le service externe est injoignable."
action = "Vérifiez que le service est en marche et joignable depuis Shelfhold."
cause = "Aucune connexion n'a pu être établie : service arrêté, pare-feu ou réseau coupé."

[errors."fetch.unsafe_redirect"]
title = "Redirection refusée par prudence."
action = "Utilisez directement l'adresse finale du service."
cause = "Le service a renvoyé vers une adresse qui sortirait du cadre autorisé (autre schéma, adresse interne ou identifiants)."

[errors."forbidden"]
title = "Action non autorisée pour ce compte."
action = "Demandez à un administrateur de vous accorder le droit nécessaire."
cause = "Votre profil n'a pas le droit d'effectuer cette action."

[errors."idempotency_in_progress"]
title = "Une requête avec cette clé est déjà en cours."
action = "Patientez puis renvoyez la même requête avec la même clé."
cause = "La première requête portant cette clé n'a pas fini : la rejouer maintenant risquerait de faire l'action deux fois."

[errors."idempotency_key_invalid"]
title = "La clé d'idempotence est invalide."
action = "Utilisez une clé de 1 à 255 caractères ASCII imprimables, sans espace."
cause = "La clé d'idempotence est vide, trop longue ou contient des caractères non imprimables."

[errors."idempotency_key_reused"]
title = "Cette clé d'idempotence a déjà servi pour une autre requête."
action = "Générez une nouvelle clé pour chaque nouvelle requête."
cause = "Cette clé a déjà été utilisée avec un contenu différent : elle ne peut désigner qu'une seule requête."

[errors."instance.lease_conflict"]
title = "Une autre instance de Shelfhold écrit sur ces données."
action = "Arrêtez l'autre instance ; une seule instance doit utiliser ces volumes."
cause = "Un autre processus Shelfhold détient le bail d'écriture sur ces volumes : deux instances qui écrivent ensemble corrompraient la base."

[errors."instance.starting"]
title = "Shelfhold démarre : une migration tient encore les données."
action = "Patientez : l'instance reprend d'elle-même quand la migration est finie."
cause = "Le démarrage applique encore une migration de la base : les écritures attendent qu'elle soit finie."

[errors."instance.restored_behind"]
title = "La base est en retard sur les fichiers : lecture seule."
action = "Lancez « shelfhold reconcile --adopt-after-restore » pour rapprocher la base et les fichiers."
cause = "La base a été restaurée depuis une sauvegarde plus ancienne que les fichiers présents sur le disque."

[errors."internal_error"]
title = "Erreur interne de Shelfhold."
action = "Réessayez ; si l'erreur persiste, relevez l'identifiant de requête et consultez les journaux."
cause = "Shelfhold a rencontré une erreur inattendue."

[errors."remember_needs_confirmation"]
title = "Le profil durci demande de confirmer « se souvenir de moi »."
action = "Décochez « se souvenir de moi » pour une session de navigateur, ou confirmez-le explicitement (confirm_remember) : la session durera alors le temps du profil durci."
cause = "Le profil durci refuse de garder une session de longue durée sans que vous l'ayez demandé explicitement."

[errors."password_login_suspended"]
title = "La connexion par mot de passe est suspendue : une restauration a pu ramener d'anciens mots de passe."
action = "Sur la machine hôte : « shelfhold admin reset-password » pour chaque compte, puis « shelfhold restore acknowledge »."
cause = "Une restauration peut avoir ramené d'anciens mots de passe : la connexion par mot de passe reste fermée tant qu'ils n'ont pas été changés."

[errors."invalid_credentials"]
title = "Identifiant ou mot de passe incorrect."
action = "Vérifiez l'identifiant et le mot de passe, puis recommencez."
cause = "L'identifiant ou le mot de passe ne correspond à aucun compte ; Shelfhold ne dit pas lequel des deux est faux."

[errors."invalid_cursor"]
title = "Le curseur de pagination est invalide."
action = "Repartez de la première page, sans curseur."
cause = "Le curseur de pagination n'est plus valable."

[errors."job.dead_lettered"]
title = "Des tâches ont définitivement échoué."
action = "Ouvrez l'Activité, consultez les tâches en échec puis relancez-les ou abandonnez-les."
cause = "Des tâches ont épuisé leurs nouvelles tentatives sans réussir et ont été mises de côté."

[errors."metadata.provider_down"]
title = "Le fournisseur de métadonnées ne répond plus."
action = "Aucune action immédiate : l'enrichissement reprend quand le fournisseur revient."
cause = "Le fournisseur de métadonnées ne répond plus ou renvoie des erreurs de façon répétée."

[errors."method_not_allowed"]
title = "Méthode non autorisée sur cette adresse."
action = "Utilisez l'une des méthodes indiquées dans l'en-tête Allow."
cause = "Cette adresse n'accepte pas cette méthode."

[errors."mount.sentinel_missing"]
