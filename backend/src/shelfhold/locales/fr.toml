# Catalogue français (ENF-I18N-001). Toute chaîne visible passe par shelfhold.i18n.t().

[cli]
description = "Shelfhold : l'atelier de la bibliothèque personnelle de votre foyer."
migrate_help = "Applique les migrations de la base (sauvegarde préalable, refus d'un schéma plus récent)."
serve_help = "Démarre le serveur HTTP."
config_help = "Consulte la configuration."
config_show_help = "Affiche chaque champ avec son origine (env, toml, db, défaut)."
json_help = "Sortie au format JSON."

[migrate]
up_to_date = "La base est déjà à jour."
applied = "{count} migration(s) appliquée(s) ; la base est à la révision {revision}."
backup = "Sauvegarde préalable : {path}"
failed = "La migration {revision} a échoué : {detail}. Restaurez la sauvegarde indiquée dans les journaux."
schema_too_new = "La base est à la révision {revision}, plus récente que cette version de Shelfhold : démarrage refusé."

[config]
invalid = "Configuration invalide : {detail}"
row = "{name} = {value} [{source}]"
row_readonly = "{name} = {value} [{source}] (lecture seule, définie par l'environnement)"
