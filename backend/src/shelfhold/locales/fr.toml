edition_help = "Identifiant d'une Édition à classer seule (adaptation d'une Œuvre adulte, par exemple)."
pending_help = "Classe d'un coup toutes les Œuvres de « À classer » ; demande de retaper la confirmation affichée."
confirm_help = "Avec --pending : la confirmation affichée par la commande sans --confirm."
choose_one = "Indiquez --work, --edition ou --pending (un seul)."
done = "{target} classé {age}."
withdrawals_plan = "{count, plural, one {# Édition ne tient plus} other {# Éditions ne tiennent plus}} dans une étagère famille ; rien n'a été retiré. Lancez « shelfhold shelf withdraw » pour voir le plan et le confirmer :"
withdrawal_line = "  Édition {edition} (étagère {shelf}) : {reason}"
suggestions_open = "{count, plural, one {# âge suggéré plus élevé reste ouvert : il bloque son Édition} other {# âges suggérés plus élevés restent ouverts : ils bloquent leur Édition}} tant qu'elle n'est pas classée (shelfhold rate ÂGE --edition ID) :"
suggestion_line = "  Édition {edition} : {age} suggéré ({provenance})"
pending_line = "  {work}  {title}  ({state})"
pending_none = "Aucune Œuvre n'attend dans « À classer »."
pending_header = "{count, plural, one {# Œuvre serait classée} other {# Œuvres seraient classées}} {age} :"
pending_confirm = "Pour les classer toutes, retapez la confirmation : shelfhold rate {age} --pending --confirm {token}"
pending_needs_confirm = "La confirmation ne correspond pas à la liste lue ({token}) : relisez la liste puis retapez-la."
batch_done = "{count, plural, one {# Œuvre classée} other {# Œuvres classées}} {age} (une entrée d'audit par Œuvre)."

[errors."import.protected"]
title = "Fichier protégé, non pris en charge."
action = "Shelfhold ne lève aucune protection : le fichier reste dans le dossier d'import, intact. Déposez une version sans protection que vous avez le droit d'utiliser."
cause = "Le fichier est chiffré ou verrouillé par un dispositif de protection : Shelfhold n'en lève aucun et ne peut pas le lire."

[errors."import.protected_licence"]
title = "Fichier protégé par une licence de prêt ou d'achat, non pris en charge."
action = "Lisez-le dans l'application prévue pour sa licence, empruntez-le en médiathèque ou achetez une version sans protection. Le fichier reste dans le dossier d'import, intact."
cause = "Le fichier n'est lisible qu'avec une licence de prêt ou d'achat liée à un compte ou à un appareil."

[errors."import.audio_unsupported"]
title = "Fichier audio refusé : les livres audio ne sont pas encore pris en charge."
action = "Le fichier reste dans le dossier d'import. Il pourra être importé quand les éditions audio seront disponibles."
cause = "Le fichier est un livre audio, un format que cette version de Shelfhold ne range pas encore."

[errors."import.unsupported_file"]
title = "Fichier non reconnu : seuls les CBZ, les EPUB et les PDF sont importés."
action = "Le type d'un fichier se lit dans son contenu, pas dans son nom. Le fichier reste dans le dossier d'import."
cause = "Le contenu du fichier n'est ni un CBZ, ni un EPUB, ni un PDF, quelle que soit son extension."

[errors."import.too_large"]
title = "Fichier trop volumineux pour l'import."
action = "Le fichier reste dans le dossier d'import. Relevez la limite de réception ou découpez-le."
cause = "Le fichier dépasse la taille maximale acceptée à l'import."

[errors."import.archive_refused"]
title = "L'archive n'est pas sûre à ouvrir, ou contient une entrée non autorisée."
action = "Le fichier reste dans le dossier d'import et n'a pas été rangé."
cause = "L'archive contient un chemin qui sortirait de son dossier, un lien, une entrée non autorisée ou une taille anormale."

[errors."import.link_refused"]
title = "Lien symbolique, lien physique ou point de montage refusé dans le dossier d'import."
action = "Déposez le fichier lui-même, sans lien, dans le dossier d'import."
cause = "Un lien symbolique, un lien physique ou un point de montage pourrait mener hors du dossier d'import : Shelfhold n'en suit aucun."

[errors."import.unsafe_name"]
title = "Nom de fichier refusé : caractère de contrôle, « .. », espace ou point final, ou nom trop long."
action = "Renommez le fichier. Il reste dans le dossier d'import."
cause = "Le nom du fichier contient un caractère de contrôle ou « .. », finit par un espace ou un point, ou dépasse la longueur admise."

[errors."import.name_collision"]
title = "Deux fichiers ont le même nom une fois normalisé (majuscules ou accents)."
action = "Renommez l'un d'eux. Les deux restent dans le dossier d'import."
cause = "Une fois mis en minuscules et sans accents, les deux noms sont identiques : ils se confondraient sur certains systèmes de fichiers."

[errors."import.not_ready"]
title = "Fichier pas encore prêt : il est encore en cours d'écriture ou vient d'être déposé."
action = "Rien à faire : Shelfhold le relira quand sa taille et sa date n'auront plus bougé."
cause = "La taille ou la date du fichier a encore changé à la dernière lecture : il est probablement en cours de copie."

[errors."import.pdf_refused"]
title = "PDF non pris : il n'a pas pu être vérifié, ou il contient des fichiers joints ou une enveloppe."
action = "Il reste dans le dossier d'import, intact. Réexportez-le en PDF simple, sans pièce jointe."
cause = "Le PDF n'a pas pu être contrôlé jusqu'au bout, ou il embarque des pièces jointes ou une enveloppe qui peuvent cacher du code."

[errors."import.left_in_quarantine"]
title = "Un fichier a été mis de côté dans « .shelfhold-removing » et n'a pas pu être remis en place."
action = "Ne l'écrasez pas : récupérez-le à la main dans ce sous-dossier du dossier d'import."
cause = "Le fichier a été mis de côté pendant l'import, puis l'opération a échoué avant de le remettre à sa place."

[errors."import.purchase_pending"]
title = "Fichier du dossier « achats » : il n'est pris que si vous déclarez un achat."
action = "Lancez « shelfhold import scan --purchase » ; sinon il reste où il est."
cause = "Le dossier des achats n'est lu que lorsque vous déclarez l'achat : sa provenance est ainsi connue."

[errors."import.changed_while_reading"]
title = "Le fichier a changé pendant sa lecture : il n'a pas été rangé."
action = "Rien à faire : il sera relu au prochain passage."
cause = "La taille ou la date du fichier a changé pendant que Shelfhold le lisait : sa copie pourrait être incomplète."

[errors."import.hash_mismatch"]
title = "La copie rangée n'a pas la même empreinte que le fichier d'origine."
action = "Le fichier reste dans le dossier d'import et n'est pas retiré. Vérifiez le disque puis relancez l'import."
cause = "L'empreinte de la copie rangée diffère de celle du fichier d'origine : écriture défaillante, disque abîmé ou fichier modifié en route."

[errors."import.disk_full"]
title = "Disque plein : le fichier n'a pas pu être rangé."
action = "Le fichier reste dans le dossier d'import. Libérez de la place puis relancez l'import."
cause = "Le volume de rangement n'a plus assez d'espace libre pour la copie."

[errors."import.not_stored"]
title = "Le fichier n'a pas pu être rangé."
action = "Le fichier reste dans le dossier d'import. Consultez le diagnostic puis relancez l'import."
cause = "Une erreur imprévue a interrompu le rangement du fichier ; le diagnostic en donne le détail."

[errors."import.tombstoned"]
title = "Ce contenu a été purgé : il n'est pas rangé de nouveau."
action = "Le fichier reste dans le dossier d'import. Retirez-le vous-même si vous n'en voulez plus."
cause = "Vous avez purgé ce contenu en demandant qu'il ne revienne pas : la pierre tombale l'empêche d'être rangé de nouveau."

[errors."import.own_export"]
title = "Ce fichier est un export de Shelfhold lui-même : il est noté comme réplique, pas rangé de nouveau."
action = "Le fichier reste dans le dossier d'import. Retirez-le vous-même si vous n'en voulez plus."
cause = "L'empreinte du fichier est celle d'un export que Shelfhold a lui-même écrit : le ranger créerait un doublon de sa propre copie."

[errors."import.original_not_kept"]
title = "Fichier rangé sous sa forme neutralisée seulement : l'original n'est conservé nulle part."
action = "Le fichier reste dans le dossier d'import, car il serait perdu sinon. Configurez /store pour conserver les originaux."
cause = "Le fichier n'a été conservé que sous sa forme neutralisée : le ranger ferait disparaître la seule copie de l'original."

[errors."import.tree_unreadable"]
title = "L'arbre à importer n'est pas lisible."
action = "Donnez le chemin absolu d'un dossier réel (pas un lien), distinct de /library, /store et /data."
cause = "Le chemin donné n'est pas un dossier lisible : introuvable, lien, ou emplacement réservé à Shelfhold."

[errors."import.tree_no_series"]
title = "Aucune liaison Suwayomi ne correspond à ce dossier de série."
action = "L'arbre n'est pas modifié. Suivez d'abord la série (« shelfhold follow »), puis relancez l'import."
cause = "Le dossier de la série ne correspond à aucune série suivie dans le service connecté."

[errors."import.tree_ambiguous_series"]
title = "Plusieurs liaisons Suwayomi portent ce titre de série."
action = "L'arbre n'est pas modifié. Rien n'est deviné : retirez la liaison en double, puis relancez l'import."
cause = "Plusieurs séries suivies portent ce titre : Shelfhold ne choisit pas à votre place où ranger les chapitres."

[errors."import.tree_unnumbered"]
title = "Le numéro de ce chapitre n'est pas lisible dans son nom."
action = "L'arbre n'est pas modifié. Renommez le chapitre avec « Chapter N » ou téléchargez-le de nouveau."
cause = "Le nom du dossier ou du fichier ne contient pas de numéro de chapitre que Shelfhold sache lire."

[errors."import.tree_duplicate"]
title = "Ce chapitre est déjà rangé."
action = "Rien n'est à faire : la copie existante est gardée et l'arbre n'est pas modifié."
cause = "Un chapitre de même identité et de même numéro est déjà dans la bibliothèque."

[errors."import.tree_wrong_source"]
title = "Le dossier de source de ce chapitre n'est pas celui de la liaison de cette série."
action = "L'arbre n'est pas modifié. Une série du même titre sous une autre source n'est pas la même série : suivez-la depuis cette source."
cause = "Le chapitre vient d'un dossier de source différent de celui qui est lié à cette série : l'importer le mélangerait avec une autre série du même titre."

[errors."import.tree_needs_rating"]
title = "À classer : l'âge que suggèrent le fichier ou la source dépasse le classement de l'Œuvre."
action = "Rien n'est rangé et l'arbre n'est pas modifié. Classez l'Œuvre (« shelfhold rate »), puis relancez l'import."
cause = "L'Œuvre est classée pour un âge plus bas que celui que le fichier ou la source annonce."

[errors."content.untrusted_pdf"]
title = "PDF rangé tel quel, non exporté : sa provenance n'est pas déclarée."
action = "Un PDF peut contenir du code que lirait le lecteur d'une destination. Déclarez-le comme un achat à l'import pour l'exporter."
cause = "Un PDF peut embarquer du code que le lecteur de la destination exécuterait : sans provenance déclarée, Shelfhold ne l'exporte pas."

[errors."import.not_configured"]
title = "Aucun dossier d'import n'est configuré."
action = "Définissez SHELFHOLD_IMPORT_DIR (un dossier distinct de /library, /store et /data), puis relancez."
cause = "Le réglage du dossier d'import est absent ou désigne un emplacement réservé à Shelfhold."

[errors."session_not_found"]
title = "Cette session n'existe pas ou est déjà fermée."
action = "Actualisez la liste des sessions."
cause = "La session a déjà été fermée, ou la liste affichée est plus ancienne que l'état réel."

[recovery_kit]
title = "Kit de secours du foyer"
intro = "À imprimer et à ranger hors de l'appareil. Ce kit ne contient aucun mot de passe, aucune phrase de passe et aucune clé : il dit où chercher et quoi taper."
passphrase_title = "Où est la phrase de passe"
passphrase_body = "La phrase de passe de l'export du trousseau est choisie par vous. Elle n'est pas dans ce kit. Notez ci-dessous où elle se trouve (gestionnaire de mots de passe, coffre, enveloppe), jamais à côté du fichier d'export."
reset_title = "Reprendre la main sur un compte"
reset_body = "Aucun code de récupération n'existe sur le web : la reprise passe par l'hôte. Depuis la machine qui héberge Shelfhold, lancez la commande ci-dessous (le mot de passe vient du fichier ou de l'entrée standard, jamais de la ligne de commande). Les sessions, les clés d'accès (passkeys) et les clés d'API de ce compte sont fermées."
sessions_title = "Fermer toutes les sessions"
sessions_body = "Si un appareil est perdu ou volé, fermez toutes les sessions depuis l'hôte, sans arrêter le serveur."
kavita_title = "Continuer à lire sans Shelfhold"
kavita_body = "Vos fichiers sont déjà rangés dans les bibliothèques de Kavita : ouvrez Kavita directement avec son propre compte, Shelfhold n'est pas nécessaire pour lire."
follows_title = "Suspendre les suivis"
follows_body = "Pour que plus rien ne s'écrive ni ne se télécharge pendant que vous réparez : activez le mode maintenance, puis levez-le avec « shelfhold maintenance off »."
keyring_title = "Le trousseau"
keyring_body = "Le fichier d'export du trousseau, que la documentation nomme {export} : si vous l'avez enregistré sous un autre nom (l'option --out), notez ce nom ci-dessous. Il est chiffré par la phrase de passe, il est gardé hors de l'hôte, dans un autre endroit que la phrase de passe. Sans lui, après une perte de /data, le journal des suppressions ne protège plus rien."
rotation = "Refaites l'export du trousseau, et réimprimez ce kit, après chaque rotation du trousseau."
no_secret = "Ce kit ne contient aucun secret."
