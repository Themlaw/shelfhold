[errors."target.foreign_writer_detected"]
title = "Un autre programme écrit dans un dossier géré par Shelfhold."
action = "Retirez les fichiers étrangers ou excluez ce dossier de l'autre programme, puis relancez l'export."
cause = "Un autre programme, un ancien script par exemple, crée ou modifie des fichiers dans un dossier que Shelfhold gère seul."

[errors."target.instance_changed"]
title = "Kavita semble avoir été réinstallé."
action = "Confirmez avec « shelfhold target reconnect » ; rien n'est recréé tant que vous ne l'avez pas fait."
cause = "L'identité du serveur Kavita n'est plus celle qui a été enregistrée : réinstallation, restauration ou changement d'adresse."

[errors."target.key_expiring"]
title = "La clé d'API de Kavita expire bientôt."
action = "Générez une nouvelle clé dans Kavita et enregistrez-la dans Shelfhold."
cause = "La clé d'API que Shelfhold utilise a une date d'expiration proche."

[errors."target.library_type_changed"]
title = "Le type d'une bibliothèque Kavita a changé."
action = "L'étagère est en pause et rien n'est renommé. Remettez le type d'origine dans Kavita, puis lancez « shelfhold target reconnect »."
cause = "Le type de la bibliothèque a été modifié dans Kavita depuis le dernier passage : ses fichiers seraient lus autrement."

[errors."target.not_indexed"]
title = "Le fichier écrit n'apparaît pas dans Kavita."
action = "Vérifiez l'exclusion de dossier, le type de bibliothèque et la surveillance des dossiers dans Kavita."
cause = "Kavita n'a pas vu le fichier écrit : dossier exclu, analyse des dossiers désactivée ou bibliothèque d'un autre type."

[errors."target.permission_denied"]
title = "Shelfhold ne peut pas écrire dans ce dossier."
action = "Corrigez les droits du dossier de série, puis lancez « shelfhold target recheck »."
cause = "Le compte qui fait tourner Shelfhold n'a pas le droit d'écrire dans le dossier de la série."

[errors."target.pull_needs_readable_copy"]
title = "Cette destination à la demande n'a aucune copie lisible à servir."
action = "Conservez les copies de l'étagère, ou liez aussi une destination en arborescence."
cause = "Une destination à la demande sert ses fichiers depuis une copie conservée, et l'étagère n'en garde aucune que l'on puisse lire."

[errors."target.route_missing"]
title = "Kavita n'a pas la fonction attendue."
action = "Mettez Kavita à jour, puis lancez « shelfhold target recheck »."
cause = "La version de Kavita installée ne propose pas une fonction dont Shelfhold a besoin."

[errors."shelf.withdrawal_root_read_only"]
title = "Ces fichiers sont sur une racine en lecture seule : Shelfhold ne les déplace jamais."
action = "Montez le dossier en lecture-écriture (mode adopt) ou retirez vous-même les fichiers, puis relancez un scan."
cause = "La racine qui porte ces fichiers est montée en lecture seule : Shelfhold ne retire jamais un fichier qu'il ne peut pas remettre."

[errors."shelf.not_child_library"]
title = "Ce dossier n'est pas une bibliothèque lisible par des enfants."
action = "Aucun plan de retrait : seules les bibliothèques adoptées lisibles par des enfants en ont un."
cause = "Ce dossier n'est pas celui d'une bibliothèque adoptée lisible par des enfants : le plan de retrait n'existe que pour ces bibliothèques."

[errors."shelf.destination_exists"]
title = "Cette étagère a déjà une destination."
action = "Une seule destination par étagère pour l'instant ; plusieurs viendront avec la version suivante."
cause = "Cette version n'accepte qu'une destination par étagère, et celle-ci en a déjà une."

[errors."target.tree_overlap"]
title = "Deux destinations en écriture se recouvrent."
action = "Choisissez des dossiers distincts : deux indexeurs ne partagent pas encore le même arbre."
cause = "Un dossier de l'une des destinations en écriture contient ou recouvre celui d'une autre : deux programmes y écriraient en même temps."

[errors."target.unreachable"]
title = "Kavita ne répond pas."
action = "Vérifiez que le conteneur Kavita tourne, ou reconnectez-le avec « shelfhold target reconnect »."
cause = "Le serveur Kavita ne répond pas : conteneur arrêté, adresse changée ou réseau coupé."

[errors."target.version_unsupported"]
title = "La version de Kavita n'est pas prise en charge."
action = "Mettez Kavita à jour vers une version prise en charge (voir les notes de version)."
cause = "La version de Kavita est hors de celles que Shelfhold a testées : ses réponses peuvent différer."

[errors."tombstone.key_unknown"]
title = "Une clé citée par une pierre tombale est inconnue."
action = "Importez le trousseau (« shelfhold secrets import --passphrase-file <fichier> --in <fichier> ») ou acceptez la perte avec « shelfhold tombstone accept-lost-keyring »."
cause = "Une pierre tombale a été chiffrée avec une clé qui n'est pas dans le trousseau de cette instance : trousseau perdu ou restauré sans elle."

[errors."ops.preview_stale"]
title = "L'aperçu confirmé n'est plus celui de l'instance."
action = "Relancez la commande sans confirmation, relisez l'aperçu, puis confirmez avec la nouvelle empreinte."
cause = "L'état de l'instance a changé entre l'aperçu et votre confirmation : l'empreinte donnée ne correspond plus."

[errors."tombstone.migration_hit"]
title = "Une migration a rencontré un contenu effacé."
action = "Examinez le contenu concerné ; rien n'a été réacquis."
cause = "Un contenu que vous aviez effacé était présent dans les données migrées : la pierre tombale a bloqué son retour."

[errors."tombstone.root_mismatch"]
title = "Le journal d'effacement appartient à une autre racine."
action = "Consultez le rapport : les lignes ont été appliquées à la racine connue, rien n'a été supprimé."
cause = "Le journal d'effacement a été écrit pour une autre racine que celle qui est montée : volume remplacé ou journal copié d'ailleurs."

[errors."tombstone.unverified"]
title = "Une pierre tombale n'a pas pu être vérifiée."
action = "Examinez la ligne signalée au rapport et décidez de la garder ou de l'écarter."
cause = "La signature ou la clé d'une ligne du journal d'effacement ne se vérifie pas : fichier modifié, tronqué ou clé inconnue."

[errors."too_many_attempts"]
title = "Trop de tentatives de connexion."
action = "Patientez une minute avant de réessayer ; l'administrateur peut aussi agir depuis la ligne de commande de l'hôte."
cause = "Trop d'identifiants erronés ont été essayés depuis cette adresse en peu de temps : Shelfhold ralentit les tentatives pour empêcher de deviner un mot de passe."

[errors."unauthenticated"]
title = "Connexion requise."
action = "Connectez-vous, ou fournissez une clé d'API valide."
cause = "La requête ne porte ni session valide ni clé d'API : session expirée, déconnexion ou clé absente."

[errors."unit.safeguard_backlog"]
title = "La file de mise à l'abri est saturée."
action = "Laissez la file se vider ou augmentez le quota de mise à l'abri."
cause = "Plus de chapitres attendent leur copie à l'abri que le quota ne permet d'en traiter à la fois."

[errors."unit.confirmation_required"]
title = "Ce chapitre est irremplaçable : la suppression demande une confirmation."
action = "Tapez l'identifiant du chapitre pour confirmer. Aucune copie ne sera supprimée sans cela."
cause = "Ce chapitre n'existe plus nulle part ailleurs : le supprimer le perdrait pour toujours, donc Shelfhold exige une confirmation explicite."

[errors."unit.safeguard_failed"]
title = "La mise à l'abri d'un chapitre a échoué."
action = "Consultez l'Activité et relancez la mise à l'abri du chapitre."
cause = "La copie du chapitre vers /store a échoué : volume plein, absent ou en lecture seule."

[errors."unit.revision_suspect"]
title = "Une nouvelle version d'un chapitre est bien plus petite que celle rangée : elle est en quarantaine."
action = "L'ancienne version reste exportée. Si la nouvelle est bonne, `shelfhold revisions list` la montre et `revisions apply --force-suspect` (action réservée) l'accepte."
cause = "La nouvelle version est beaucoup plus petite que celle qui est rangée, comme si elle était tronquée ou vide."

[errors."revisions.confirmation_required"]
title = "La file « à réécrire » se confirme par lot."
action = "Lancez `shelfhold revisions list`, relisez le nombre de positions KOReader touchées, puis donnez le jeton affiché avec `--confirm`."
cause = "Réécrire des chapitres déplace la position de lecture sur certains appareils : Shelfhold exige une confirmation qui dit combien sont touchés."

[errors."unit.upgraded"]
title = "Un chapitre a été remplacé par une meilleure version, au même emplacement."
action = "La progression Kavita est conservée ; sur KOReader, la position de lecture repart du début. L'ancienne version reste 30 jours dans la corbeille."
cause = "La source a publié une meilleure version de ce chapitre et Shelfhold l'a mise à la place de l'ancienne."

[errors."validation_failed"]
title = "Des champs de la requête sont invalides."
action = "Corrigez les champs listés puis recommencez."
cause = "Une valeur envoyée ne respecte pas le format attendu."

[errors."wake.deferred"]
title = "Le service est resté endormi : des lots sont différés."
action = "Vérifiez le réveil automatique du service ou démarrez-le à la main."
cause = "Le service connecté dormait au moment de la demande, donc ses lots ont été repoussés."

[errors."source.fallback"]
title = "Une source de repli a pris le relais."
action = "Vérifiez la source principale ; Shelfhold y revient dès qu'elle fonctionne."
cause = "La source principale n'a pas répondu ou a échoué, donc la source de rang suivant a été interrogée."

[errors."backfill.confirmation_required"]
title = "Le rattrapage dépasse 100 chapitres ou 5 Gio : il demande une confirmation."
action = "Vérifiez l'estimation (nombre, taille, espace libre), puis confirmez pour lancer le rattrapage."
cause = "Le rattrapage dépasse 100 chapitres ou 5 Gio : Shelfhold ne lance pas un téléchargement de cette taille sans que vous l'ayez confirmé."

[errors."follow.service_paused"]
title = "Le service connecté est en pause : rien n'a été suivi."
action = "Sortez le service de sa pause avec la commande indiquée par « shelfhold status », puis recommencez."
cause = "Le service connecté est en pause : il ne répond à aucune demande de suivi tant qu'on ne l'a pas relancé."

[errors."follow.confirmation_required"]
title = "Retirer la série de la bibliothèque du service demande une confirmation."
action = "Ne plus suivre garde la série dans le service ; pour l'en retirer aussi, confirmez explicitement."
cause = "Retirer la série de la bibliothèque du service est irréversible depuis Shelfhold : il demande une confirmation explicite."

[errors."request.not_found"]
title = "Cette demande n'existe pas."
action = "Ouvrez « Mes demandes » pour voir celles que vous avez faites."
cause = "L'identifiant ne correspond à aucune de vos demandes : demande retirée, ou faite depuis un autre profil."

[errors."request.not_pending"]
title = "Cette demande a déjà reçu une réponse ou a été annulée."
action = "Rafraîchissez la liste : l'état de la demande a changé."
cause = "Quelqu'un a déjà répondu à cette demande, ou son auteur l'a annulée."

[errors."request.not_allowed"]
title = "Vous ne pouvez pas décider de cette demande."
action = "Seul un administrateur dont la session est récente, et qui a le droit de classer, approuve une demande."
cause = "Approuver une demande demande une connexion récente et le droit de classer, que ce profil n'a pas."

[errors."request.kind_not_allowed"]
title = "Ce profil ne peut demander un titre que depuis les résultats de sa recherche."
action = "Cherchez le titre, puis choisissez « Demander » sur le résultat."
cause = "Un profil d'enfant ne peut pas écrire un titre ou une adresse : il ne demande que parmi les résultats que sa recherche lui montre."

[errors."request.invalid_ref"]
title = "Ce résultat n'est plus disponible pour une demande."
action = "Relancez la recherche, puis choisissez « Demander » sur le résultat."
cause = "Le résultat choisi n'est plus dans la recherche : celle-ci a été refaite ou a expiré depuis."

[errors."request.invalid_target"]
title = "La demande ne désigne pas un titre valide."
action = "Donnez un identifiant d'œuvre, un ISBN valide ou un titre en texte simple."
cause = "Le texte n'est ni un identifiant d'œuvre, ni un ISBN valide, ni un titre en texte simple."

[errors."request.too_many_pending"]
title = "Trop de demandes sont déjà en attente pour ce profil."
action = "Attendez une réponse, ou annulez une demande, avant d'en faire une autre."
cause = "Ce profil a déjà atteint le nombre maximal de demandes en attente."

[errors."request.invalid_reason"]
title = "Le motif du refus est vide, trop long ou contient des caractères invisibles."
action = "Écrivez un motif court en texte simple."
cause = "Le motif est vide, dépasse la longueur admise ou contient des caractères invisibles."

[errors."request.choose_age"]
title = "Choisir un âge : classer le livre, c'est approuver la demande d'un enfant."
action = "Choisissez l'âge minimal du livre, puis approuvez."
cause = "Une demande d'enfant porte sur un livre sans âge : l'approuver revient à décider que ce livre convient à un enfant."

[errors."request.confirmation_required"]
title = "La demande dépasse 100 unités ou 5 Gio : elle demande une confirmation."
action = "Vérifiez le résumé de taille, puis confirmez pour approuver."
cause = "L'approbation lancerait un téléchargement de plus de 100 unités ou de 5 Gio, que Shelfhold ne démarre pas sans confirmation."

[errors."request.unresolved"]
title = "Ce texte ou cet ISBN ne correspond à aucune œuvre de la bibliothèque."
action = "Marquez la demande « introuvable », ou ajoutez le livre par une source."
cause = "Le texte ou l'ISBN saisi ne figure ni dans la bibliothèque ni dans aucune des sources interrogées."

[errors."request.shelf_refused"]
title = "L'étagère choisie refuse cette édition."
action = "Choisissez une autre étagère, ou classez d'abord l'édition."
cause = "L'âge de l'édition dépasse le plafond de l'étagère choisie, ou l'édition n'est pas classée."

[errors."series.gap"]
title = "Il manque des chapitres dans la série."
action = "Consultez la série et lancez la recherche des chapitres manquants."
cause = "La source n'a pas publié, ou Shelfhold n'a pas reçu, certains numéros entre le premier et le dernier chapitre."

[errors."edition.auto_attached"]
title = "Une édition a été rattachée à l'œuvre qui porte le même identifiant externe."
action = "Vérifiez le rattachement avec « shelfhold edition attachments » ; « shelfhold edition detach » le défait (Séparer). L'édition reste hors des étagères famille tant qu'elle n'est pas classée."
cause = "Deux éditions portent le même identifiant externe (ISBN, par exemple) : Shelfhold en conclut qu'elles sont la même Œuvre."

[errors."edition.attach_suggested"]
title = "Un rattachement par identifiant externe attend votre confirmation : il relèverait l'âge de l'œuvre."
action = "Lisez le plan de retrait avec « shelfhold edition attach-confirm », puis confirmez-le avec le jeton affiché, ou refusez-le avec « shelfhold edition attach-decline »."
cause = "Le rattachement ferait passer l'Œuvre à un âge plus élevé : Shelfhold attend votre confirmation avant de retirer des fichiers à un enfant."

[errors."edition.attach_refused"]
title = "Ce rattachement ne peut pas être défait ni confirmé dans son état actuel."
action = "Consultez son état avec « shelfhold edition attachments » : il a déjà été défait, refusé, ou l'édition a changé d'œuvre depuis."
cause = "Le rattachement a déjà été défait ou confirmé, ou les Éditions ont changé depuis."

[errors."edition.merge_refused"]
title = "Cette fusion d'éditions est refusée : rien n'a été modifié ni supprimé."
action = "Relisez le plan avec « shelfhold edition merge » : une pierre tombale (une place ou un identifiant d'œuvre purgés), une autre œuvre, une place déjà occupée ou une liaison que la fusion ne sait pas déplacer l'arrête."
cause = "Une pierre tombale, un verrou ou une différence d'identité empêche de fusionner ces Éditions sans rien perdre."

[errors."work.merge_refused"]
title = "Cette fusion d'œuvres est refusée : rien n'a été modifié."
action = "Relisez le plan avec « shelfhold work merge » : un autre type d'œuvre, deux éditions de même clé (fusionnez-les d'abord, avec leur propre plan) ou deux séries différentes l'arrêtent."
cause = "Les deux œuvres ne sont pas du même type, portent deux éditions de même clé ou appartiennent à deux séries différentes."

[errors."merge.expired"]
title = "Cette fusion date de plus de 30 jours : elle ne peut plus être défaite."
action = "Au-delà de 30 jours, la fusion reste. Pour séparer deux œuvres, recréez-les à la main."
cause = "La fenêtre de 30 jours pendant laquelle une fusion peut être défaite est passée."

[errors."merge.already_undone"]
title = "Cette fusion a déjà été séparée."
action = "Consultez les œuvres : les deux existent de nouveau."
cause = "Cette fusion a déjà été défaite par une séparation précédente."

[errors."merge.survivor_gone"]
title = "L'œuvre qui avait absorbé l'autre a elle-même été fusionnée depuis."
action = "Séparez d'abord la fusion la plus récente, puis celle-ci."
cause = "L'œuvre qui avait absorbé l'autre a été fusionnée dans une troisième depuis."

[errors."series.already_attached"]
title = "Cette œuvre appartient déjà à une série."
action = "Une œuvre n'appartient qu'à une série : pour la changer, séparez-la d'abord ou fusionnez les œuvres."
cause = "L'œuvre est déjà rattachée à une série, et une œuvre n'en a qu'une."

[errors."export.series_reassignment_refused"]
title = "Le plan de réaffectation des séries exportées est périmé ou refusé : rien n'a été modifié."
action = "Relisez le plan : une série adoptée (figée) ou une série liée à autre chose que ses éditions l'arrête. Un plan relu après un changement a une autre empreinte."
cause = "Le plan ne correspond plus à l'état actuel, ou une série adoptée ou liée à autre chose l'empêche."

[errors."tombstone.journal_truncated"]
title = "Le journal d'effacement d'une racine a été tronqué."
action = "Rien n'a été supprimé, mais la racine est bloquée (rapprochement et réacquisition) : « shelfhold tombstone set-aside-journal » met le fichier de côté et le réécrit depuis la base."
cause = "Le journal d'effacement de la racine est plus court que ce que la base a enregistré : fichier tronqué, restauré ou remplacé."

[errors."job.unknown_kind"]
title = "Une tâche d'un type inconnu a été ignorée."
action = "Mettez Shelfhold à jour ou retirez la tâche depuis l'Activité."
cause = "Le type de cette tâche n'est pas connu de cette version : elle vient d'une version plus récente ou d'une extension retirée."

[errors."job.failed"]
title = "Une tâche a échoué."
action = "Ouvrez l'Activité, consultez l'erreur de la tâche puis relancez-la."
cause = "La tâche a rencontré une erreur qu'elle ne sait pas résoudre seule."

[errors."window.preempted"]
title = "Une tâche de maintenance a été interrompue à la fin de la fenêtre."
action = "Aucune action : elle reprendra à la prochaine fenêtre de maintenance."
cause = "La fenêtre de maintenance s'est terminée pendant que la tâche tournait : elle a été interrompue pour ne pas déborder."

[errors."maintenance.active"]
title = "Le mode maintenance est actif : aucune écriture n'est acceptée."
action = "Lisez à votre aise ; pour reprendre, lancez « shelfhold maintenance off » (ou, dans l'interface, sortez du mode maintenance avec une session récente)."
cause = "Un administrateur a activé le mode maintenance : Shelfhold refuse les écritures pour garder les données stables."

[errors."db.busy"]
title = "La base de données est occupée : la requête n'a pas pu être traitée."
action = "Réessayez dans un instant ; ce n'est pas le mode maintenance."
cause = "Un autre travail tient la base de données et le délai d'attente est écoulé."

[errors."queue.priority_locked"]
title = "Cette priorité n'est pas modifiable : une réparation de sécurité passe toujours avant les autres tâches."
action = "Choisissez une priorité parmi new, request ou backfill, sur une tâche qui n'est pas une réparation de sécurité."
cause = "Cette tâche est une réparation de sécurité : elle passe toujours en premier, quelle que soit la priorité choisie."

[errors."image.too_large"]
title = "L'image dépasse les plafonds de taille ou de dimensions."
action = "Utilisez une image plus petite ; les plafonds par type sont dans la référence de configuration."
cause = "L'image dépasse la taille en octets ou en pixels que Shelfhold accepte de décoder."

[errors."image.format_refused"]
title = "Le format de l'image n'est pas accepté."
action = "Fournissez une image JPEG, PNG, WebP, GIF, AVIF ou JPEG XL."
cause = "Le contenu de l'image n'est dans aucun des formats que Shelfhold accepte : JPEG, PNG, WebP, GIF, AVIF ou JPEG XL."

[errors."image.decode_failed"]
title = "L'image est illisible ou corrompue."
action = "Téléchargez le fichier à nouveau ou choisissez une autre image."
cause = "L'image est tronquée, abîmée ou ne respecte pas son format."

[errors."image.worker_failed"]
title = "Le processus de décodage d'images a échoué."
action = "Consultez les journaux ; si cela se répète, vérifiez la mémoire disponible du conteneur."
cause = "Le processus isolé qui décode les images s'est arrêté : manque de mémoire, plantage ou délai dépassé."

[reconcile]
help = "Rapproche la base et les fichiers après une restauration (aperçu, empreinte, confirmation)."
