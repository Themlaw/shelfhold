store_lost = "/store est absent ou n'est pas le volume attendu (pas de fichier .shelfhold-mount-id) : {count, plural, one {# Unité en dépend} other {# Unités en dépendent}} et rien n'est marqué ni supprimé. Montez /store, ou « shelfhold store reinit » s'il est perdu."
store_restored = "{count, plural, one {# Unité retrouve sa copie conservée sous /store (même empreinte) et repasse} other {# Unités retrouvent leur copie conservée sous /store (même empreinte) et repassent}} à « stored »."
confirm_help = "Empreinte de l'aperçu : confirme exactement ce qui a été montré."
confirm_deletion_help = "Confirme aussi la suppression des fichiers que le journal de pierres tombales recouvre (action réservée ; sans cette option, rien n'est supprimé)."
confirm_unit_help = "Identifiant d'un chapitre irremplaçable que la suppression effacerait (à retaper pour chacun, avec --confirm-deletion ; répétable)."
irreplaceable_line = "Chapitre irremplaçable que la suppression effacerait : {unit}"
irreplaceable_missing = "Identifiant à retaper : {unit}"
irreplaceable_needs_typing = "La suppression efface des chapitres irremplaçables (aucune source ne peut les rendre) : retapez l'identifiant de chacun avec --confirm-unit <identifiant>, en plus de --confirm-deletion. Rien n'a été modifié."
