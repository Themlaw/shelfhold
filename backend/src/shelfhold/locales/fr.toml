forget_root_cost = "Oublier la racine {root} : elle ne sera plus ni écrite ni vérifiée, ses copies restent enregistrées mais Shelfhold ne les retrouvera que si vous la réadoptez (« root takeover »). Aucun fichier n'est supprimé. Si la racine revient plus tard, elle reste en lecture seule : on la récupère avec « shelfhold root takeover ». Pour confirmer, retapez : --confirm \"{phrase}\"."
forget_root_done = "Racine {root} oubliée (lecture seule). Relancez « shelfhold reconcile --adopt-after-restore »."
forget_root_unknown_root = "Racine {root} inconnue : rien n'a été modifié."
forget_root_still_readable = "La racine {root} a une sentinelle (lisible ou non) : elle est jugée par l'adoption, pas oubliée. Rien n'a été modifié."
forget_root_phrase_mismatch = "Phrase de confirmation incorrecte : retapez --confirm \"{phrase}\". Rien n'a été modifié."
