# Real Komga for the nightly (L44): the official image, from its public registry, on an
# internal-only network (no route out, no published port). The tag is chosen by the workflow
# (KOMGA_IMAGE). Configuration lives in a named volume removed with the project; the library is
# a read-only bind of a directory the tests fill with synthetic CBZ. Driven by tests/nightly/.
services:
  komga:
    image: ${KOMGA_IMAGE:?set KOMGA_IMAGE to the Komga image under test}
    restart: "no"
    networks: [nightly]
    environment:
      TZ: Etc/UTC
    volumes:
      - config:/config
      - ${KOMGA_LIBRARY:?set KOMGA_LIBRARY to a directory}:/library:ro

networks:
  nightly:
    internal: true

volumes:
  config:
