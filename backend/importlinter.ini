# Contracts declared before the code (ENF-QUAL-002, ENF-LEG-010). Run: lint-imports --config importlinter.ini
[importlinter]
root_package = shelfhold
include_external_packages = True

[importlinter:contract:domain-pure]
name = Domain imports neither sqlalchemy, fastapi nor httpx
type = forbidden
source_modules =
    shelfhold.*.domain
forbidden_modules =
    sqlalchemy
    fastapi
    httpx
    httpx2

[importlinter:contract:sdk-without-core]
name = The MIT SDK never imports the AGPL core
type = forbidden
source_modules =
    shelfhold.sdk
forbidden_modules =
    shelfhold.catalog
    shelfhold.acquisition
    shelfhold.library
    shelfhold.export
    shelfhold.identity
    shelfhold.integrations
    shelfhold.jobs
    shelfhold.events
    shelfhold.plugin_host
    shelfhold.interfaces
    shelfhold.infrastructure
    shelfhold.config
    shelfhold.i18n
    shelfhold.main

[importlinter:contract:contexts-independent]
name = Business contexts are independent from each other
type = independence
modules =
    shelfhold.catalog
    shelfhold.acquisition
    shelfhold.library
    shelfhold.export
    shelfhold.identity
ignore_imports =
    shelfhold.** -> shelfhold.*.public
    # The path map lives in export.domain and `infrastructure.fsops` (the sole writer, a shared
    # kernel used by every context) imports it. The library files through fsops; it does not
    # reach into export.
    shelfhold.library.adapters.storage -> shelfhold.infrastructure.fsops
    shelfhold.library.adapters.safeguard -> shelfhold.infrastructure.fsops
    shelfhold.library.adapters.received_migration -> shelfhold.infrastructure.fsops
    shelfhold.library.adapters.store_index -> shelfhold.infrastructure.fsops
    shelfhold.library.adapters.safeguard_job -> shelfhold.infrastructure.fsops
    shelfhold.library.adapters.epub_derivative -> shelfhold.infrastructure.fsops
    shelfhold.library.adapters.pdf_store -> shelfhold.infrastructure.fsops
    shelfhold.library.adapters.import_scan -> shelfhold.infrastructure.fsops

[importlinter:contract:catalog-layers]
name = Hexagonal layers of the catalog context
type = layers
layers =
    shelfhold.catalog.adapters
    shelfhold.catalog.application
    shelfhold.catalog.domain

[importlinter:contract:fastapi-only-in-interfaces]
name = FastAPI and Starlette are imported only by the HTTP interface
type = forbidden
allow_indirect_imports = True
source_modules =
    shelfhold.catalog
    shelfhold.acquisition
    shelfhold.library
    shelfhold.export
    shelfhold.identity
    shelfhold.integrations
    shelfhold.jobs
    shelfhold.events
    shelfhold.plugin_host
    shelfhold.infrastructure
    shelfhold.config
    shelfhold.i18n
    shelfhold.main
    shelfhold.sdk
forbidden_modules =
    fastapi
    starlette

# ENF-GOV-002: a critical dependency is imported only by its adapter.
[importlinter:contract:critical-huey]
name = Huey is imported only by its job-queue adapter
type = forbidden
source_modules =
    shelfhold
forbidden_modules =
    huey
ignore_imports =
    shelfhold.jobs.huey_app -> huey

# EF-INT-006, ENF-SEC-016: Apprise makes its own HTTP requests, so only its adapter may import it
# (scheme allowlist, SSRF check, no redirects, sealed URLs live there).
[importlinter:contract:critical-apprise]
name = Apprise is imported only by its notification adapter
type = forbidden
source_modules =
    shelfhold
forbidden_modules =
    apprise
ignore_imports =
    shelfhold.integrations.apprise.** -> apprise

[importlinter:contract:critical-comicbox]
name = comicbox is imported only by its ComicInfo adapter
type = forbidden
source_modules =
    shelfhold
forbidden_modules =
    comicbox
ignore_imports =
    shelfhold.library.adapters.comicinfo -> comicbox
unmatched_ignore_imports_alerting = none

# --- ENF-QUAL-002, M1a: single entry points ---
# `unmatched_ignore_imports_alerting = none` stays only on the comicbox contract: ComicInfo is
# written by the adapter itself (L24), comicbox is not a dependency and its ignore matches nothing.
# Every other contract uses the default (error), closed at the end of M1a.
# A contract can only name an external package as a whole, so `xml` (stdlib) is forbidden outside
# its single entry point, which wraps defusedxml. Both entry points exist since L08: their ignores
# list only what they import (tarfile, py7zr, rarfile and lxml stay forbidden everywhere until a
# lot adds them behind the same function).

[importlinter:contract:xml-single-entry]
name = safe_parse_xml is the only XML entry point (ENF-SEC-014)
type = forbidden
source_modules =
    shelfhold
forbidden_modules =
    xml
    lxml
    defusedxml
    pyexpat
    plistlib
    xmlrpc
ignore_imports =
    shelfhold.infrastructure.xml.** -> xml
    shelfhold.infrastructure.xml.** -> defusedxml

[importlinter:contract:archives-single-entry]
name = safe_open_archive is the only archive entry point (ENF-SEC-002)
type = forbidden
source_modules =
    shelfhold
forbidden_modules =
    zipfile
    tarfile
    py7zr
    rarfile
ignore_imports =
    shelfhold.infrastructure.archives.** -> zipfile

[importlinter:contract:sanitize-single-entry]
name = sanitize_upstream_text is the only HTML sanitising entry point (ENF-SEC-015)
type = forbidden
source_modules =
    shelfhold
forbidden_modules =
    nh3
    bleach
# Two modules, not the package: `sanitize` (upstream text) and `xhtml_neutralizer` (EPUB pages,
# EF-BIB-051). A third module of content_trust (the EPUB scan, the CBZ allowlist) gets no nh3.
ignore_imports =
    shelfhold.infrastructure.content_trust.sanitize -> nh3
    shelfhold.infrastructure.content_trust.xhtml_neutralizer -> nh3

# ENF-SEC-003: Pillow runs only inside the decode worker (bounded, network-less subprocess).
# Every other module reaches images through shelfhold.infrastructure.imaging.
[importlinter:contract:pillow-confined]
name = Pillow is imported only by the decode worker (ENF-SEC-003)
type = forbidden
source_modules =
    shelfhold
forbidden_modules =
    PIL
ignore_imports =
    shelfhold.infrastructure.imaging.worker -> PIL

# EF-SRC-012: an untrusted PDF is parsed only inside the same bounded worker, never in the main process.
[importlinter:contract:pypdf-confined]
name = pypdf is imported only by the decode worker (EF-SRC-012)
type = forbidden
source_modules =
    shelfhold
forbidden_modules =
    pypdf
ignore_imports =
    shelfhold.infrastructure.imaging.worker -> pypdf

# ENF-SEC-001: every outbound HTTP request goes through the Fetcher (SSRF guard). Apprise makes its
# own requests, which is documented (EF-INT-006, ENF-SEC-016); it is confined to its adapter by
# critical-apprise above.
[importlinter:contract:http-client-single-entry]
name = The Fetcher is the only outbound HTTP client (ENF-SEC-001)
type = forbidden
source_modules =
    shelfhold
forbidden_modules =
    httpx
    httpx2
    httpcore
    httpcore2
    requests
    urllib3
    aiohttp
    socket
# urllib.request, http.client and raw sockets are also banned by ruff (banned-api, pyproject)
ignore_imports =
    shelfhold.infrastructure.fetcher.** -> httpx2
    shelfhold.infrastructure.fetcher.** -> socket
    shelfhold.infrastructure.local_socket.** -> socket

[importlinter:contract:lang-single-producer]
name = normalize_lang is the only producer of language tags (ENF-I18N-005)
type = forbidden
source_modules =
    shelfhold
forbidden_modules =
    langcodes
ignore_imports =
    shelfhold.catalog.lang -> langcodes

# EF-BIB-045: independent_copies() is the single counting point. Other contexts reach it through
# shelfhold.library.public, never through the replica registry itself.
[importlinter:contract:replica-single-count]
name = Replicas are counted only by library.replica.independent_copies (EF-BIB-045)
type = forbidden
allow_indirect_imports = True
source_modules =
    shelfhold.catalog
    shelfhold.acquisition
    shelfhold.export
    shelfhold.identity
    shelfhold.integrations
    shelfhold.jobs
    shelfhold.events
    shelfhold.plugin_host
    shelfhold.interfaces
    shelfhold.infrastructure
forbidden_modules =
    shelfhold.library.replica

# EF-EXP-060: every write goes through fsops, which refuses adopt_ro roots. shutil is the module
# that copies, moves and removes trees; os-level calls cannot be told apart by an import contract
# and are covered by the fsops behaviour tests.
[importlinter:contract:fsops-sole-writer]
name = Only infrastructure.fsops writes to the file system (EF-EXP-060)
type = forbidden
source_modules =
    shelfhold
forbidden_modules =
    shutil
ignore_imports =
    shelfhold.infrastructure.fsops.** -> shutil
    # database backup before a migration, written under /data, never under a library root
    shelfhold.infrastructure.migrate -> shutil
    # /data/plugins only: the plugin install staging and removal, never a library root
    shelfhold.plugin_host.install -> shutil

# EF-SRC-033: the core sees connected services only through sdk.connected. The sources are listed
# level by level because a package never counts as importing itself: each level excludes the one
# package that holds the adapter, so the adapter's own modules may import one another.
[importlinter:contract:suwayomi-confined]
name = No Suwayomi symbol outside its adapter (EF-SRC-033)
type = forbidden
source_modules =
    shelfhold.*
    shelfhold.plugin_host.*
    shelfhold.plugin_host.adapters.*
    shelfhold.plugin_host.adapters.meta.*
forbidden_modules =
    shelfhold.plugin_host.adapters.meta.suwayomi
ignore_imports =
    # EF-INT-024: `source add suwayomi` reads the authentication mode through this one module
    shelfhold.headless.wiring -> shelfhold.plugin_host.adapters.meta.suwayomi.probe
    # EF-INT-009: `import tree` reads an existing download tree through this one module
    shelfhold.ops.import_folder -> shelfhold.plugin_host.adapters.meta.suwayomi.tree_import
    # The composition root builds the one connected service of M1a (the follow cycle, pairing)
    shelfhold.composition -> shelfhold.plugin_host.adapters.meta.suwayomi

[importlinter:contract:lncrawl-confined]
name = No lncrawl symbol outside its adapter (EF-SRC-033)
type = forbidden
source_modules =
    shelfhold.*
    shelfhold.plugin_host.*
    shelfhold.plugin_host.adapters.*
    shelfhold.plugin_host.adapters.meta.*
forbidden_modules =
    shelfhold.plugin_host.adapters.meta.lncrawl
ignore_imports =
    # The composition root builds the connected service of the user's own instance (M2 L25)
    shelfhold.composition -> shelfhold.plugin_host.adapters.meta.lncrawl
    # The host ships it loaded and switched off, with the settings of the source (L07)
    shelfhold.plugin_host.public -> shelfhold.plugin_host.adapters.meta.lncrawl

# Export plans what a library exports; it never triggers or reads acquisition, even through public.
[importlinter:contract:export-not-acquisition]
name = export never depends on acquisition
type = forbidden
allow_indirect_imports = True
source_modules =
    shelfhold.export
forbidden_modules =
    shelfhold.acquisition

# --- Hexagonal layers of every business context -----------------------------------------------

[importlinter:contract:library-layers]
name = Hexagonal layers of the library context
type = layers
layers =
    shelfhold.library.adapters
    shelfhold.library.application
    shelfhold.library.domain

[importlinter:contract:acquisition-layers]
name = Hexagonal layers of the acquisition context
type = layers
layers =
    shelfhold.acquisition.adapters
    shelfhold.acquisition.application
    shelfhold.acquisition.domain

[importlinter:contract:export-layers]
name = Hexagonal layers of the export context
type = layers
layers =
    shelfhold.export.targets
    shelfhold.export.application
    shelfhold.export.domain

[importlinter:contract:identity-layers]
name = Hexagonal layers of the identity context
type = layers
layers =
    shelfhold.identity.adapters
    shelfhold.identity.application
    shelfhold.identity.domain

# EF-BIB-045: one registry of copies and one function that counts them. The `replica` table is
# declared next to `content` in `schema.storage`, so the contract names the module: only the
# library adapters (and the schema package itself) may import it, and a test
# (`test_independent_copies_single_source_of_truth`) pins the `replica` table itself to the single
# module `library.adapters.replica`.
[importlinter:contract:replica-single-reader]
name = Only the library adapters read the storage tables; copies are counted by independent_copies
type = forbidden
source_modules =
    shelfhold
forbidden_modules =
    shelfhold.infrastructure.schema.storage
ignore_imports =
    shelfhold.infrastructure.schema -> shelfhold.infrastructure.schema.storage
    shelfhold.infrastructure.schema.** -> shelfhold.infrastructure.schema.storage
    shelfhold.library.replica -> shelfhold.infrastructure.schema.storage
    shelfhold.library.adapters.storage -> shelfhold.infrastructure.schema.storage
    shelfhold.library.adapters.safeguard -> shelfhold.infrastructure.schema.storage
    shelfhold.library.adapters.meta_projection -> shelfhold.infrastructure.schema.storage
    shelfhold.library.adapters.export_source -> shelfhold.infrastructure.schema.storage
    shelfhold.library.adapters.store_index -> shelfhold.infrastructure.schema.storage

# --- M1b (L00): confinement of the new dependencies and services ---------------------------------

# P8: py_webauthn is imported by the passkey module of identity and nowhere else.
[importlinter:contract:webauthn-confined]
name = webauthn is imported only by shelfhold.identity.webauthn
type = forbidden
source_modules =
    shelfhold
forbidden_modules =
    webauthn
ignore_imports =
    shelfhold.identity.webauthn.** -> webauthn

# EF-SRC-033 spirit for Sablier: the core never sees it, only integrations.sablier does. Levels are
# listed as for Suwayomi: a package never counts as importing itself.
[importlinter:contract:sablier-confined]
name = No Sablier symbol outside integrations.sablier
type = forbidden
source_modules =
    shelfhold.*
    shelfhold.integrations.*
forbidden_modules =
    shelfhold.integrations.sablier
ignore_imports =
    shelfhold.composition -> shelfhold.integrations.sablier

# EF-INT-027: only ops.backup writes the backup directory. The module that opens it is
# ops.backup.store; the rest of the code reaches backups through the ops.backup facade.
[importlinter:contract:backup-dir-sole-writer]
name = Only ops.backup writes the backup directory
type = forbidden
source_modules =
    shelfhold.*
    shelfhold.ops.*
forbidden_modules =
    shelfhold.ops.backup.store
ignore_imports =
    shelfhold.ops.backup.run -> shelfhold.ops.backup.store
    # read only (L17, EF-BIB-052 (5)): the names of the archives a purge reports; `open_existing`
    # and `names` create, write and decrypt nothing
    shelfhold.ops.backup.report -> shelfhold.ops.backup.store

# ENF-SEC-016, plugin host: third-party plugins are discovered and loaded by plugin_host alone.
# importlib is a package as a whole to the linter, so the stdlib users that only read resources
# or import their own sub-modules are listed.
[importlinter:contract:third-party-plugins-single-loader]
name = plugin_host is the only loader of third-party plugins
type = forbidden
source_modules =
    shelfhold
forbidden_modules =
    importlib
    pkgutil
    runpy
ignore_imports =
    shelfhold.plugin_host.** -> importlib
    shelfhold.i18n -> importlib
    shelfhold.interfaces.http_api.login -> importlib
    shelfhold.interfaces.cli.registry -> importlib
    shelfhold.interfaces.cli.registry -> pkgutil

# --- M2 (L00): trust boundary of imported EPUBs, OPF writing, native adapters, metadata ---------
# import-linter fails on a module that does not exist ("Module ... does not exist"), even as a
# source. The two packages whose contracts need a target are therefore created empty and
# documented now, and filled by their lots: `infrastructure.packaging.epub` (L09) and
# `plugin_host.adapters.native` (the first native source). The neutralizer module (L02) is never
# named: its contract uses the existing `content_trust.*` wildcard, which covers it on arrival.

# EF-BIB-051, ENF-SEC-015: xhtml_neutralizer is the one producer of the derivative of an
# `untrusted` EPUB and carries its own nh3 allowlist. Neither it nor any other content_trust
# module, nor the EPUB packager, goes through sanitize_upstream_text, whose profile fits
# descriptions and not XHTML: a second sanitising path for EPUB content would be a second producer.
[importlinter:contract:epub-derivative-single-producer]
name = EPUB content never goes through the upstream-text sanitiser
type = forbidden
source_modules =
    shelfhold.infrastructure.content_trust.*
    shelfhold.infrastructure.packaging.epub
forbidden_modules =
    shelfhold.infrastructure.content_trust.sanitize

# EF-BIB-051: packaging.epub is the only writer of an OPF. The neutralizer and the scan never
# rewrite it, and no other packager (CBZ, ComicInfo) reaches the EPUB writer.
[importlinter:contract:opf-sole-writer]
name = packaging.epub is the only writer of an OPF
type = forbidden
source_modules =
    shelfhold.infrastructure.content_trust
    shelfhold.infrastructure.packaging.cbz
    shelfhold.infrastructure.packaging.comicinfo
forbidden_modules =
    shelfhold.infrastructure.packaging.epub

# EF-SRC-033, ENF-SEC-001: a native adapter (plugin_host/adapters/native/<key>/) imports only
# shelfhold.sdk. The Fetcher is handed to it, never imported. Every core package is forbidden,
# the plugin_host modules and the meta adapters included (the package itself is an ancestor of the
# adapters, so its modules are named one by one; the registry loads the adapters, not the reverse).
[importlinter:contract:native-adapters-sdk-only]
name = Native adapters import only shelfhold.sdk
type = forbidden
source_modules =
    shelfhold.plugin_host.adapters.native
forbidden_modules =
    shelfhold.catalog
    shelfhold.acquisition
    shelfhold.library
    shelfhold.export
    shelfhold.identity
    shelfhold.integrations
    shelfhold.jobs
    shelfhold.events
    shelfhold.plugin_host.registry
    shelfhold.plugin_host.install
    shelfhold.plugin_host.authflow
    shelfhold.plugin_host.errors
    shelfhold.plugin_host.public
    shelfhold.plugin_host.adapters.meta
    shelfhold.interfaces
    shelfhold.infrastructure
    shelfhold.ops
    shelfhold.headless
    shelfhold.composition
    shelfhold.config
    shelfhold.i18n
    shelfhold.main

# The metadata context (provider merge, cache, quota) is part of the catalog and never reaches
# export, not even through its public module: metadata is proposed and stored, then exported by
# the export context, never the reverse.
[importlinter:contract:metadata-not-export]
name = The metadata context never imports export
type = forbidden
allow_indirect_imports = True
source_modules =
    shelfhold.catalog
forbidden_modules =
    shelfhold.export
