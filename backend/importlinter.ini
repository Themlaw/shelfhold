# Contracts declared before the code (ENF-QUAL-002, ENF-LEG-010). Run: lint-imports --config importlinter.ini
[importlinter]
root_package = shelfhold
include_external_packages = True

[importlinter:contract:domain-pure]
name = Domain imports neither sqlalchemy, fastapi nor httpx
type = forbidden
source_modules =
    shelfhold.catalog.domain
forbidden_modules =
    sqlalchemy
    fastapi
    httpx

[importlinter:contract:sdk-without-core]
name = The MIT SDK never imports the AGPL core
type = forbidden
source_modules =
    shelfhold.sdk
forbidden_modules =
    shelfhold.catalog
    shelfhold.acquisition
    shelfhold.library
    shelfhold.export
    shelfhold.identity
    shelfhold.integrations
    shelfhold.jobs
    shelfhold.events
    shelfhold.plugin_host
    shelfhold.interfaces
    shelfhold.infrastructure

[importlinter:contract:contexts-independent]
name = Business contexts are independent from each other
type = independence
modules =
    shelfhold.catalog
    shelfhold.acquisition
    shelfhold.library
    shelfhold.export
    shelfhold.identity

[importlinter:contract:catalog-layers]
name = Hexagonal layers of the catalog context
type = layers
layers =
    shelfhold.catalog.adapters
    shelfhold.catalog.application
    shelfhold.catalog.domain
