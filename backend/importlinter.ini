# Contracts declared before the code (ENF-QUAL-002, ENF-LEG-010). Run: lint-imports --config importlinter.ini
[importlinter]
root_package = shelfhold
include_external_packages = True

[importlinter:contract:domain-pure]
name = Domain imports neither sqlalchemy, fastapi nor httpx
type = forbidden
source_modules =
    shelfhold.*.domain
forbidden_modules =
    sqlalchemy
    fastapi
    httpx

[importlinter:contract:sdk-without-core]
name = The MIT SDK never imports the AGPL core
type = forbidden
source_modules =
    shelfhold.sdk
forbidden_modules =
    shelfhold.catalog
    shelfhold.acquisition
    shelfhold.library
    shelfhold.export
    shelfhold.identity
    shelfhold.integrations
    shelfhold.jobs
    shelfhold.events
    shelfhold.plugin_host
    shelfhold.interfaces
    shelfhold.infrastructure
    shelfhold.config
    shelfhold.main
    shelfhold.cli

[importlinter:contract:contexts-independent]
name = Business contexts are independent from each other
type = independence
modules =
    shelfhold.catalog
    shelfhold.acquisition
    shelfhold.library
    shelfhold.export
    shelfhold.identity
ignore_imports =
    shelfhold.** -> shelfhold.*.public
unmatched_ignore_imports_alerting = none

[importlinter:contract:catalog-layers]
name = Hexagonal layers of the catalog context
type = layers
layers =
    shelfhold.catalog.adapters
    shelfhold.catalog.application
    shelfhold.catalog.domain

[importlinter:contract:fastapi-only-in-interfaces]
name = FastAPI and Starlette are imported only by the HTTP interface
type = forbidden
allow_indirect_imports = True
source_modules =
    shelfhold.catalog
    shelfhold.acquisition
    shelfhold.library
    shelfhold.export
    shelfhold.identity
    shelfhold.integrations
    shelfhold.jobs
    shelfhold.events
    shelfhold.plugin_host
    shelfhold.infrastructure
    shelfhold.config
    shelfhold.main
    shelfhold.cli
    shelfhold.sdk
forbidden_modules =
    fastapi
    starlette

# ENF-GOV-002: a critical dependency is imported only by its adapter.
[importlinter:contract:critical-huey]
name = Huey is imported only by its job-queue adapter
type = forbidden
source_modules =
    shelfhold
forbidden_modules =
    huey
ignore_imports =
    shelfhold.jobs.huey_app -> huey
unmatched_ignore_imports_alerting = none

[importlinter:contract:critical-comicbox]
name = comicbox is imported only by its ComicInfo adapter
type = forbidden
source_modules =
    shelfhold
forbidden_modules =
    comicbox
ignore_imports =
    shelfhold.library.adapters.comicinfo -> comicbox
unmatched_ignore_imports_alerting = none
