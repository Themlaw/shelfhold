# Contrats déclarés avant le code (ENF-QUAL-002, ENF-LEG-010). Lancer : lint-imports --config importlinter.ini
[importlinter]
root_package = shelfhold
include_external_packages = True

[importlinter:contract:domain-pure]
name = Le domaine n'importe ni sqlalchemy, ni fastapi, ni httpx
type = forbidden
source_modules =
    shelfhold.catalog.domain
forbidden_modules =
    sqlalchemy
    fastapi
    httpx

[importlinter:contract:sdk-without-core]
name = Le SDK (MIT) n'importe jamais le coeur (AGPL)
type = forbidden
source_modules =
    shelfhold.sdk
forbidden_modules =
    shelfhold.catalog
    shelfhold.acquisition
    shelfhold.library
    shelfhold.export
    shelfhold.identity
    shelfhold.integrations
    shelfhold.jobs
    shelfhold.events
    shelfhold.plugin_host
    shelfhold.interfaces
    shelfhold.infrastructure

[importlinter:contract:contexts-independent]
name = Les contextes metier sont independants entre eux
type = independence
modules =
    shelfhold.catalog
    shelfhold.acquisition
    shelfhold.library
    shelfhold.export
    shelfhold.identity

[importlinter:contract:catalog-layers]
name = Couches hexagonales du contexte catalog
type = layers
layers =
    shelfhold.catalog.adapters
    shelfhold.catalog.application
    shelfhold.catalog.domain
