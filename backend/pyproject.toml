[project]
name = "shelfhold"
version = "0.1.0"
description = "Shelfhold : l'atelier de la bibliothèque personnelle de votre foyer, pour Kavita."
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.156.4",
    "starlette>=1.3.1",  # ENF-SEC-016 floor (CVE-2026-54283, CVE-2026-54282)
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.5",
    "alembic>=1.20.0",
    "structlog>=26.1.0",
    # M1a (L00). Floors are ENF-SEC-016; the rationale of each is in docs/dependencies.md.
    "huey>=3.5.4,<3.6",  # job queue behind shelfhold.jobs.huey_app (spike S1 verified 3.5.4)
    "argon2-cffi>=25.1.0",  # password hashing (argon2id)
    "pynacl>=1.6.2",  # XChaCha20-Poly1305 for secrets and tombstones
    "pyrage>=1.4.0",  # age/scrypt for the passphrase-protected keyring export
    "defusedxml>=0.7.1",  # hardened XML parsing (ENF-SEC-014)
    "nh3>=0.3.7",  # HTML sanitising of upstream text (ENF-SEC-015)
    "httpx2>=2.16.0",  # outbound HTTP client (the fetcher); httpx is the fallback
    "apprise>=2.1,<3",  # notifications (ENF-SEC-016)
    "pillow>=13.0.0",  # ENF-SEC-016 floor (GHSA-wqgw-9xfh-qf2g, GHSA-xcvg-w56q-r89m)
    "python-multipart>=0.0.30",  # ENF-SEC-016 floor (CVE-2026-53539, CVE-2026-53538)
    "python-ulid>=3.0.0",  # identifiers
    "langcodes>=3.5.1",  # normalize_lang() (ADR-0042); fallback: a frozen alias table
    "tzdata>=2026.1",  # Europe/Paris for the maintenance window; python-slim ships no zoneinfo
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "diff-cover>=9",
    "actionlint-py>=1.7",
    "zizmor>=1.0",
    "hypothesis>=6.140",
    "syrupy>=6.1.1",
    "xmlschema>=4.3.2",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
shelfhold = "shelfhold.interfaces.cli:main"

[tool.uv]
# Supply chain: only releases published at least 14 days ago (decision M0 10, ADR-0016).
exclude-newer = "14 days"
# Targeted exceptions to the 14-day window, removable once both versions are older than 14 days
# (2026-11-15): huey 3.5.4 (2026-11-01) was verified by spike S1 and apprise 2.1.0 (2026-10-24) is
# the floor required by ENF-SEC-016. See docs/dependencies.md.
exclude-newer-package = { huey = "2026-11-02T00:00:00Z", apprise = "2026-11-02T00:00:00Z" }
# ENF-SEC-016 security floors for packages that may arrive transitively or later.
constraint-dependencies = [
    "python-multipart>=0.0.30",
    "pillow>=13.0.0",
    "apprise>=2.1,<3",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not contract'"
markers = [
    "req(*ids): requirement IDs (EF-/ENF-) the test verifies; see tools/traceability.py",
    "property: Hypothesis property tests (tests/property); marker applied from the directory",
    "golden: syrupy snapshot / golden-file tests (tests/golden); marker applied from the directory",
    "faults: fault-injection and crash tests (tests/faults); marker applied from the directory",
    "bench: culpable benches with a threshold from the spec (tests/bench); marker applied from the directory",
    "contract: contract bench against a real pinned Suwayomi (needs Docker; run with -m contract)",
]

[tool.coverage.run]
source = ["src/shelfhold"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# ENF-SEC-002 / ENF-SEC-014: no way around the single entry points, and no dynamic import to hide one.
"shutil.unpack_archive".msg = "Use shelfhold.infrastructure.archives.safe_open_archive (ENF-SEC-002)."
"importlib.import_module".msg = "Dynamic imports can hide a banned module; import statically."
"builtins.__import__".msg = "Dynamic imports can hide a banned module; import statically."
# EF-EXP-060 / ENF-SEC-012: files are written through infrastructure.fsops only. The exceptions
# (per-file-ignores) write under /data, never under a library root.
"os.replace".msg = "Write through shelfhold.infrastructure.fsops (EF-EXP-060)."
"os.rename".msg = "Write through shelfhold.infrastructure.fsops (EF-EXP-060)."
"os.renames".msg = "Write through shelfhold.infrastructure.fsops (EF-EXP-060)."
"os.unlink".msg = "Write through shelfhold.infrastructure.fsops (EF-EXP-060)."
"os.remove".msg = "Write through shelfhold.infrastructure.fsops (EF-EXP-060)."
"os.rmdir".msg = "Write through shelfhold.infrastructure.fsops (EF-EXP-060)."
"os.removedirs".msg = "Write through shelfhold.infrastructure.fsops (EF-EXP-060)."
"os.link".msg = "Write through shelfhold.infrastructure.fsops (EF-EXP-060)."
"os.symlink".msg = "Write through shelfhold.infrastructure.fsops (EF-EXP-060)."
"os.mkdir".msg = "Write through shelfhold.infrastructure.fsops (EF-EXP-060)."
"os.makedirs".msg = "Write through shelfhold.infrastructure.fsops (EF-EXP-060)."
"os.truncate".msg = "Write through shelfhold.infrastructure.fsops (EF-EXP-060)."
"os.open".msg = "Open through shelfhold.infrastructure.fsops (EF-EXP-060); /data files are per-file exceptions."
"shutil.rmtree".msg = "Delete through shelfhold.infrastructure.fsops (EF-EXP-060, EF-USR-024)."
"shutil.move".msg = "Move through shelfhold.infrastructure.fsops (EF-EXP-060)."
# ENF-SEC-001: every outbound connection goes through the Fetcher (SSRF guard). Allowed only in
# infrastructure/fetcher and in the local CLI over a Unix socket (infrastructure/local_socket, L23).
"urllib.request".msg = "Outbound HTTP goes through shelfhold.infrastructure.fetcher (ENF-SEC-001)."
"http.client".msg = "Outbound HTTP goes through shelfhold.infrastructure.fetcher (ENF-SEC-001)."
"asyncio.open_connection".msg = "Outbound connections go through the Fetcher (ENF-SEC-001)."
"socket.create_connection".msg = "Outbound connections go through the Fetcher (ENF-SEC-001)."
"socket.socket".msg = "Outbound connections go through the Fetcher (ENF-SEC-001)."

[tool.ruff.lint.per-file-ignores]
# the CLI registry discovers its own command modules by name (package-local, never user input)
"src/shelfhold/interfaces/cli/registry.py" = ["TID251"]
"src/shelfhold/infrastructure/fsops/**" = ["TID251"]
"src/shelfhold/infrastructure/migrate.py" = ["TID251"]
"src/shelfhold/infrastructure/volumes.py" = ["TID251"]
"src/shelfhold/infrastructure/instance/lock.py" = ["TID251"]  # /data/.lock
"src/shelfhold/infrastructure/secrets/keyring.py" = ["TID251"]  # /data/keyring
"src/shelfhold/jobs/huey_app.py" = ["TID251"]  # the queue database under /data
"src/shelfhold/infrastructure/fetcher/**" = ["TID251"]
# the local CLI socket: AF_UNIX only, created in /data (EF-USR-024); never an outbound connection
"src/shelfhold/infrastructure/local_socket/**" = ["TID251"]
# tests are not production egress (the contract bench talks to a pinned Suwayomi container)
"tests/**" = ["S101", "TID251"]
"src/shelfhold/infrastructure/secrets/atomic.py" = ["TID251"]  # /data and the operator-chosen export file
"tests/unit/test_governance_docs.py" = ["S101", "S603", "S607"]
"tests/contract/**" = ["S101", "S106", "E501", "TID251"]
# 0.0.0.0 is the sinkhole answer under test, not a bind address
"tests/**/test_fetcher*.py" = ["S104"]
"../e2e/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["shelfhold"]

[[tool.mypy.overrides]]
# huey ships no types; it is only imported by shelfhold.jobs.huey_app (ENF-GOV-002).
module = ["huey", "huey.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# defusedxml ships no types; it is only imported by shelfhold.infrastructure.xml (ENF-SEC-014).
# pyrage (age) ships no types; it is only imported by shelfhold.infrastructure.secrets.export.
module = ["defusedxml", "defusedxml.*", "pyrage", "pyrage.*"]
ignore_missing_imports = true
