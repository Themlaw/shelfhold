[project]
name = "shelfhold"
version = "0.1.0"
description = "Shelfhold : l'atelier de la bibliothèque personnelle de votre foyer, pour Kavita."
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.156.4",
    "starlette>=1.3.1",  # ENF-SEC-016 floor (CVE-2026-54283, CVE-2026-54282)
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.5",
    "alembic>=1.20.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "diff-cover>=9",
    "actionlint-py>=1.7",
    "zizmor>=1.0",
    "httpx2>=2.16.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
shelfhold = "shelfhold.cli:main"

[tool.uv]
# Supply chain: only releases published at least 14 days ago (decision M0 10, ADR-0016).
exclude-newer = "14 days"
# ENF-SEC-016 security floors for packages that may arrive transitively or later.
constraint-dependencies = [
    "python-multipart>=0.0.30",
    "pillow>=13.0.0",
    "apprise>=2.1,<3",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not contract'"
markers = [
    "req(*ids): requirement IDs (EF-/ENF-) the test verifies; see tools/traceability.py",
    "contract: contract bench against a real pinned Suwayomi (needs Docker; run with -m contract)",
]

[tool.coverage.run]
source = ["src/shelfhold"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/unit/test_governance_docs.py" = ["S101", "S603", "S607"]
"tests/contract/**" = ["S101", "S106", "E501"]
"../e2e/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["shelfhold"]
