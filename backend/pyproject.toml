[project]
name = "shelfhold"
version = "0.0.0"
description = "Shelfhold : l'atelier de la bibliothèque personnelle de votre foyer, pour Kavita."
readme = "../README.md"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-or-later"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "diff-cover>=9",
    "actionlint-py>=1.7",
    "zizmor>=1.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["shelfhold"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["shelfhold"]
