[tools]
python = "3.13"
uv = "0.12"

[tasks.setup]
description = "Installe les dependances du backend"
run = "uv sync --project backend --locked"

[tasks.test]
description = "Tests du backend avec couverture"
run = "uv run --project backend pytest --cov"
dir = "backend"

[tasks.lint]
description = "ruff, mypy, import-linter"
dir = "backend"
run = [
  "uv run ruff check .",
  "uv run ruff format --check .",
  "uv run mypy",
  "uv run lint-imports --config importlinter.ini",
]

[tasks.fmt]
description = "Formate le backend"
dir = "backend"
run = ["uv run ruff check --fix .", "uv run ruff format ."]
