[tools]
python = "3.13"
uv = "0.12"
node = "24"

[tasks.setup]
description = "Install backend dependencies"
run = "uv sync --project backend --locked"

[tasks.test]
description = "Backend tests with coverage"
run = "uv run --project backend pytest --cov"
dir = "backend"

[tasks.lint]
description = "ruff, mypy, import-linter"
dir = "backend"
run = [
  "uv run ruff check .",
  "uv run ruff format --check .",
  "uv run mypy",
  "uv run lint-imports --config importlinter.ini",
]

[tasks.fmt]
description = "Format the backend"
dir = "backend"
run = ["uv run ruff check --fix .", "uv run ruff format ."]

[tasks."openapi"]
description = "Regenerate open-api/openapi.json and the TypeScript client"
run = "open-api/generate.sh"

[tasks."lint:front"]
description = "ESLint and svelte-check on the frontend"
dir = "frontend"
run = ["npm run lint", "npm run check"]
