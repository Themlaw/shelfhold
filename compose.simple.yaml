# Shelfhold, simple compose: the shortest setup that works, for a first try on a trusted home network.
# For a library you care about, use the hardened reference instead: compose.yaml (read-only root
# filesystem, no capabilities, memory and process limits, log rotation, no core dumps).
#
# Same image and tag as compose.yaml (`1.0` follows the 1.0.x releases; `edge` is the development
# image). Host directories must be writable by uid 1000:
#   mkdir -p data store && sudo chown 1000:1000 data store

services:
  shelfhold:
    image: ghcr.io/themlaw/shelfhold:1.1
    container_name: shelfhold
    # Migrations first (backup named by revision, ENF-OPS-002), then the server; a failed migration
    # exits non-zero and serves nothing. Written out because the 1.0 images predate the image's own
    # `serve --migrate` default (from 1.1 on, this line can go).
    command: ["sh", "-c", "shelfhold migrate && exec shelfhold serve"]
    user: "1000:1000"
    # Settings: copy .env.example to .env and edit it (optional; Compose 2.24 or later).
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./data:/data     # database, config, thumbnails (local disk, not NFS)
      - ./store:/store   # kept copies, a separate folder from ./data
    # >>> plugin-runner core
    # volumes:
    #   - ./plugin-rpc:/plugin-rpc
    # <<< plugin-runner
    init: true
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/shelfhold-healthcheck"]
      start_period: 10m  # migration budget (ENF-OPS-002)
    restart: unless-stopped

  # Isolated third-party plugins (D-P1, docs/admin/plugins-isoles.md): optional, off by default.
  # Steps, in this order (the companion refuses to start when it can see /data or has a network):
  #   1. mkdir -p plugin-rpc data/plugins && sudo chown 1001:1001 plugin-rpc && sudo chmod 755 plugin-rpc data/plugins
  #   2. uncomment the `plugin-runner` service below (same indentation as `shelfhold:`);
  #   3. add the `./plugin-rpc:/plugin-rpc` line to the `volumes:` of `shelfhold`;
  #   4. docker compose up -d, then docker compose logs plugin-runner (it prints that its sandbox is as required).
  # A data folder or a named volume made by an earlier version keeps the modes it had: the companion
  # (same image, another uid) must not read /data and /store, so run once, as the core:
  #   docker compose exec shelfhold chmod 700 /data /store
  # The companion also needs a kernel with Landlock ABI 3 or later (kernel 6.2 or later; `cat /sys/kernel/security/lsm`
  # lists it) and refuses to start without it, whatever the rest.
  # >>> plugin-runner service
  # plugin-runner:
  #   image: ghcr.io/themlaw/shelfhold:1.1   # the same image as the core: always the same tag
  #   container_name: shelfhold-plugin-runner
  #   command: ["shelfhold", "plugin-runner"]
  #   user: "1001:1001"                      # another uid than the core's (1000)
  #   network_mode: none                     # no network, not even a private one
  #   read_only: true
  #   cap_drop: [ALL]
  #   security_opt: ["no-new-privileges:true"]
  #   ulimits:
  #     core: 0
  #   init: true
  #   mem_limit: 512m
  #   pids_limit: 128
  #   tmpfs: ["/tmp:size=64m"]               # each plugin's scratch folder: the one place it may write
  #   volumes:
  #     - ./data/plugins:/plugins:ro         # the wheels the core installs: read-only here
  #     - ./plugin-rpc:/plugin-rpc           # the socket the core connects to: nothing else
  #   healthcheck:
  #     test: ["CMD", "shelfhold", "plugin-runner", "--healthcheck"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 20s
  #   restart: unless-stopped
  # <<< plugin-runner
