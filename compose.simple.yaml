# Shelfhold, simple compose: the shortest setup that works, for a first try on a trusted home network.
# For a library you care about, use the hardened reference instead: compose.yaml (read-only root
# filesystem, no capabilities, memory and process limits, log rotation, no core dumps).
#
# Same image and tag as compose.yaml (`1.0` follows the 1.0.x releases; `edge` is the development
# image). Host directories must be writable by uid 1000:
#   mkdir -p data store && sudo chown 1000:1000 data store

services:
  shelfhold:
    image: ghcr.io/themlaw/shelfhold:1.0
    container_name: shelfhold
    # Applies pending database migrations at start (`shelfhold serve --migrate`), then serves.
    user: "1000:1000"
    # Settings: copy .env.example to .env and edit it (optional; Compose 2.24 or later).
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./data:/data     # database, config, thumbnails (local disk, not NFS)
      - ./store:/store   # kept copies, a separate folder from ./data
    init: true
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/shelfhold-healthcheck"]
      start_period: 10m  # migration budget (ENF-OPS-002)
    restart: unless-stopped
